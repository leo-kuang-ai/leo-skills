id: approximation-preserve
title: approximately / roughly 模糊量不被精确化
description: 验证 approximately 2 hours 与 roughly 40% 保留约数标记（大约/约/左右），不得译成"整整 2 小时/正好 40%"。

input:
  prompt: |
    请把下面这段迁移记录准确翻译成简体中文：

    The migration takes approximately 2 hours to finish; roughly 40% of the requests during the window were retries.

constraints:
  max_turns: 1

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_approximation_preserve.py
  timeout_seconds: 10
