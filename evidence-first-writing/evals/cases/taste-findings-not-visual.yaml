id: taste-findings-not-visual
title: 编辑品味 finding 不借用视觉 taste 词汇
description: |
  验证审查概念堆砌、记忆点互相竞争的文章时：finding 覆盖选择/密度/推进/记忆点/
  克制等品味维度并引用具体文本；不把文字品味问题转成前端视觉建议。对齐
  eval-plan Case 17 的确定性子集（finding 数量 3-7 无法用子串断言验证）。

input:
  prompt: |
    请审查下面这段文字的品味问题，只审查不重写，输出最有杠杆的少数几个 finding 并引用具体文本：

    在数字化浪潮中，企业需要中台、敏捷、DevOps、微服务、数据驱动、AI 赋能、组织升级与第二曲线。中台是企业的航母。数据是新时代的石油。敏捷是进化的基因。每一次转型，都是一场自我革命。唯有拥抱变化，方能致远。

constraints:
  timeout_seconds: 300
  max_turns: 2

judge:
  type: rule_based
  success:
    - output_contains:
        any: ["选择", "密度", "推进", "记忆点", "克制", "取舍", "杠杆", "张力", "具体"]
    - output_contains:
        any: ["堆砌", "概念过多", "拥挤", "过密", "信息密度", "概念密度", "互相竞争", "争夺", "罗列", "清单", "塞入", "倾倒", "净信息量"]
    - output_contains:
        any: ["「", "引用", "原句", "原文", "“"]
        not: ["换成无衬线字体", "改用浅色", "卡片式布局", "配色方案", "调整字体"]
