id: intensity-adverbs-preserve
title: 程度强化词不得丢失或弱化
description: significantly/far more/much faster 译出显著/远比/快得多级强化，不得弱化为略微/稍微/小幅。

input:
  prompt: |
    请把下面的性能评审翻译成简体中文：

    The new allocator significantly reduces tail latency under bursty load. The tiered cache
    is far more effective than the old LRU design, and users notice much faster cold starts.

constraints:
  max_turns: 1

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_intensity_adverbs.py
  timeout_seconds: 10
