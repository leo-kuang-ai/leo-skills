id: content-quality-u19
title: 跨行业内容质量 U19 大宗商品贸易（直出（含随附材料））
description: |
  方案 005 跨行业内容质量测评单元：大宗商品贸易。真实 agent 运行 execute 模式 generate
  路线至内容与风格合同完成、样张前截断；A1–A5 判据由评测侧 L0 机检与 L1 双判官在冻结
  产物上离线评审；内联 judge 仅检查停止点执行边界，harness 通过≠内容达标。

input:
  prompt: |
    使用 $leo-ppt-generator，进入 execute 模式 generate 路线，完成以下委托任务。这是一次评测委托：内容与风格合同层是本次唯一交付物。
    
    【委托与边界】
    1. 委托执行：合同、大纲、母版、风格与版式决策均由你在授权范围内自主推进并记录为委托决策（decision_source: user-delegated，附依据），无需中途向用户确认；可逆决策自行完成内部审查并留痕。
    2. 停止点：完成「内容合同 → 大纲 → 逐页母版 → 风格选定（style list/load/render，同一 home，记录 selection_fingerprint 与归因一句）→ 版式调度（逐页 P 码）→ 容量预检」后即停止。不要生成样张或任何图片，不要派发任何 worker，不要调用图片 Provider；本次无需核对图片 Provider/worker 可用性。
    3. 落盘范围：一切产物只写入当前工作目录下的 ./project/ 子树（项目根目录用 ./project/；风格注册表 home 一律隔离在该子树内，如 ./project/leo-home/），不得写该子树之外的任何位置。
    4. 材料边界：只依据下面的任务简报与随附材料；不联网检索；不读取本任务输入之外的任何文件。材料/简报未给出的关键事实不足时，按合同纪律披露并收窄断言（unknown），不要编造。
    5. blocked 纪律：如遇无法可靠推断且必须用户补答的关键事实，记录 blocked 项与原因，继续完成其余部分；不得模拟用户答案或伪造人工确认。
    6. 完成后回复一页摘要：产物路径清单（合同/大纲/母版/风格选择记录/版式调度记录）、确切页数、风格选择与归因一句、容量预检结论（含软超如实报告）、blocked 清单（若有）。
    
    【任务简报】
    # 任务简报 U19 · 大宗商品贸易 —— 铜贸业务风险敞口与对冲策略复盘
    
    - 行业：大宗商品贸易（梯度 G2：无专属内容规则；亦无专属风格资产）
    - 任务型：汇报（风险复盘）
    - 主要受众：公司管理层（贸易公司的风险管理与经营班子）
    - 材料形态：直出（价格与套保台账，随附）
    - 难度型：不确定
    - 页数：**11 页**（含封面与收束页，从总数内分配）
    
    ## 委托方与背景
    
    你是「汇金商贸」风控部的衍生品分析岗。公司做有色金属贸易（以电解铜为主，含少量铝），业务模式为背靠背点价+少量库存自营。上个季度铜价经历了一轮先急跌后急涨的行情，公司的套保执行出现了两处偏差：一次延迟套保（自营库存裸露约 5 个交易日）、一次超量套保（套保头寸超出现货敞口，形成单边投机暴露，被交易所仓单核查关注）。风控委员会要求做一次专题复盘，你受委托准备 11 页复盘汇报稿。
    
    ## 任务目标
    
    复盘要完成：季度行情与公司敞口的对照还原（哪里赚了结构钱、哪里亏了执行钱）；两处套保偏差的事实链还原（触发、发现、处置、损失/影响量化口径）；套保制度的修订建议与剩余风险。行动目标是委员会批准修订后的套保执行权限与阈值。
    
    ## 受众与场合
    
    风控委员会与经营班子（总经理、贸易总监、财务总监、风控总监）；场合为专题复盘会 30 分钟。这个受众对「价格方向判断」有本能的兴趣，但复盘会的纪律恰恰是：方向判断不能成为制度修订的依据——没人能预知行情，制度要管住任何行情下的行为。
    
    ## 决策背景
    
    复盘的难点是**不确定**：本季度两处偏差一亏一赚（延迟套保那次赶上反弹反而少亏/多赚，超量套保那次被行情惩罚）——「结果好」不等于「行为对」，复盘必须把行为对错与结果盈亏拆开评价，否则制度修订会被结果导向带偏。同时材料中的盈亏量化存在两个口径（逐日盯市口径 vs 现金流口径），叠加影响量化必须先定口径。行情归因部分（宏观事件与供需节奏）只能以「事后解释框架」呈现，不得写成公司的前瞻能力。
    
    ## 约束
    
    1. 全部敞口、价格、套保数据来自随附材料并保持口径（点价口径、盯市口径）；盈亏量化须先声明口径再给数，两口径并存时分别呈现。
    2. 两处偏差按「行为—结果」两轴分别评价：行为对错依据制度条文（材料附有现行套保制度摘要），不得因结果好而豁免行为违规，也不得因结果差而夸大行为问题。
    3. 行情解释只能作为事后归因框架并标注其解释性质，不得用于论证「如果当时如何就能如何」的反事实收益。
    4. 制度修订建议须落到可执行参数（权限、阈值、时限、检查频率），依据链（数据→判读→建议）完整；给不出数据支撑的参数显式标注「经验值」。
    5. 贸易与风控术语规范（敞口、套保比例、点价、基差、盯市等按行业含义），不得混用生活化表述。
    
    ## 材料指引
    
    随附材料为《铜贸三季度风控复盘数据包（内部）》，含季度价格区间与关键事件时点、敞口与套保台账（含两处偏差的执行记录）、盈亏两口径对照表、现行套保制度摘要。价格与台账数字密度高——复盘稿须取舍组织并严格锚定材料口径。
    
    【随附材料】（材料引用级来源，允许输入的全部；数字与口径以此为准）
    # 铜贸三季度风控复盘数据包（内部）
    
    > 来源：风控部敞口监控系统、期货账户结算单（逐日盯市）、财务部现金流台账、现行《套期保值管理制度（2024 修订）》。统计期 2026-07-01 至 2026-09-30。密级：内部。
    
    ## 一、季度行情与关键事件（公开行情 + 内部台账）
    
    - 电解铜现货均价区间：72,300 – 81,500 元/吨（季度内）
    - 关键事件时点：
      - 07-12 宏观利空急跌：单日现货 -4.2%（收 73,800）
      - 08-04 库存拐点反弹启动：至 08-15 累计 +3.1%（76,100）
      - 09-20 挤仓预警：近月合约波动放大，两日 +2.8%（80,300 附近）
    - 公司季度贸易量：3.2 万吨（背靠背点价 2.75 万吨 + 自营 0.45 万吨）
    
    ## 二、两处套保偏差事实链（监控系统 + 结算单）
    
    ### 偏差 1：延迟套保（08-11 至 08-15）
    
    - 事实：08-08 起自营库存 1,850 吨（前一背靠背合同交付后回补库存），按制度应在库存形成后 T+1 内完成卖出套保；实际因交易岗休假交接，08-11 至 08-15 共 5 个交易日未套保（裸露），08-16 补齐套保头寸
    - 期间行情：08-11 至 08-16 现货 +2.4%（74,300 → 76,100）
    - 结果（逐日盯市口径）：裸露期间库存增值约 **+280 万元**；若按制度及时套保，该段增值将被期货空头对冲（约为零）——**行为违规、结果为正**
    - 监控发现时点：08-13 系统预警（T+2 阈值），风控专员邮件提醒，08-16 执行
    
    ### 偏差 2：超量套保（09-18）
    
    - 事实：09-18 建立卖出套保头寸 5,600 吨，当日现货敞口 4,300 吨，超量 1,300 吨（构成单边净空头 1,300 吨）；按制度，套保比例上限 100%，超出 90% 部分须风控总监事前审批——本次未经审批（交易主管以「预判到货 1,000 吨」为由先行建仓，到货未实现）
    - 期间行情：09-20 至 09-23 现货 +2.8%（78,100 → 80,300）
    - 结果（逐日盯市口径）：超量部分期货端亏损 1,300 吨 × 78,100 × 2.8% ≈ **-284 万元**（现货与正常套保部分按制度对冲，不计入偏差损失）
    - 交易所关注：09-22 收到交易所仓单核查问询函（净空头持仓与现货规模匹配性），已提交说明材料，**后续处理结果未出（unknown）**
    
    ## 三、盈亏两口径对照（财务部）
    
    | 口径 | 偏差 1 计入 | 偏差 2 计入 | 说明 |
    | --- | --- | --- | --- |
    | 逐日盯市（结算单） | +280 万 | -284 万 | 期货端逐日结算 + 现货按日估值 |
    | 现金流（收付实现） | +0（库存未售） | -96 万（已平仓部分保证金划转） | 现货未实现部分不确认；期货部分平仓进度 34% |
    
    - 注：两口径并列呈现，不得只报其一；「合计影响」必须先声明口径
    
    ## 四、现行制度要点摘要（《套期保值管理制度（2024 修订）》）
    
    - 套保比例：现货敞口的 80%–100%
    - 执行时限：敞口形成后 T+1 个交易日内
    - 审批权限：套保比例超 90% 或金额超 5,000 万 → 风控总监事前审批；单边净头寸 = 0 容忍（禁止投机）
    - 监控：风控系统 T+2 预警阈值，风控专员日终核查
    
    ## 五、风控部初析（供复盘参考，非结论）
    
    - 偏差 1 根因线索：岗位交接无备份授权人（制度未规定假期套保代理）；结果为正属行情巧合，不改变行为违规定性
    - 偏差 2 根因线索：交易主管「预判到货」先建仓的做法此前有先例（2025-11 一次，行情平稳未触发关注）；制度对「预期到货」是否可作套保依据存在空白
    - 行情归因（宏观急跌、库存拐点、挤仓）仅为事后解释框架，**不得用于反事实收益测算**
    
    ## 六、口径与红线注释
    
    1. 盈亏引用必须先声明口径（盯市/现金流），两口径并存时分别列示。
    2. 偏差定性按「行为—结果」两轴：行为依制度条文，结果按口径量化；不得以结果代行为定性。
    3. 交易所问询后续结果 unknown，如实登记。
    4. 反事实表述（「如果当时……」）禁止进入结论页。

constraints:
  max_turns: 48
  timeout_seconds: 3600

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_content_execution_boundary.py
  timeout_seconds: 10

collect_artifacts:
  - "project/**"
