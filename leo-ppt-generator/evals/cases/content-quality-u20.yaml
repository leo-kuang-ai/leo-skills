id: content-quality-u20
title: 跨行业内容质量 U20 人力资源服务（只给目标（无随附材料））
description: |
  方案 005 跨行业内容质量测评单元：人力资源服务。真实 agent 运行 execute 模式 generate
  路线至内容与风格合同完成、样张前截断；A1–A5 判据由评测侧 L0 机检与 L1 双判官在冻结
  产物上离线评审；内联 judge 仅检查停止点执行边界，harness 通过≠内容达标。

input:
  prompt: |
    使用 $leo-ppt-generator，进入 execute 模式 generate 路线，完成以下委托任务。这是一次评测委托：内容与风格合同层是本次唯一交付物。
    
    【委托与边界】
    1. 委托执行：合同、大纲、母版、风格与版式决策均由你在授权范围内自主推进并记录为委托决策（decision_source: user-delegated，附依据），无需中途向用户确认；可逆决策自行完成内部审查并留痕。
    2. 停止点：完成「内容合同 → 大纲 → 逐页母版 → 风格选定（style list/load/render，同一 home，记录 selection_fingerprint 与归因一句）→ 版式调度（逐页 P 码）→ 容量预检」后即停止。不要生成样张或任何图片，不要派发任何 worker，不要调用图片 Provider；本次无需核对图片 Provider/worker 可用性。
    3. 落盘范围：一切产物只写入当前工作目录下的 ./project/ 子树（项目根目录用 ./project/；风格注册表 home 一律隔离在该子树内，如 ./project/leo-home/），不得写该子树之外的任何位置。
    4. 材料边界：只依据下面的任务简报与随附材料；不联网检索；不读取本任务输入之外的任何文件。材料/简报未给出的关键事实不足时，按合同纪律披露并收窄断言（unknown），不要编造。
    5. blocked 纪律：如遇无法可靠推断且必须用户补答的关键事实，记录 blocked 项与原因，继续完成其余部分；不得模拟用户答案或伪造人工确认。
    6. 完成后回复一页摘要：产物路径清单（合同/大纲/母版/风格选择记录/版式调度记录）、确切页数、风格选择与归因一句、容量预检结论（含软超如实报告）、blocked 清单（若有）。
    
    【任务简报】
    # 任务简报 U20 · 人力资源服务 —— HR SaaS 的系统替换选型提案
    
    - 行业：人力资源服务（梯度 G2：无专属内容规则；亦无专属风格资产）
    - 任务型：路演（选型提案）
    - 主要受众：客户决策层（大型制造企业的 HR 共享服务中心负责人与信息化分管领导）
    - 材料形态：只给目标（无随附材料）
    - 难度型：决策
    - 页数：**11 页**（含封面与收束页，从总数内分配）
    
    ## 委托方与背景
    
    你是 HR SaaS 厂商「知人云」的客户方案负责人。一家 1.2 万人的大型制造企业（脱敏代号「D 集团」）现有的本地部署人事系统已服役 9 年，决定整体替换，向五家厂商发出选型邀请。D 集团的特殊性：三地工厂+总部四套人事流程并存、蓝领与白领双群体（考勤与排班规则差异极大）、历史数据迁移量大。你受委托准备 11 页选型提案，下周向 D 集团的 HR 共享服务中心负责人与信息化分管领导汇报。
    
    ## 任务目标
    
    提案要完成：对 D 集团现状痛点的诊断式理解（从公开信息与选型说明会获得的信息出发，不假装做过详调）；替换路径的分期建议（一次性切换 vs 分模块迁移 vs 双轨并行）与推荐依据；实施周期、风险与保障机制。行动目标是进入 D 集团的 POC 测试短名单（选三家）。
    
    ## 受众与场合
    
    HR 共享服务中心负责人（业务视角：流程顺畅、员工投诉少）与信息化分管领导（技术视角：数据迁移完整性、接口、国产化合规）；场合为选型提案会 30 分钟。这个受众的雷区是「过度承诺」：9 年老系统替换的失败案例业内流传很多，任何「无缝迁移」「三个月全量上线」的说法都会直接扣分。
    
    ## 决策背景
    
    本单元为「只给目标」形态：D 集团没有提供内部数据（人员结构、流程清单、系统接口文档都未给），提案的诊断与方案只能建立在：选型说明会公开信息（四地四流程、双群体、9 年系统）+ 制造业 HR 的一般规律 + 明确标注的假设。决策背景的真实张力：客户高层倾向「一步到位」（怕拖），共享服务中心实操层倾向「稳」（怕乱），你的分期建议必须有说服两家人的论证结构——这也是「决策」难度型的核心：分期方案对比的判据设计。
    
    ## 约束
    
    1. 本任务**无随附数据材料**：D 集团的具体数字（人数分布、流程数量、迁移数据量）不得出现具体值（1.2 万人总规模为简报给定事实可用）；实施周期与工作量允许「估算」级参数化表达（按模块×复杂度分档）并标注假设。
    2. 现状诊断须标注信息来源（选型会公开信息/行业一般规律/假设推断三类分标），不得把推断写成详调发现。
    3. 三种替换路径（一次性/分模块/双轨）的对比须结构化（风险、周期、成本结构、组织冲击），推荐结论给判据权重；客户高层的「一步到位」倾向不得被迎合成无风险叙事。
    4. 数据迁移风险须专页处理（完整性校验、回退方案、并行对账机制），不承诺「无缝」。
    5. 术语规范（共享服务中心、eHR、考勤排班规则引擎、数据全量迁移等按行业含义使用）；收束页行动项可核（如「两周内提交 POC 场景清单与验收标准」）。
    
    ## 材料指引
    
    本单元为「只给目标」形态：以上简报即全部输入。允许基于明确估算/示意组织内容，关键事实不足处披露并收窄断言；涉及 D 集团内部状况的表述一律标注信息来源等级。
    
    （本单元无随附材料——只给目标形态，约束见简报「材料指引」节。）

constraints:
  max_turns: 48
  timeout_seconds: 3600

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_content_execution_boundary.py
  timeout_seconds: 10

collect_artifacts:
  - "project/**"
