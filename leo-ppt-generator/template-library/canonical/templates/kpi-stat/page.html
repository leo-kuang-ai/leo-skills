<!doctype html>
<!-- 项目扩展模板：kpi-stat（咨询级 KPI 数据页）
  七条合同：?leo_render=1 禁动画 / data-leo-ready 信号 / 数据只读
  __LEO_SLIDE_DATA__ / 字体经 /leo-fonts/ HTTP / 1280x720 overflow hidden /
  data-leo-block 锚点 / 块完整落画幅（溢出哨兵友好）。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>kpi-stat</title>
<style>
  @font-face { font-family:"Noto Sans SC"; src:url(/leo-fonts/NotoSansSC-Regular.otf) format("opentype"); font-weight:400; }
  @font-face { font-family:"Noto Sans SC"; src:url(/leo-fonts/NotoSansSC-Bold.otf) format("opentype"); font-weight:700; }
  * { margin:0; padding:0; box-sizing:border-box; letter-spacing:0; }
  html, body, .slide { width:1280px; height:720px; overflow:hidden; }
  body { position:relative; font-family:var(--leo-f-family-body,"Noto Sans SC"),sans-serif; font-size:var(--leo-f-size-body,25px); line-height:var(--leo-f-line-height-body,1.5); font-weight:var(--leo-f-weight-body,400); color:var(--leo-c-text,#26282B); background:var(--leo-c-background,#FAFAF7); }
  .slide { position:relative; }
  [data-leo-region] { position:absolute; min-width:0; min-height:0; }
  [data-leo-block], [data-leo-block-item] { min-width:0; overflow-wrap:anywhere; }
  .head { border-bottom:2px solid var(--leo-c-accent,#8A6D3B); }
  .kicker { color:var(--leo-c-accent,#8A6D3B); font:var(--leo-f-weight-kicker,400) var(--leo-f-size-kicker,22px)/var(--leo-f-line-height-kicker,1.4) var(--leo-f-family-kicker,"Noto Sans SC"),sans-serif; margin-bottom:8px; }
  .title, .quote { color:var(--leo-c-primary,#31435C); font:var(--leo-f-weight-title,700) var(--leo-f-size-title,46px)/var(--leo-f-line-height-title,1.25) var(--leo-f-family-title,"Noto Sans SC"),sans-serif; }
  .page-no, .page-no2 { position:absolute; right:24px; bottom:8px; color:var(--leo-c-muted,#5D6672); font:var(--leo-f-weight-page_no,400) var(--leo-f-size-page_no,22px)/var(--leo-f-line-height-page_no,1.2) var(--leo-f-family-page_no,"Noto Sans SC"),sans-serif; }
  .footnote, .bound, .meta { font-size:var(--leo-f-size-page_no,22px); line-height:1.3; color:var(--leo-c-muted,#5D6672); }
  .foot, .footer, .bound { border-top:1px solid var(--leo-c-border,#D8DAD3); padding-top:10px; }
  .bottom { display:flex; align-items:center; gap:var(--leo-g-padding-gap,16px); }
  .bottom:empty, .kicker:empty, .source:empty { display:none; }
  html[data-leo-render] *, html[data-leo-render] *::before, html[data-leo-render] *::after { animation: none !important; transition: none !important; }

  .kpis { display:flex; gap:var(--leo-g-padding-gap,16px); }
  .kpi { flex:1; display:flex; flex-direction:column; padding:12px 16px; background:var(--leo-c-surface,#FFFFFF); border-top:3px solid var(--leo-c-primary,#31435C); }
  .kpi.label-only { border-top-color:var(--leo-c-accent,#8A6D3B); }
  .k-label, .k-before { font-size:var(--leo-f-size-page_no,22px); line-height:1.3; color:var(--leo-c-muted,#5D6672); }
  .k-value { font-size:var(--leo-f-size-title,46px); font-weight:700; line-height:1.2; color:var(--leo-c-primary,#31435C); }
  .k-unit { font-size:var(--leo-f-size-page_no,22px); font-weight:400; margin-left:4px; color:var(--leo-c-muted,#5D6672); }
  .mid { display:flex; gap:var(--leo-g-padding-gap,16px); }
  .chart-zone { flex:1.45; min-width:0; display:flex; flex-direction:column; }
  .zone-title { font-size:var(--leo-f-size-page_no,22px); color:var(--leo-c-primary,#31435C); font-weight:700; }
  .chart-slot { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  .chart-slot svg { max-width:100% !important; max-height:100% !important; width:auto !important; height:auto !important; }
  .dual-zone { flex:1; min-width:0; display:flex; flex-direction:column; gap:12px; }
  .dual { flex:1; padding:10px 18px; display:flex; flex-direction:column; justify-content:center; }
  .dual.direct { background:var(--leo-c-primary,#31435C); color:var(--leo-c-on_primary,#FFFFFF); }
  .dual.net { border:1px solid var(--leo-c-primary,#31435C); background:var(--leo-c-surface,#FFFFFF); color:var(--leo-c-primary,#31435C); }
  .d-tag, .d-usd { font-size:var(--leo-f-size-page_no,22px); line-height:1.3; }
  .d-hkd { font-size:calc(var(--leo-f-size-body,25px) * 1.2); font-weight:700; line-height:1.3; }
  .dual.net .d-usd { color:var(--leo-c-muted,#5D6672); }

  .head { left:var(--leo-g-header-x,64px); top:var(--leo-g-header-y,40px); width:var(--leo-g-header-width,1152px); height:var(--leo-g-header-height,124px); }
  .kpis { left:var(--leo-g-kpi_row-x,64px); top:var(--leo-g-kpi_row-y,180px); width:var(--leo-g-kpi_row-width,1152px); height:var(--leo-g-kpi_row-height,150px); }
  .mid { left:var(--leo-g-mid_zone-x,64px); top:var(--leo-g-mid_zone-y,352px); width:var(--leo-g-mid_zone-width,1152px); height:var(--leo-g-mid_zone-height,260px); }
  .foot { left:var(--leo-g-footnote_band-x,64px); top:var(--leo-g-footnote_band-y,638px); width:var(--leo-g-footnote_band-width,1152px); height:var(--leo-g-footnote_band-height,60px); }
</style>
</head>
<body>
  <main class="slide" id="leo-slide">
    <header class="head" data-leo-region="header">
      <div class="kicker" data-leo-block="kicker"></div>
      <h1 class="title" data-leo-block="title"></h1>
    </header>
    <section class="kpis" data-leo-region="kpi_row" data-leo-block="kpis"></section>
    <section class="mid" data-leo-region="mid_zone">
      <div class="chart-zone">
        <div class="zone-title" data-leo-block="chart_title"></div>
        <div class="chart-slot" data-leo-block="chart"></div>
      </div>
      <div class="dual-zone" data-leo-block="dual"></div>
    </section>
    <footer class="foot" data-leo-region="footnote_band">
      <div class="footnote" data-leo-block="footnote"></div>
    </footer>
  </main>
  <div class="page-no" data-leo-block="page-no"></div>
<script>
  if (new URLSearchParams(window.location.search).get("leo_render") === "1") {
    document.documentElement.dataset.leoRender = "1";
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = String(text);
    return e;
  }
  function applyData(data) {
    data = data || {};
    document.querySelector('[data-leo-block="kicker"]').textContent = data.kicker || "";
    document.querySelector('[data-leo-block="title"]').textContent = data.title || "";
    var kpis = document.querySelector('[data-leo-block="kpis"]');
    (data.kpis || []).forEach(function (k) {
      var card = el("div", "kpi" + (k.before ? "" : " label-only"));
      card.setAttribute("data-leo-block-item", "kpi");
      card.appendChild(el("div", "k-label", k.label));
      var val = el("div", "k-value");
      if (k.unit) { val.appendChild(document.createTextNode(k.value)); val.appendChild(el("span", "k-unit", k.unit)); }
      else { val.textContent = k.value; }
      card.appendChild(val);
      if (k.before) card.appendChild(el("div", "k-before", k.before));
      kpis.appendChild(card);
    });
    document.querySelector('[data-leo-block="chart_title"]').textContent = data.chart_title || "";
    var chart = document.querySelector('[data-leo-block="chart"]');
    if (typeof data.chart_svg === "string" && data.chart_svg.indexOf("<svg") !== -1) {
      var parsed = new DOMParser().parseFromString(data.chart_svg, "image/svg+xml");
      var svg = parsed.documentElement;
      if (!svg || svg.nodeName.toLowerCase() !== "svg" || parsed.querySelector("parsererror")) { chart.closest(".chart-zone").style.display = "none"; }
      else { chart.replaceChildren(document.importNode(svg, true)); }
    } else { chart.closest(".chart-zone").style.display = "none"; }
    var dual = document.querySelector('[data-leo-block="dual"]');
    (data.dual || []).forEach(function (d) {
      var box = el("div", "dual " + (d.kind === "direct" ? "direct" : "net"));
      box.setAttribute("data-leo-block-item", "dual");
      box.appendChild(el("div", "d-tag", d.tag));
      box.appendChild(el("div", "d-hkd", d.hkd));
      box.appendChild(el("div", "d-usd", d.usd));
      dual.appendChild(box);
    });
    document.querySelector('[data-leo-block="footnote"]').textContent = data.footnote || "";
    document.querySelector('[data-leo-block="page-no"]').textContent = data.page_no != null ? String(data.page_no) : "";
  }
  applyThemeVariables(window.__LEO_THEME_VARIABLES__);
  applyData(window.__LEO_SLIDE_DATA__);
  function applyThemeVariables(theme) {
    theme = theme || {};
    var root = document.documentElement;
    Object.keys(theme.colors || {}).forEach(function (role) {
      root.style.setProperty("--leo-c-" + role, String(theme.colors[role]));
    });
    Object.keys(theme.fonts || {}).forEach(function (role) {
      var font = theme.fonts[role];
      ["family", "size", "weight", "line_height"].forEach(function (key) {
        if (font[key] != null) root.style.setProperty("--leo-f-" + key.replace("_", "-") + "-" + role,
          String(font[key]) + (key === "size" ? "px" : ""));
      });
    });
    Object.keys(theme.geometry || {}).forEach(function (key) {
      if (typeof theme.geometry[key] === "number")
        root.style.setProperty("--leo-g-" + key, theme.geometry[key] + "px");
    });
  }
  document.fonts.ready.then(function () { document.documentElement.dataset.leoReady = "1"; });
</script>
</body>
</html>
