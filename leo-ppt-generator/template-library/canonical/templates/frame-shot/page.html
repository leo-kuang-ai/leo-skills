<!doctype html>
<!-- leo render lane template: frame-shot (R-32 / evidence screenshot frame)
  Ported from guizang-social-card-skill references/screenshot-treatment.md
  (.frame-shot six parameters + device chrome + orthographic discipline).
  Six parameters (pick once, don't fiddle mid-deck):
    ratio   16x10(default)/16x9/4x3/3x2/1x1/3x4/21x9
    corners sq(0)/sm(6)/md(14) — never above 14px (reads as iOS marketing)
    shadow  none(default)/soft/ed(1px outline, hero shots only)
    bg      paper/paper-2/grey-1/grid/dot/ink — the "stage"; NEVER accent
            coloured (add a kicker for emphasis instead, don't tint the stage)
    inset   none/sub(20px, default)/bal(48px)
    fit     contain(default — the whole point)/cover(explicit override only)
  Device wrappers: device=none(default)/browser/phone. Phone forces
  corners back to sq (the bezel already rounds the inner shot).
  Orthographic discipline: NO perspective, skew, rotation or 3D tilt —
  straight subject, equal scaling, quiet background, clear safe padding.
  Data contract: kicker/title/caption + the six parameters + device +
  image_src (data: URI only — offline deterministic lane, no remote
  fetches) + image_alt + page_no. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>frame-shot</title>
<style>
  @font-face {
    font-family: "Noto Sans SC";
    src: url(/leo-fonts/NotoSansSC-Regular.otf) format("opentype");
    font-weight: 400;
  }
  @font-face {
    font-family: "Noto Sans SC";
    src: url(/leo-fonts/NotoSansSC-Bold.otf) format("opentype");
    font-weight: 700;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    font-family: var(--leo-f-family-body, "Noto Sans SC"), "Noto Sans SC", sans-serif;
    background: var(--leo-c-background, #f7f5f0); color: var(--leo-c-text, #1f2430); position: relative;
  }
  .leo-slide {
    width: 1280px; height: 720px; padding: 80px 100px 72px;
    display: flex; flex-direction: column;
  }
  .kicker {
    font-size: var(--leo-f-size-page_no, 22px); letter-spacing: 0.3em; color: var(--leo-c-accent, #b08d57); font-weight: 700;
    margin-bottom: 18px;
  }
  .page-title {
    font-size: var(--leo-f-size-title, 52px); font-weight: 700; line-height: 1.2; color: var(--leo-c-primary, #14213d);
    overflow-wrap: break-word;
  }
  /* Stage hosts the (optionally device-wrapped) frame-shot, centered.
     Orthographic: flat flex centering only — no transforms of any kind. */
  .stage {
    flex: 1 1 auto; min-height: 0; margin: 44px 0 22px;
    display: flex; align-items: center; justify-content: center;
  }
  .caption {
    font-size: var(--leo-f-size-kicker, 24px); line-height: 1.5; color: #6d6a60;
    text-align: center; overflow-wrap: break-word;
  }
  .page-no { position: absolute; right: 44px; bottom: 30px; font-size: var(--leo-f-size-page_no, 22px); color: var(--leo-c-muted, #8d8578); }

  /* --- frame-shot core (guizang .frame-shot port) ---------------------- */
  .frame-shot {
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .frame-shot img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .fs-fit-cover img { object-fit: cover; }

  /* ratio slots (7); JS also sets explicit px so the box can never deform */
  .fs-r-16x10 { aspect-ratio: 16 / 10; }
  .fs-r-16x9  { aspect-ratio: 16 / 9; }
  .fs-r-4x3   { aspect-ratio: 4 / 3; }
  .fs-r-3x2   { aspect-ratio: 3 / 2; }
  .fs-r-1x1   { aspect-ratio: 1 / 1; }
  .fs-r-3x4   { aspect-ratio: 3 / 4; }
  .fs-r-21x9  { aspect-ratio: 21 / 9; }

  .fs-corners-sq { border-radius: 0; }
  .fs-corners-sm { border-radius: 6px; }
  .fs-corners-md { border-radius: 14px; } /* hard ceiling: never above 14px */

  .fs-shadow-none { box-shadow: none; }
  .fs-shadow-soft { box-shadow: 0 12px 32px rgba(20, 24, 36, 0.18); }
  .fs-shadow-ed   { box-shadow: 0 10px 28px rgba(20, 24, 36, 0.16);
                    outline: 1px solid var(--leo-c-text, #1f2430); outline-offset: -1px; }

  /* stages are quiet neutrals only — an accent stage is a contract breach */
  .fs-bg-paper   { background: var(--leo-c-background, #f7f5f0); }
  .fs-bg-paper-2 { background: var(--leo-c-surface, #efeae0); }
  .fs-bg-grey-1  { background: #e8eaed; }
  .fs-bg-grid {
    background-color: #f2f3f5;
    background-image:
      linear-gradient(#d8dade 1px, transparent 1px),
      linear-gradient(90deg, #d8dade 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .fs-bg-dot {
    background-color: #f7f8fa;
    background-image: radial-gradient(#c9cdd4 1.2px, transparent 1.2px);
    background-size: 22px 22px;
  }
  .fs-bg-ink { background: #14161c; }

  .fs-inset-none { padding: 0; }
  .fs-inset-sub  { padding: 20px; }
  .fs-inset-bal  { padding: 48px; }

  /* --- device chrome wrappers ------------------------------------------ */
  .device-browser {
    background: #e6e4de; border-radius: 10px; overflow: hidden;
    box-shadow: 0 14px 36px rgba(20, 24, 36, 0.16);
  }
  .device-browser .fs-chrome {
    height: 36px; display: flex; align-items: center; gap: 8px;
    padding: 0 14px; background: #dcd9d2; border-bottom: 1px solid #c9c5bd;
  }
  .device-browser .fs-chrome i { width: 12px; height: 12px; border-radius: 50%; }
  .device-phone {
    background: #14161c; padding: 14px; border-radius: 34px;
    box-shadow: 0 16px 40px rgba(20, 24, 36, 0.24);
  }
  /* bezel already rounds the inner shot (18-24px inner corners) */
  .device-phone .frame-shot { border-radius: 20px; }

  html[data-leo-render] *, html[data-leo-render] *::before, html[data-leo-render] *::after {
    animation: none !important; transition: none !important;
  }
</style>
</head>
<body>
  <main class="leo-slide" id="leo-slide">
    <header data-leo-block="frame-shot-header">
      <div class="kicker" data-leo-block-item="kicker"></div>
      <h1 class="page-title" data-leo-block-item="title"></h1>
    </header>
    <div class="stage" data-leo-block="frame-shot-stage"></div>
    <p class="caption" data-leo-block="frame-shot-caption"></p>
  </main>
  <div class="page-no" data-leo-block="page-no"></div>
<script>
  if (new URLSearchParams(window.location.search).get("leo_render") === "1") {
    document.documentElement.dataset.leoRender = "1";
  }
  var RATIOS = {
    "16x10": 16 / 10, "16x9": 16 / 9, "4x3": 4 / 3, "3x2": 3 / 2,
    "1x1": 1 / 1, "3x4": 3 / 4, "21x9": 21 / 9
  };
  var CORNERS = { sq: 1, sm: 1, md: 1 };
  var SHADOWS = { none: 1, soft: 1, ed: 1 };
  var BGS = { paper: 1, "paper-2": 1, "grey-1": 1, grid: 1, dot: 1, ink: 1 };
  var INSETS = { none: 1, sub: 1, bal: 1 };
  var FITS = { contain: 1, cover: 1 };
  var DEVICES = { none: 1, browser: 1, phone: 1 };
  // Deterministic fallback ladder: unknown enum values fall back to the
  // documented default and are disclosed on the console (same input →
  // same fallback; never a creative guess).
  function pick(value, table, fallback) {
    if (Object.prototype.hasOwnProperty.call(table, value)) { return value; }
    if (value !== undefined && value !== null && value !== "") {
      console.warn("frame-shot: unknown parameter value " + JSON.stringify(value) +
        ", falling back to " + JSON.stringify(fallback));
    }
    return fallback;
  }
  function applyData(data) {
    data = data || {};
    var header = document.querySelector('[data-leo-block="frame-shot-header"]');
    header.querySelector('[data-leo-block-item="kicker"]').textContent =
      String(data.kicker || "");
    header.querySelector('[data-leo-block-item="title"]').textContent =
      String(data.title || "");
    document.querySelector('[data-leo-block="frame-shot-caption"]').textContent =
      String(data.caption || "");
    document.querySelector('[data-leo-block="page-no"]').textContent =
      data.page_no != null ? String(data.page_no) : "";

    var ratio = pick(data.ratio, RATIOS, "16x10");
    var corners = pick(data.corners, CORNERS, "sq");
    var shadow = pick(data.shadow, SHADOWS, "none");
    var bg = pick(data.bg, BGS, "paper");
    var inset = pick(data.inset, INSETS, "sub");
    var fit = pick(data.fit, FITS, "contain");
    var device = pick(data.device, DEVICES, "none");
    if (device === "phone") { corners = "sq"; } // bezel owns the rounding

    var stage = document.querySelector('[data-leo-block="frame-shot-stage"]');
    var availW = stage.clientWidth, availH = stage.clientHeight;
    if (device === "browser") { availH -= 36; }
    if (device === "phone") { availW -= 28; availH -= 28; }
    // Orthographic contain-fit: equal scaling, box keeps its ratio, the
    // subject is never perspective-tilted or cropped by the frame math.
    var w = availW, h = w / RATIOS[ratio];
    if (h > availH) { h = availH; w = h * RATIOS[ratio]; }
    w = Math.floor(w); h = Math.floor(h);

    var shot = document.createElement("div");
    shot.setAttribute("class",
      "frame-shot fs-r-" + ratio + " fs-corners-" + corners +
      " fs-shadow-" + shadow + " fs-bg-" + bg + " fs-inset-" + inset +
      (fit === "cover" ? " fs-fit-cover" : ""));
    shot.setAttribute("data-leo-block", "frame-shot");
    shot.style.width = w + "px";
    shot.style.height = h + "px";

    var src = String(data.image_src || "");
    if (src.indexOf("data:") === 0) {
      var img = document.createElement("img");
      img.setAttribute("src", src);
      img.setAttribute("alt", String(data.image_alt || ""));
      shot.appendChild(img);
    } else if (src) {
      // Offline deterministic lane: only data: URIs are accepted; a remote
      // or file path would violate the no-fetch contract, so it is refused
      // loudly instead of silently attempted.
      console.warn("frame-shot: image_src must be a data: URI, got " +
        src.slice(0, 40) + "… — refusing to load (offline contract)");
    }

    if (device === "browser") {
      var browser = document.createElement("div");
      browser.setAttribute("class", "device-browser");
      browser.setAttribute("data-leo-block", "device-browser");
      var chrome = document.createElement("div");
      chrome.setAttribute("class", "fs-chrome");
      ["#e5564c", "#e0a63c", "#58bf62"].forEach(function (color) {
        var dot = document.createElement("i");
        dot.style.background = color;
        chrome.appendChild(dot);
      });
      browser.style.width = w + "px";
      browser.style.height = (h + 36) + "px";
      browser.appendChild(chrome);
      browser.appendChild(shot);
      stage.appendChild(browser);
    } else if (device === "phone") {
      var phone = document.createElement("div");
      phone.setAttribute("class", "device-phone");
      phone.setAttribute("data-leo-block", "device-phone");
      phone.style.width = (w + 28) + "px";
      phone.style.height = (h + 28) + "px";
      phone.appendChild(shot);
      stage.appendChild(phone);
    } else {
      stage.appendChild(shot);
    }
  }
  function applyThemeVariables(theme) {
    theme = theme || {};
    var root = document.documentElement;
    var colors = theme.colors || {};
    Object.keys(colors).forEach(function (role) {
      root.style.setProperty("--leo-c-" + role, String(colors[role]));
    });
    var fonts = theme.fonts || {};
    Object.keys(fonts).forEach(function (role) {
      var def = fonts[role] || {};
      if (def.family) root.style.setProperty("--leo-f-family-" + role, String(def.family));
      if (def.weight != null) root.style.setProperty("--leo-f-weight-" + role, String(def.weight));
      if (def.size != null) root.style.setProperty("--leo-f-size-" + role, def.size + "px");
      if (def.line_height != null) root.style.setProperty("--leo-f-line-height-" + role, String(def.line_height));
    });
    var geometry = theme.geometry || {};
    // 只消费数值几何（compile_geometry 输出）；column_weights 等数组值
    // 不是 CSS 变量，由模板自身结构逻辑（colgroup）消费。
    Object.keys(geometry).forEach(function (key) {
      if (typeof geometry[key] === "number") {
        root.style.setProperty("--leo-g-" + key, geometry[key] + "px");
      }
    });
  }
  applyThemeVariables(window.__LEO_THEME_VARIABLES__);
  applyData(window.__LEO_SLIDE_DATA__);
  document.fonts.ready.then(function () {
    document.documentElement.dataset.leoReady = "1";
  });
</script>
</body>
</html>
