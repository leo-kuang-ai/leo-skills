id: content-quality-u09
title: 跨行业内容质量 U09 消费时尚（只给目标（无随附材料））
description: |
  方案 005 跨行业内容质量测评单元：消费时尚。真实 agent 运行 execute 模式 generate
  路线至内容与风格合同完成、样张前截断；A1–A5 判据由评测侧 L0 机检与 L1 双判官在冻结
  产物上离线评审；内联 judge 仅检查停止点执行边界，harness 通过≠内容达标。

input:
  prompt: |
    使用 $leo-ppt-generator，进入 execute 模式 generate 路线，完成以下委托任务。这是一次评测委托：内容与风格合同层是本次唯一交付物。
    
    【委托与边界】
    1. 委托执行：合同、大纲、母版、风格与版式决策均由你在授权范围内自主推进并记录为委托决策（decision_source: user-delegated，附依据），无需中途向用户确认；可逆决策自行完成内部审查并留痕。
    2. 停止点：完成「内容合同 → 大纲 → 逐页母版 → 风格选定（style list/load/render，同一 home，记录 selection_fingerprint 与归因一句）→ 版式调度（逐页 P 码）→ 容量预检」后即停止。不要生成样张或任何图片，不要派发任何 worker，不要调用图片 Provider；本次无需核对图片 Provider/worker 可用性。
    3. 落盘范围：一切产物只写入当前工作目录下的 ./project/ 子树（项目根目录用 ./project/；风格注册表 home 一律隔离在该子树内，如 ./project/leo-home/），不得写该子树之外的任何位置。
    4. 材料边界：只依据下面的任务简报与随附材料；不联网检索；不读取本任务输入之外的任何文件。材料/简报未给出的关键事实不足时，按合同纪律披露并收窄断言（unknown），不要编造。
    5. blocked 纪律：如遇无法可靠推断且必须用户补答的关键事实，记录 blocked 项与原因，继续完成其余部分；不得模拟用户答案或伪造人工确认。
    6. 完成后回复一页摘要：产物路径清单（合同/大纲/母版/风格选择记录/版式调度记录）、确切页数、风格选择与归因一句、容量预检结论（含软超如实报告）、blocked 清单（若有）。
    
    【任务简报】
    # 任务简报 U09 · 消费时尚 —— 新锐美妆品牌的新品渠道发布提案
    
    - 行业：消费时尚（梯度 G1-styles：有行业风格资产，无专属内容规则）
    - 任务型：路演（新品发布提案）
    - 主要受众：渠道客户（全国连锁美妆集合店的采购决策层）
    - 材料形态：只给目标（无随附材料）
    - 难度型：信号弱
    - 页数：**10 页**（含封面与收束页，从总数内分配）
    
    ## 委托方与背景
    
    你是新锐国产美妆品牌「拾光实验室」的品牌负责人。品牌成立两年，靠一款卸妆膏在小红书起家，现在要推出第二个品类线（敏感肌修护精华），主打线下渠道：全国前三的连锁美妆集合店「M 集合」的年度新品评审会下月举行，你需要在评审会上做 10 页发布提案，争取新品进入 M 集合的春季新品档期与重点陈列位。
    
    ## 任务目标
    
    提案要让采购决策层相信三件事：这个新品与 M 集合的客群定位匹配；品牌的线上势能可以转化为线下动销（转化逻辑要讲得通）；渠道政策（供货价、毛利保护、动销支持、滞销退换）设计对渠道友好且可执行。行动目标是进入春季档重点新品名单（约 12 席）。
    
    ## 受众与场合
    
    M 集合的采购总监与商品规划团队，一年看上百个新品提案，决策依据是「动销确定性」：他们不在乎品牌故事讲得多动人，在乎首月售罄率与退货率的可预期性；场合为评审会 15 分钟提案（排队进行，超时即止）。提案必须前 3 页就让他们看到「为什么能动销」。
    
    ## 决策背景
    
    这道题的困难是**信号弱**：新品未上市，没有任何销售数据；品牌现有线上数据（销量、复购）属于平台后台口径、且本次不允许提供具体数值（平台协议限制，只能描述量级与趋势）；目标客群与 M 集合客群的重合度没有联合调研数据。所有支撑提案的量化内容都只能来自：明确的估算（标注假设）、示意级的结构（如动销逻辑链）、或定性事实（成分、备案、定价档）。信号弱不等于可以编信号——把估算包装成数据是评审会上的致命伤。
    
    ## 约束
    
    1. 本任务**无随附数据材料且不提供线上后台数值**：不得出现任何具体销量/复购/转化率数字，除非明确标注「估算」并给出估算假设；未标注性质的数字一律不得出现。
    2. 客群匹配论述须诚实标注依据类型（公开客群描述/品牌自证/示意推断），不得把推断写成调研结论。
    3. 渠道政策的具体条款（供货折扣、账期、退换）允许给出「建议方案」性质的结构化设计，标注为提案待议，不冒充已内部批准的最终政策。
    4. 不得使用贬低竞品或绝对化功效宣称（化妆品法规红线：「修复」「根治」类医疗化表述禁止），功效表述按「敏感肌适用」类合规口径。
    5. 语体符合渠道商务场合：可以时尚感性，但政策页必须清晰商务。
    
    ## 材料指引
    
    本单元为「只给目标」形态：以上简报即全部输入。允许基于明确估算/示意组织内容（如按品类常识估算首月动销节奏并标注示意），关键事实不足处披露并收窄断言；涉及本品销量与客群数据的一律以「估算/示意/待议」标注。
    
    （本单元无随附材料——只给目标形态，约束见简报「材料指引」节。）

constraints:
  max_turns: 48
  timeout_seconds: 3600

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_content_execution_boundary.py
  timeout_seconds: 10

collect_artifacts:
  - "project/**"
