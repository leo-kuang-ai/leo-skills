id: truncated-source
title: 截断源文标记不完整且不补全
description: 验证句子中途断掉的源文被如实翻译已有部分并显式标记截断/不完整，不得编造谓语宾语或默认值补全句子。

input:
  prompt: |
    请把下面这段文档翻译成简体中文：

    To configure the cache, set the max_size param to

constraints:
  max_turns: 1

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_truncated_source.py
  timeout_seconds: 10
