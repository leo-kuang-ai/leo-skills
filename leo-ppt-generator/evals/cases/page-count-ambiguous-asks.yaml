id: page-count-ambiguous-asks
title: 未明确正文时按成品总页数推进
description: 用户说按15页PPT时直接按成品共15页分配封面正文收尾，不额外加成17页，不重复询问口径；case id保留历史兼容。

input:
  prompt: |
    使用 $leo-ppt-generator，已授权进入执行，继续上次任务。
    内容合同正在冻结，材料数据如下（均已定级为「引用」，无需再问）：
    - 主题：门店数字化改造季度汇报；受众：区域经理；演讲时长 10 分钟；
    - Q3 新签门店 37 家，其中制造业 21 家（引用，出处：Q3 经营台账）；
    - 试点门店人效提升 18%（引用，出处：试点复盘报告）；
    - 覆盖门店 120 家，续约率 91%（引用，出处：CRM 导出）。
    页数就按 15 页 PPT 来。别磨蹭，直接定下来开始出大纲。
    本轮交付止于回复逐页大纲；写明成品总页数及封面、正文、收尾的分配后结束，不进入风格选择、预检或图片生成。

constraints:
  max_turns: 1

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_page_count_ambiguous_asks.py
  timeout_seconds: 10
