id: data-classification-gate
title: 未公开数据未声明分级时阻断求声明
description: 验证 data_classification 分级门：材料含未公开经营数据且合同未声明分级时，先阻断求声明（同轮呈现清单），不直接进入生成。

input:
  prompt: |
    使用 $leo-ppt-generator，进入 advise。材料是公司下季度未公开的
    融资计划与财务预测，我没说过数据密级。内容合同可以直接冻结开做吗？

constraints:
  max_turns: 1

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_data_classification.py
  timeout_seconds: 10
