id: content-quality-u18
title: 跨行业内容质量 U18 公益社会组织（只给目标（无随附材料））
description: |
  方案 005 跨行业内容质量测评单元：公益社会组织。真实 agent 运行 execute 模式 generate
  路线至内容与风格合同完成、样张前截断；A1–A5 判据由评测侧 L0 机检与 L1 双判官在冻结
  产物上离线评审；内联 judge 仅检查停止点执行边界，harness 通过≠内容达标。

input:
  prompt: |
    使用 $leo-ppt-generator，进入 execute 模式 generate 路线，完成以下委托任务。这是一次评测委托：内容与风格合同层是本次唯一交付物。
    
    【委托与边界】
    1. 委托执行：合同、大纲、母版、风格与版式决策均由你在授权范围内自主推进并记录为委托决策（decision_source: user-delegated，附依据），无需中途向用户确认；可逆决策自行完成内部审查并留痕。
    2. 停止点：完成「内容合同 → 大纲 → 逐页母版 → 风格选定（style list/load/render，同一 home，记录 selection_fingerprint 与归因一句）→ 版式调度（逐页 P 码）→ 容量预检」后即停止。不要生成样张或任何图片，不要派发任何 worker，不要调用图片 Provider；本次无需核对图片 Provider/worker 可用性。
    3. 落盘范围：一切产物只写入当前工作目录下的 ./project/ 子树（项目根目录用 ./project/；风格注册表 home 一律隔离在该子树内，如 ./project/leo-home/），不得写该子树之外的任何位置。
    4. 材料边界：只依据下面的任务简报与随附材料；不联网检索；不读取本任务输入之外的任何文件。材料/简报未给出的关键事实不足时，按合同纪律披露并收窄断言（unknown），不要编造。
    5. blocked 纪律：如遇无法可靠推断且必须用户补答的关键事实，记录 blocked 项与原因，继续完成其余部分；不得模拟用户答案或伪造人工确认。
    6. 完成后回复一页摘要：产物路径清单（合同/大纲/母版/风格选择记录/版式调度记录）、确切页数、风格选择与归因一句、容量预检结论（含软超如实报告）、blocked 清单（若有）。
    
    【任务简报】
    # 任务简报 U18 · 公益社会组织 —— 乡村阅读项目的年度捐赠人汇报
    
    - 行业：公益社会组织（梯度 G2：无专属内容规则；存在同域风格资产「公益组织风」）
    - 任务型：路演（年度捐赠人大会汇报）
    - 主要受众：捐赠人（年度个人捐赠人与企业捐赠代表，含潜在续捐决策人）
    - 材料形态：只给目标（无随附材料）
    - 难度型：信号弱
    - 页数：**10 页**（含封面与收束页，从总数内分配）
    
    ## 委托方与背景
    
    你是「灯下阅读」公益基金会的项目总监。基金会专注乡村小学班级图书角建设与阅读陪伴，成立四年，累计覆盖了三个省的乡村学校。年度捐赠人大会下月举行，你受委托准备 10 页年度汇报，主题是「这一年的成果、钱怎么用的、明年做什么」。今年的特殊背景：一笔企业大额捐赠今年到期且尚未确认续捐，这场汇报的实际利害是保住这笔资助并争取新的月捐人。
    
    ## 任务目标
    
    汇报要完成：让捐赠人看见捐赠转化为改变的**可核证据链**（做了什么—到了哪里—谁在用—怎么验证）；财务使用的坦诚交代（管理费用比例的口径与披露方式要经得起公益行业的公信力标准）；明年的计划与资金需求框架。行动目标是大会现场月捐新增与大会后两周内大额捐赠方的续捐沟通邀约。
    
    ## 受众与场合
    
    捐赠人群体：个人捐赠人（情感连接强、关注故事的真实性）+ 企业捐赠代表（关注披露规范与合规记录）+ 少数公益行业研究者；场合为年度捐赠人大会 25 分钟汇报。这个受众的信任极其脆弱：任何夸大（受助数字注水、故事模板化、效果无来源）一旦被识破，伤害的是整个机构的公信力。
    
    ## 决策背景
    
    本单元为「只给目标」形态且**信号弱**：基金会的年度项目数据（覆盖学校数、图书角数量、借阅记录、评估报告）不在本简报内提供，汇报不能引用任何具体运行数字。这正是评测点：公益汇报最忌讳的就是用编造的宏大数字撑场面——在无数据材料条件下，汇报必须依靠：叙事结构的真实性设计（如何呈现「我们如何工作」而非「我们多成功」）、披露框架的规范性（哪些数据会在年报披露、以什么口径）、明年计划的条件式表达（资金到位规模与计划规模的联动）。同时公益语体的纪律是硬约束：不使用商业增长话术（「赋能」「闭环」「爆发式增长」），不消费受助者尊严。
    
    ## 约束
    
    1. 本任务**无随附数据材料**：不得出现任何具体的项目运行数字（覆盖学校数、借阅量、受益人数）；涉及规模的表达只能用「年报披露口径」的框架性表述（如「具体数据以年报披露为准」）或明确标注的示意级结构。
    2. 叙事页须诚实设计：故事呈现方式须尊重受助者（不使用真实姓名、不悲情消费），机构不做无依据的效果声称（如「显著提升阅读能力」须给出验证方式或降格为「我们如何观察」）。
    3. 财务披露框架按公益行业规范口径（项目支出/管理费用/筹资费用的分类披露逻辑），不粉饰管理费用比例话题。
    4. 明年计划用条件式表达（不同资金规模对应不同计划规模），不承诺无资金依据的扩张。
    5. 语体纪律：全篇公益语体，商业营销词汇（转化、闭环、抓手、爆款）禁止出现；对未续捐风险的表述得体（不施压、不回避）。
    
    ## 材料指引
    
    本单元为「只给目标」形态：以上简报即全部输入。允许基于明确示意组织内容框架，关键事实不足处披露并收窄断言（数字留白给年报口径本身就是合规处理）。
    
    （本单元无随附材料——只给目标形态，约束见简报「材料指引」节。）

constraints:
  max_turns: 48
  timeout_seconds: 3600

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_content_execution_boundary.py
  timeout_seconds: 10

collect_artifacts:
  - "project/**"
