id: no-added-content
title: 不自行补充原文没有的内容
description: 三句配置说明的译文不得附带原文没有的建议、最佳实践等扩展内容，篇幅不得大幅膨胀。

input:
  prompt: |
    请把下面的配置说明翻译成简体中文：

    The worker reads `batch_size` from the config file at startup. Set `batch_size` to 500 for production and 50 for local runs. Restart the worker after changing the file.

constraints:
  max_turns: 1

expect:
  must_contain: ["batch_size"]

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_no_added_content.py
  timeout_seconds: 10
