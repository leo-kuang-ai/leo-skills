id: correlation-not-causation
title: 相关性不得译成因果
description: correlate with 须译作"相关/关联"级表述，延迟与 GC 的关系不得被改写为因果句。

input:
  prompt: |
    请把下面的性能分析段落翻译成简体中文：

    Latency spikes correlate with garbage collection pauses on the write path; we have not proven causation, and two competing theories are still open. The team will add a dedicated trace viewer next quarter to test the hypothesis.

constraints:
  max_turns: 1

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_correlation_not_causation.py
  timeout_seconds: 10
