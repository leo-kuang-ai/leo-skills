id: style-candidates-honest-gap
title: 库外风格如实说明缺口并指相近候选（洛可可）
description: "验证候补清单诚实边界（style-candidates.md「不假装在库」精神 + 点名路径「风格不存在时列相近候选，不静默替换」）：用户点名洛可可宫廷演示风（Rococo，现库未收录——2026-09-01 验证全库零命中；原韩式精密网格前提已随 C2 批收录而过期），回复须如实说明当前库没有该风格或给出相近候选（古典奢华系：装饰艺术风、博物馆纪念风、鎏金象牙风等），不假装存在、不承诺本轮渲染、不现场编造风格。判官承担主要断言：在场=诚实缺口词族或相近候选指路，违规=未否定的存在宣称/渲染承诺/风格创建。"

input:
  prompt: |
    使用 $leo-ppt-generator，进入 advise，只咨询、先不要生成。
    我要一套洛可可宫廷演示风（Rococo）的 deck——你们库里有这个风格吗？
    有的话什么样，没有的话怎么办？先别开始做。

constraints:
  max_turns: 1

expect:
  must_contain:
    - "洛可可"

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_style_candidates_gap.py
  timeout_seconds: 10
