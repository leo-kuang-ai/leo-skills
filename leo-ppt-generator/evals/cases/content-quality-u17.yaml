id: content-quality-u17
title: 跨行业内容质量 U17 物流供应链（直出（含随附材料））
description: |
  方案 005 跨行业内容质量测评单元：物流供应链。真实 agent 运行 execute 模式 generate
  路线至内容与风格合同完成、样张前截断；A1–A5 判据由评测侧 L0 机检与 L1 双判官在冻结
  产物上离线评审；内联 judge 仅检查停止点执行边界，harness 通过≠内容达标。

input:
  prompt: |
    使用 $leo-ppt-generator，进入 execute 模式 generate 路线，完成以下委托任务。这是一次评测委托：内容与风格合同层是本次唯一交付物。
    
    【委托与边界】
    1. 委托执行：合同、大纲、母版、风格与版式决策均由你在授权范围内自主推进并记录为委托决策（decision_source: user-delegated，附依据），无需中途向用户确认；可逆决策自行完成内部审查并留痕。
    2. 停止点：完成「内容合同 → 大纲 → 逐页母版 → 风格选定（style list/load/render，同一 home，记录 selection_fingerprint 与归因一句）→ 版式调度（逐页 P 码）→ 容量预检」后即停止。不要生成样张或任何图片，不要派发任何 worker，不要调用图片 Provider；本次无需核对图片 Provider/worker 可用性。
    3. 落盘范围：一切产物只写入当前工作目录下的 ./project/ 子树（项目根目录用 ./project/；风格注册表 home 一律隔离在该子树内，如 ./project/leo-home/），不得写该子树之外的任何位置。
    4. 材料边界：只依据下面的任务简报与随附材料；不联网检索；不读取本任务输入之外的任何文件。材料/简报未给出的关键事实不足时，按合同纪律披露并收窄断言（unknown），不要编造。
    5. blocked 纪律：如遇无法可靠推断且必须用户补答的关键事实，记录 blocked 项与原因，继续完成其余部分；不得模拟用户答案或伪造人工确认。
    6. 完成后回复一页摘要：产物路径清单（合同/大纲/母版/风格选择记录/版式调度记录）、确切页数、风格选择与归因一句、容量预检结论（含软超如实报告）、blocked 清单（若有）。
    
    【任务简报】
    # 任务简报 U17 · 物流供应链 —— 仓配一体化转型的季度经营分析
    
    - 行业：物流供应链（梯度 G2：无专属内容规则；存在同域风格资产「物流供应链风」）
    - 任务型：汇报（季度经营分析）
    - 主要受众：公司管理层（三方物流公司的经营班子）
    - 材料形态：直出（运营数据，随附）
    - 难度型：决策
    - 页数：**12 页**（含封面与收束页，从总数内分配）
    
    ## 委托方与背景
    
    你是「驰远物流」运营分析部的负责人。公司是区域三方物流企业（仓+干+配三块业务），一年前启动「仓配一体化」转型：把原来分开卖的标准仓与城配拼成一体化产品，并在 1 号仓试点自动化分拣线（一期投入已发生）。转型满四个季度，管理层要在三季度经营分析会上决定：自动化分拣的二三期投入是继续、暂缓还是调整方案。你受委托准备 12 页经营分析汇报稿。
    
    ## 任务目标
    
    分析要回答：一体化产品对客户的渗透与黏性（签约结构变化、单客户价值变化）；三块业务的成本与时效变化（一体化后「仓+配」合并口径 vs 原分业务口径）；自动化分拣一期的投入产出状态与二三期决策建议。行动目标是经营班子对二三期投入形成明确决议（继续/暂缓/改方案）。
    
    ## 受众与场合
    
    经营班子：总经理、运营副总、财务副总、销售副总；场合为季度经营分析会 30 分钟。财务副总一定会追问「一体化后的成本节约怎么算出来的」——口径不清的节约数字会被整页打回。
    
    ## 决策背景
    
    数据里有两股力量对冲：一体化客户的人均贡献与服务续约率在上升（好信号），但 1 号仓的分拣成本下降幅度低于立项时预测（自动化设备的规模效应依赖单量，而当前单量爬坡慢于计划）；同时销售端为冲量签了几个低毛利一体化大客户，拉低了整体单均表现（结构性问题而非模式问题——但这个归因本身需要论证）。二三期决策的实质是：单量假设可信吗、低毛利结构是过渡还是常态、继续投入的触发条件是什么。
    
    ## 约束
    
    1. 全部数据来自随附材料并保持口径（仓/干/配分业务口径 vs 一体化合并口径、成本分摊规则按材料注释）；「一体化带来的成本节约」类测算须给出计算边界（对比基准、剔除项），不得给出口径不明的净数。
    2. 分拣成本未达预测须如实呈现并拆解原因（单量缺口/设备效率/其他），归因给证据；不得用「爬坡期正常现象」掩盖量化差距。
    3. 低毛利大客户的结构性影响须用材料数据论证（剔除/不剔除两个口径都呈现），不得只报整体单均。
    4. 二三期决策建议须给触发条件式框架（什么单量/毛利水平下继续），金额测算给结构或显式 unknown。
    5. 物流术语规范使用（仓配一体化、单均、妥投率、周转天数等按行业含义），不得混用。
    
    ## 材料指引
    
    随附材料为《仓配一体化转型四季度经营数据包（内部）》，含签约结构、分业务与合并口径的成本时效表、自动化分拣一期投入产出跟踪与立项预测对照、大客户毛利明细（脱敏）。数字密度高且存在口径体系切换——分析稿的每个数字都要能回溯到材料行与口径。
    
    【随附材料】（材料引用级来源，允许输入的全部；数字与口径以此为准）
    # 仓配一体化转型四季度经营数据包（内部）
    
    > 来源：运营分析部 BI（统计期 2025-Q4 至 2026-Q3 四个季度）、财务部成本口径表、销售部客户台账（脱敏）。密级：内部。
    
    ## 一、一体化产品签约结构（销售台账）
    
    - 一体化签约客户：47 家（转型起点 12 家，四季度净增 35 家）
    - 客户年均贡献：86 万元（原分业务采购客户同期 52 万元——口径：单客户年化合同额，不含临时增补）
    - 服务续约率：91%（口径：到期一体化合同续签金额 / 到期合同金额）
    - 客户结构：制造业 46%、零售连锁 30%、电商品牌 24%
    
    ## 二、成本与时效（分业务口径 vs 一体化合并口径）
    
    ### 分业务口径（财务部历史口径）
    
    - 仓储业务单均操作成本：3.4 元（2025-Q4）→ 3.3 元（2026-Q3）
    - 城配业务单均成本：7.8 元 → 7.6 元
    - 干线业务：基本持平（单位吨公里成本波动 ±2% 以内）
    
    ### 一体化合并口径（财务部新设口径，剔除内部结算）
    
    - 一体化客户仓+配合计单均成本：10.3 元（若按分业务口径相加为 11.1 元——**合并口径剔除仓配内部结算 0.8 元/单**）
    - 对外表述「一体化带来单均成本下降」时：对比基准为 11.1 元（分业务相加）vs 10.3 元（合并口径），降幅 7.2%；**须注明口径与剔除项，不得与历史分业务成本直接对表**
    
    ### 时效（BI 系统）
    
    - 一体化客户平均订单履约时长：26h（转型前分段交接口径 22h+4h 交接等待 = 30h 口径重构值）→ 当前 22h
    - 注：转型前「30h」为口径重构值（原分业务口径未统一计时），仅作趋势参考，**不得作为精确基准引用**
    
    ## 三、自动化分拣一期（1 号仓）
    
    - 一期投入：2,800 万元（已发生，2025-Q4 完成安装）
    - 立项预测：达产单均分拣成本 0.42 元（达产条件：日均 8 万单）
    - 实际：当前日均 5.4 万单（计划爬坡的 68%），单均分拣成本 0.55 元
    - 设备综合效率：设计值的 91%（停机主要为上游到货波峰排队）
    - 成本拆解（商务口径）：单量缺口贡献 0.09 元、设备效率缺口贡献 0.04 元（0.42+0.09+0.04=0.55）
    
    ## 四、客户毛利结构（财务部，脱敏）
    
    - 前五大一体化客户（均为 2025-Q4 后新签大客户）：综合毛利率 **6.2%**
    - 其余 42 家一体化客户：综合毛利率 **14.8%**
    - 全部 47 家整体：综合毛利率 9.7%（被大客户结构拉低）
    - 大客户合同背景：销售端为冲签约量，两单以「首年优惠价」签订（合同期 2 年，第二年价格回升条款已写入但依赖续约执行——**回升是否落地未验证**）
    
    ## 五、二三期决策相关信息
    
    - 二期方案：2 号仓+3 号仓复制，拟投 4,600 万元（商务测算稿，**草案口径**）
    - 三期（区域枢纽分拣）：前期研究阶段，无测算
    - 触发条件相关数据：达产需日均 8 万单/仓——当前 5.4 万；大客户第二年价格回升若不落地，二期回收期测算将延长（财务部敏感性：+9 个月）
    
    ## 六、口径与红线注释
    
    1. 成本对比必须带口径与剔除项说明；「口径重构值」不得当精确基准。
    2. 分拣成本差距须按拆解归因呈现（单量/设备效率），不得笼统「爬坡期」。
    3. 毛利率结构剔除/不剔除大客户两口径都要呈现。
    4. 二期金额为草案口径，引用须标注。

constraints:
  max_turns: 48
  timeout_seconds: 3600

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_content_execution_boundary.py
  timeout_seconds: 10

collect_artifacts:
  - "project/**"
