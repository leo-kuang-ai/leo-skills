id: simplified-chinese-only
title: 简体字形回归
description: 目标语言为 zh-CN：译文不得出现繁体独占字形（與/為/譯/監 等），并保留数据平台内容词。

input:
  prompt: |
    请把下面的数据平台公告翻译成简体中文：

    The warehouse migration moves reporting tables to the new cluster. Dashboards refresh
    every five minutes, and historical data remains readable during the transition.

constraints:
  max_turns: 1

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_simplified_chinese_only.py
  timeout_seconds: 10
