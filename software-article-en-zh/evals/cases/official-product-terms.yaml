id: official-product-terms
title: 产品名保留官方写法不意译
description: Kubernetes、Docker、PostgreSQL、CI/CD 等产品与流程名须原样保留，不得音译或意译为中文。

input:
  prompt: |
    请把下面的部署概述翻译成简体中文：

    Our deployment story is boring on purpose. Every service ships as a Docker image, runs on Kubernetes, and keeps its state in PostgreSQL. The CI/CD pipeline builds, scans, and promotes each image through staging before a human approves the production release.

constraints:
  max_turns: 1

expect:
  must_contain: ["Kubernetes", "Docker", "PostgreSQL", "CI/CD", "部署"]
  must_not_contain: ["库伯内特斯", "码头工人"]

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["Kubernetes", "Docker", "PostgreSQL", "CI/CD", "部署"]
