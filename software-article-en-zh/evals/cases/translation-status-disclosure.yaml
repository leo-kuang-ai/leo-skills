id: translation-status-disclosure
title: 翻译输出附状态元信息
description: 正常翻译任务的输出在译文主体之外须附带覆盖范围/审校状态等状态元信息。

input:
  prompt: |
    请把下面两段 API 变更说明翻译成简体中文：

    Version 2.4 of the public API deprecates the v1 key format for webhooks. Legacy keys keep working until September, and the migration guide shows the three-step rotation process.

    Rate limits change from 600 requests per minute to 120 requests per minute per token. Responses now include a Retry-After header whenever the limit is exceeded.

constraints:
  max_turns: 1

expect:
  must_contain: ["Retry-After"]

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_translation_status_disclosure.py
  timeout_seconds: 10
