id: content-quality-u12
title: 跨行业内容质量 U12 体育健身（只给目标（无随附材料））
description: |
  方案 005 跨行业内容质量测评单元：体育健身。真实 agent 运行 execute 模式 generate
  路线至内容与风格合同完成、样张前截断；A1–A5 判据由评测侧 L0 机检与 L1 双判官在冻结
  产物上离线评审；内联 judge 仅检查停止点执行边界，harness 通过≠内容达标。

input:
  prompt: |
    使用 $leo-ppt-generator，进入 execute 模式 generate 路线，完成以下委托任务。这是一次评测委托：内容与风格合同层是本次唯一交付物。
    
    【委托与边界】
    1. 委托执行：合同、大纲、母版、风格与版式决策均由你在授权范围内自主推进并记录为委托决策（decision_source: user-delegated，附依据），无需中途向用户确认；可逆决策自行完成内部审查并留痕。
    2. 停止点：完成「内容合同 → 大纲 → 逐页母版 → 风格选定（style list/load/render，同一 home，记录 selection_fingerprint 与归因一句）→ 版式调度（逐页 P 码）→ 容量预检」后即停止。不要生成样张或任何图片，不要派发任何 worker，不要调用图片 Provider；本次无需核对图片 Provider/worker 可用性。
    3. 落盘范围：一切产物只写入当前工作目录下的 ./project/ 子树（项目根目录用 ./project/；风格注册表 home 一律隔离在该子树内，如 ./project/leo-home/），不得写该子树之外的任何位置。
    4. 材料边界：只依据下面的任务简报与随附材料；不联网检索；不读取本任务输入之外的任何文件。材料/简报未给出的关键事实不足时，按合同纪律披露并收窄断言（unknown），不要编造。
    5. blocked 纪律：如遇无法可靠推断且必须用户补答的关键事实，记录 blocked 项与原因，继续完成其余部分；不得模拟用户答案或伪造人工确认。
    6. 完成后回复一页摘要：产物路径清单（合同/大纲/母版/风格选择记录/版式调度记录）、确切页数、风格选择与归因一句、容量预检结论（含软超如实报告）、blocked 清单（若有）。
    
    【任务简报】
    # 任务简报 U12 · 体育健身 —— 精品健身工作室连锁的 Pre-A 路演
    
    - 行业：体育健身（梯度 G1-styles：有行业风格资产，无专属内容规则）
    - 任务型：路演（融资）
    - 主要受众：投资人（Pre-A 消费/连锁投资机构）
    - 材料形态：只给目标（无随附材料）
    - 难度型：决策
    - 页数：**10 页**（含封面与收束页，从总数内分配）
    
    ## 委托方与背景
    
    你是「形致运动」的创始人。形致在城市核心区经营 3 家直营精品健身工作室（团课+私教混合模型，单店 300 平米级），第一家店运营 22 个月已稳定盈利，第二、三家分别在第 10 和第 4 个月，爬坡进度不同。公司启动 Pre-A 融资，投资人必问的问题是扩张节奏：明年开 6 家还是 3 家、以什么店型开、城市内加密还是跨城。你受委托准备 10 页路演稿，核心是把扩张节奏的决策框架讲清楚。
    
    ## 任务目标
    
    路演要证明：第一家成熟店的模型可复制（哪些要素是模型内核、哪些是选址运气）；第二、三家爬坡差异的解释框架；扩张节奏的推荐方案（6 家 vs 3 家 vs 更保守）与判断依据；本轮资金需求与对应里程碑。行动目标是进入机构投决会。
    
    ## 受众与场合
    
    连锁赛道投资人，看过健身行业上一轮「预付款扩张—爆雷」的周期，对现金流与预收款监管高度敏感；场合为 30 分钟路演。任何「快速铺店抢占心智」的叙事都会触发警惕，投资人要看的是单店 UE 与现金纪律。
    
    ## 决策背景
    
    本单元为「只给目标」形态：没有随附经营数据（三家店的财务底表未纳入本简报），但扩张决策框架的论证依然必须成立——这正是评测点：在无数据材料条件下，路演如何用「结构化论证+显式假设」代替数据堆砌。决策背景的真实张力：第二家店爬坡慢于第一家（教练团队新建、周边竞品预售分流两个原因都存在，权重不明），这个未解归因直接影响「模型可复制」的核心命题——路演必须诚实处理「可复制性尚未完全验证」这一点，并说明 Pre-A 资金如何买到验证（第三家店的关键假设清单）。
    
    ## 约束
    
    1. 本任务**无随附数据材料**：三家店的经营数字（会员数、预收款、回本进度）不得出现具体值，可用「估算」标注的结构化模型（单店 UE 框架：收入结构×成本结构的参数化表达）呈现，参数给假设依据。
    2. 「第二家店爬坡慢」的两个归因假设须并列呈现，不得假装已裁决；对可复制性的论证须区分「已验证要素/待验证要素」。
    3. 扩张节奏对比（6 家/3 家/更保守）须给出结构化差异（现金消耗、教练供给、管理半径），推荐结论给判据；里程碑可核（店数+单店指标阈值+时点）。
    4. 预收款监管与现金流风险须设专页处置，不得回避。
    5. 资金需求金额给测算结构或显式 unknown；收束页行动项可核可验收。
    
    ## 材料指引
    
    本单元为「只给目标」形态：以上简报即全部输入。允许基于明确估算/示意组织内容（单店模型参数化估算并标注），关键事实不足处披露并收窄断言。
    
    （本单元无随附材料——只给目标形态，约束见简报「材料指引」节。）

constraints:
  max_turns: 48
  timeout_seconds: 3600

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_content_execution_boundary.py
  timeout_seconds: 10

collect_artifacts:
  - "project/**"
