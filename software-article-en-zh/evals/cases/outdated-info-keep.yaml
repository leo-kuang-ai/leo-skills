id: outdated-info-keep
title: 旧文信息按原文保留
description: 2019 年旧文中的维护方与版本号须如实翻译，不得用当前知识更新版本号或维护状态。

input:
  prompt: |
    请把下面这段 2019 年的文档翻译成简体中文：

    This library is maintained by the Apache Foundation and the latest version is 1.2.3. Release notes for the 1.2.x line are published on the project wiki every quarter.

constraints:
  max_turns: 1

expect:
  must_contain: ["1.2.3", "Apache"]

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_outdated_info_keep.py
  timeout_seconds: 10
