id: content-quality-u13
title: 跨行业内容质量 U13 农业（只给目标（无随附材料））
description: |
  方案 005 跨行业内容质量测评单元：农业。真实 agent 运行 execute 模式 generate
  路线至内容与风格合同完成、样张前截断；A1–A5 判据由评测侧 L0 机检与 L1 双判官在冻结
  产物上离线评审；内联 judge 仅检查停止点执行边界，harness 通过≠内容达标。

input:
  prompt: |
    使用 $leo-ppt-generator，进入 execute 模式 generate 路线，完成以下委托任务。这是一次评测委托：内容与风格合同层是本次唯一交付物。
    
    【委托与边界】
    1. 委托执行：合同、大纲、母版、风格与版式决策均由你在授权范围内自主推进并记录为委托决策（decision_source: user-delegated，附依据），无需中途向用户确认；可逆决策自行完成内部审查并留痕。
    2. 停止点：完成「内容合同 → 大纲 → 逐页母版 → 风格选定（style list/load/render，同一 home，记录 selection_fingerprint 与归因一句）→ 版式调度（逐页 P 码）→ 容量预检」后即停止。不要生成样张或任何图片，不要派发任何 worker，不要调用图片 Provider；本次无需核对图片 Provider/worker 可用性。
    3. 落盘范围：一切产物只写入当前工作目录下的 ./project/ 子树（项目根目录用 ./project/；风格注册表 home 一律隔离在该子树内，如 ./project/leo-home/），不得写该子树之外的任何位置。
    4. 材料边界：只依据下面的任务简报与随附材料；不联网检索；不读取本任务输入之外的任何文件。材料/简报未给出的关键事实不足时，按合同纪律披露并收窄断言（unknown），不要编造。
    5. blocked 纪律：如遇无法可靠推断且必须用户补答的关键事实，记录 blocked 项与原因，继续完成其余部分；不得模拟用户答案或伪造人工确认。
    6. 完成后回复一页摘要：产物路径清单（合同/大纲/母版/风格选择记录/版式调度记录）、确切页数、风格选择与归因一句、容量预检结论（含软超如实报告）、blocked 清单（若有）。
    
    【任务简报】
    # 任务简报 U13 · 农业 —— 智慧大棚示范基地的年度运行总结与扩产提案
    
    - 行业：农业（梯度 G2：无专属内容规则；亦无专属风格资产）
    - 任务型：汇报（年度总结+提案）
    - 主要受众：公司管理层（农业科技公司的董事会与经营班子）
    - 材料形态：只给目标（无随附材料）
    - 难度型：不确定
    - 页数：**11 页**（含封面与收束页，从总数内分配）
    
    ## 委托方与背景
    
    你是「垚丰农业科技」智慧农业事业部的运营负责人。公司在华北某县运营一个 120 亩的智慧大棚示范基地（番茄与叶菜两类主栽品目），运行进入第二个完整生产年。公司需要在年度经营会上决定：基地模式是否复制到第二个县（拟建 200 亩）。你受委托准备 11 页汇报稿，把第二年的运行总结与扩产提案一起呈上。
    
    ## 任务目标
    
    汇报要回答：基地第二年「产量—成本—渠道」三个维度的真实状态与第一年相比的变化；扩产提案的前提条件（哪些已具备、哪些依赖未定因素）；第二个县的选址逻辑与风险清单。行动目标是经营会原则同意扩产立项并批准选址尽调预算。
    
    ## 受众与场合
    
    公司董事会与经营班子，多数人有农业产业背景，深知农业数据的季节性与方差问题——任何「平均亩产提升 X%」不带茬口与气候背景的呈现都会被质疑；场合为年度经营会专项议程 30 分钟。
    
    ## 决策背景
    
    这个题目的核心困难是农业特有的**不确定**：本单元为「只给目标」形态，不提供运行数据表——但即使有数据，单季数据也不足以支撑确定性结论：第二年经历了与第一年不同的气候过程（异常天气时段不同），茬口结构也调整过（番茄占比提高），产量变化里气候、茬口与管理改进三重因素混在一起。扩产决策还叠加第二个不确定性：拟选址县的土地流转政策与配套水价尚在谈判中。汇报的价值在于把这个不确定性结构讲清楚，给出「什么条件下扩产是对的」的决策框架，而不是硬给结论。
    
    ## 约束
    
    1. 本任务**无随附数据材料**：不得出现基地的具体产量、成本、销售额数字；允许用「估算/示意」级的结构化框架（如亩产区间、成本结构占比的参数化表达）并标注性质与假设。
    2. 气候/茬口/管理三因素对年度变化的归因只能以「框架+假设」呈现，不得假装已量化拆分；单季数据不足以外推的统计局限须显式说明。
    3. 扩产前提须分「已具备/待验证/外部依赖」三档列出；第二个县的政策与水价变量按不确定变量处理（条件式表述），不得假设谈判结果。
    4. 农业术语规范使用（茬口、定植、亩产、商品化率等按行业含义），不得混用生活化表述。
    5. 扩产预算与选址尽调预算给测算结构或显式 unknown；收束页行动项可核（如「一季度内完成两县土地政策比选报告」）。
    
    ## 材料指引
    
    本单元为「只给目标」形态：以上简报即全部输入。允许基于明确估算/示意组织内容，关键事实不足处披露并收窄断言；涉及基地自身运行实绩的数字一律不得虚构（未知即 unknown 或区间示意并标注）。
    
    （本单元无随附材料——只给目标形态，约束见简报「材料指引」节。）

constraints:
  max_turns: 48
  timeout_seconds: 3600

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_content_execution_boundary.py
  timeout_seconds: 10

collect_artifacts:
  - "project/**"
