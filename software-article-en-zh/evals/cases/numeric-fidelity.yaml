id: numeric-fidelity
title: 数字与版本号逐字保留
description: 验证译文完整保留 128、3.5、2.18.0、99.95% 等数字与版本号，不被改写或四舍五入（"四核"等中文数词合法）。

input:
  prompt: |
    请把下面这段容量规划文档翻译成简体中文：

    The worker pool supports up to 128 threads with a 3.5 GB heap. We recommend gateway version 2.18.0 or later, which sustained 99.95% availability last quarter on a 4-core CPU.

constraints:
  max_turns: 1

expect:
  must_contain: ["128", "3.5", "2.18.0", "99.95%", "线程"]
  must_not_contain: ["1280", "99.5%"]

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["128", "3.5", "2.18.0", "99.95%", "线程"]
