id: content-quality-u14
title: 跨行业内容质量 U14 传媒出版（只给目标（无随附材料））
description: |
  方案 005 跨行业内容质量测评单元：传媒出版。真实 agent 运行 execute 模式 generate
  路线至内容与风格合同完成、样张前截断；A1–A5 判据由评测侧 L0 机检与 L1 双判官在冻结
  产物上离线评审；内联 judge 仅检查停止点执行边界，harness 通过≠内容达标。

input:
  prompt: |
    使用 $leo-ppt-generator，进入 execute 模式 generate 路线，完成以下委托任务。这是一次评测委托：内容与风格合同层是本次唯一交付物。
    
    【委托与边界】
    1. 委托执行：合同、大纲、母版、风格与版式决策均由你在授权范围内自主推进并记录为委托决策（decision_source: user-delegated，附依据），无需中途向用户确认；可逆决策自行完成内部审查并留痕。
    2. 停止点：完成「内容合同 → 大纲 → 逐页母版 → 风格选定（style list/load/render，同一 home，记录 selection_fingerprint 与归因一句）→ 版式调度（逐页 P 码）→ 容量预检」后即停止。不要生成样张或任何图片，不要派发任何 worker，不要调用图片 Provider；本次无需核对图片 Provider/worker 可用性。
    3. 落盘范围：一切产物只写入当前工作目录下的 ./project/ 子树（项目根目录用 ./project/；风格注册表 home 一律隔离在该子树内，如 ./project/leo-home/），不得写该子树之外的任何位置。
    4. 材料边界：只依据下面的任务简报与随附材料；不联网检索；不读取本任务输入之外的任何文件。材料/简报未给出的关键事实不足时，按合同纪律披露并收窄断言（unknown），不要编造。
    5. blocked 纪律：如遇无法可靠推断且必须用户补答的关键事实，记录 blocked 项与原因，继续完成其余部分；不得模拟用户答案或伪造人工确认。
    6. 完成后回复一页摘要：产物路径清单（合同/大纲/母版/风格选择记录/版式调度记录）、确切页数、风格选择与归因一句、容量预检结论（含软超如实报告）、blocked 清单（若有）。
    
    【任务简报】
    # 任务简报 U14 · 传媒出版 —— 数字阅读平台的年度广告营销提案
    
    - 行业：传媒出版（梯度 G2：无专属内容规则；亦无专属风格资产）
    - 任务型：路演（广告营销提案）
    - 主要受众：广告主（国产汽车品牌的市场部与媒介代理公司）
    - 材料形态：只给目标（无随附材料）
    - 难度型：信号弱
    - 页数：**10 页**（含封面与收束页，从总数内分配）
    
    ## 委托方与背景
    
    你是「青梧阅读」（数字阅读平台，网文+出版电子书双内容池）的商业化总监。明年 Q2 一家国产汽车品牌将上市一款面向年轻家庭的新能源 SUV，其市场部正在遴选内容平台的年度合作档期。你受委托准备 10 页提案，参加该品牌市场部与媒介代理的比稿会，争取「内容植入+品牌书单+读书人社区活动」的组合档期。
    
    ## 任务目标
    
    提案要让广告主相信：青梧的用户结构与其目标客群（25–35 岁、家庭首购/换购、理性消费内容偏好）匹配；阅读场景对汽车品牌的心智渗透有独特价值（对比短视频曝光的逻辑差异）；组合方案（书单共创、有声栏目冠名、社区读书活动）的执行链路可交付。行动目标是进入该品牌的年度框架合作短名单。
    
    ## 受众与场合
    
    品牌市场部负责人与媒介代理的策划团队，每年看几十份平台提案，习惯用「人群画像×场景价值×交付证据」三栏评估；场合为比稿会 20 分钟。他们最大的疑虑是：阅读平台声量小，凭什么值得从短视频预算里切一块——提案必须正面回答，不能绕。
    
    ## 决策背景
    
    本单元为「只给目标」形态且**信号弱**：平台的用户规模、日活、画像数据属于商业化敏感数据，比稿前阶段不对外提供具体数值（提案阶段只允许描述性表述），广告转化效果数据没有第三方认证。换句话说，提案可用的「硬信号」极少——这正是评测点：在信号弱的比稿里，提案的论证质量取决于：人群匹配的定性论证链是否严谨、场景价值的机制解释是否成立、可交付性的证据（内容案例、执行流程、验收方式）是否具体。用「估算」包装伪数据是比稿会上被一票否决的行为。
    
    ## 约束
    
    1. 本任务**无随附数据材料且不提供平台运营数值**：不得出现具体的用户量、日活、完读率、转化率数字；「量级描述」（如「千万级注册用户」）也须标注为平台自述口径、以示意级呈现。
    2. 人群匹配论证须基于公开可核事实（品类消费趋势、阅读人群研究的一般结论）加明确的推断标注，不得把推断写成平台调研结论。
    3. 场景价值论证须讲机制（阅读场景的注意力质量、长内容的心智停留），不堆形容词。
    4. 交付方案须给出执行链路与验收口径（上线时间、内容规格、结案报告形态），不承诺无法验收的效果指标（如销量贡献）。
    5. 语体符合广告提案商务规范：可以有创意感性页，但论证页须商务清晰；不得贬损短视频等其他媒介。
    
    ## 材料指引
    
    本单元为「只给目标」形态：以上简报即全部输入。允许基于明确估算/示意组织内容，关键事实不足处披露并收窄断言；涉及平台自身数据的表述一律以「示意/自述口径」标注。
    
    （本单元无随附材料——只给目标形态，约束见简报「材料指引」节。）

constraints:
  max_turns: 48
  timeout_seconds: 3600

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_content_execution_boundary.py
  timeout_seconds: 10

collect_artifacts:
  - "project/**"
