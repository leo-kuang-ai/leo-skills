id: content-quality-u11
title: 跨行业内容质量 U11 游戏娱乐（只给目标（无随附材料））
description: |
  方案 005 跨行业内容质量测评单元：游戏娱乐。真实 agent 运行 execute 模式 generate
  路线至内容与风格合同完成、样张前截断；A1–A5 判据由评测侧 L0 机检与 L1 双判官在冻结
  产物上离线评审；内联 judge 仅检查停止点执行边界，harness 通过≠内容达标。

input:
  prompt: |
    使用 $leo-ppt-generator，进入 execute 模式 generate 路线，完成以下委托任务。这是一次评测委托：内容与风格合同层是本次唯一交付物。
    
    【委托与边界】
    1. 委托执行：合同、大纲、母版、风格与版式决策均由你在授权范围内自主推进并记录为委托决策（decision_source: user-delegated，附依据），无需中途向用户确认；可逆决策自行完成内部审查并留痕。
    2. 停止点：完成「内容合同 → 大纲 → 逐页母版 → 风格选定（style list/load/render，同一 home，记录 selection_fingerprint 与归因一句）→ 版式调度（逐页 P 码）→ 容量预检」后即停止。不要生成样张或任何图片，不要派发任何 worker，不要调用图片 Provider；本次无需核对图片 Provider/worker 可用性。
    3. 落盘范围：一切产物只写入当前工作目录下的 ./project/ 子树（项目根目录用 ./project/；风格注册表 home 一律隔离在该子树内，如 ./project/leo-home/），不得写该子树之外的任何位置。
    4. 材料边界：只依据下面的任务简报与随附材料；不联网检索；不读取本任务输入之外的任何文件。材料/简报未给出的关键事实不足时，按合同纪律披露并收窄断言（unknown），不要编造。
    5. blocked 纪律：如遇无法可靠推断且必须用户补答的关键事实，记录 blocked 项与原因，继续完成其余部分；不得模拟用户答案或伪造人工确认。
    6. 完成后回复一页摘要：产物路径清单（合同/大纲/母版/风格选择记录/版式调度记录）、确切页数、风格选择与归因一句、容量预检结论（含软超如实报告）、blocked 清单（若有）。
    
    【任务简报】
    # 任务简报 U11 · 游戏娱乐 —— 中型厂商的新手游发行提案
    
    - 行业：游戏娱乐（梯度 G1-styles：有行业风格资产，无专属内容规则）
    - 任务型：路演（发行提案）
    - 主要受众：投资人（含潜在发行方的投资决策会）
    - 材料形态：只给目标（无随附材料；项目背景与约束分散在本简报各节）
    - 难度型：事实堆积
    - 页数：**12 页**（含封面与收束页，从总数内分配）
    
    ## 委托方与背景
    
    你是「回声工作室」的发行负责人。工作室 41 人，此前做过两款中度策略手游：第一款代发行为主、流水平平；第二款自研自发，在东南亚市场跑通了买量回收模型但利润薄。现在第三款产品《雾境远征》（Roguelike + 轻策略卡牌，单局 12 分钟，竖屏）已完成 7 个月的开发，核心玩法验证版本（Steam Demo 转化数据良好，但该口径不能直接代表手游）在内部测试中留存表现达到立项预期。发行策略要在「国内独代」与「自发行+海外先发」之间选择，你受委托准备 12 页发行提案，下周向潜在发行方与跟投机构的联合决策会汇报。
    
    ## 任务目标
    
    提案要完成：产品竞争力论证（品类定位、留存与付费设计、与三款头部竞品的差异化）；发行路线两案对比（独代的分成结构与风险转移 vs 自发行的买量回收模型与现金流压力），给出推荐与依据；未来 12 个月的里程碑（测试节点、版号节奏假设、上线窗口）与资金需求。行动目标是拿到发行方立项意向或跟投机构的下一轮尽调邀请。
    
    ## 受众与场合
    
    发行方投资决策会（商务、发行运营、用户增长背景）加跟投机构分析师，对品类的买量成本与回收周期极其敏感，熟悉版号与平台政策；场合为 35 分钟提案。受众会核对你们过往两款产品的口径（《雾境远征》的 Demo 数据与手游数据口径不同，直接混用会被视为不专业）。
    
    ## 决策背景
    
    本简报的约束与事实分散在各节：团队规模与前作表现（上文）、产品形态与测试进展（上文）、两条发行路线的结构差异（目标节）、版号与平台政策的时间变量（下文约束）。这些散落的背景事实就是本提案的「材料」——提案页序设计考验的是把分散事实组织成论证链：竞争力→路线→里程碑→资金，每一步引用哪些背景、舍弃哪些，决定提案的说服力。前两款产品的历史数据具体数值工作室未整理进本简报，涉及处只能定性描述或显式 unknown。
    
    ## 约束
    
    1. 本任务**无随附数据材料**：简报中给出的定性事实之外，任何具体数字（留存率、买量成本、分成比例）只能以「估算/示意」标注出现并给出假设依据；未标注性质的数字不得出现。
    2. Steam Demo 转化与手游留存是不同口径：引用时必须注明口径性质，不得把 PC 端表现直接表述为手游预期。
    3. 版号与平台政策按现状描述（不确定的时间变量标注为假设与风险），不得写成确定性时间表。
    4. 两案对比须给出结构化差异（风险、现金流、控制权、回收周期），不得只罗列优点；推荐结论须给出判据权重。
    5. 收束页行动项可核（如「两周内提供留存漏斗底表与投放测试方案」）。
    
    ## 材料指引
    
    本单元为「只给目标」形态，其「事实堆积」体现在简报内分散的项目背景与约束：不额外提供经营数据包，也不暗加任何数据；允许基于明确估算/示意组织内容，关键事实不足处披露并收窄断言。
    
    （本单元无随附材料——只给目标形态，约束见简报「材料指引」节。）

constraints:
  max_turns: 48
  timeout_seconds: 3600

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_content_execution_boundary.py
  timeout_seconds: 10

collect_artifacts:
  - "project/**"
