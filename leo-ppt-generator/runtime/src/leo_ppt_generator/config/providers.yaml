# OpenAI 兼容图片渠道目录（checked-in 数据，非用户输入）
#
# 新增渠道：在本文件加一条 + references/provider-catalog.md 补引导条目 +
# runtime/src/leo_ppt_generator/schemas/ 下 4 个 schema 的 provider enum 同步
# （tests/test_channel_catalog.py 有 enum 与目录的一致性看护）。不改任何代码。
#
# 字段约束（channel_catalog.py 加载时 fail-closed 校验）：
# - display_name: 向导菜单与概览使用的中文显示名
# - featured: 可选，至多一个渠道可设；设为 true 时该渠道在向导菜单
#   排第一位并标注（推荐），作为默认选中的渠道
# - id: 小写 kebab-case，不得与内置 provider（openai / openai-compatible /
#   atlascloud / builtin-imagegen / fixture / paddleocr）冲突
# - endpoint_origin: 仅 https origin（不带路径 / query / 凭据）
# - api_path: 以 / 开头的固定路径前缀，执行期拼到 origin 之后
# - credential_environment: 该渠道 API Key 的环境变量名
# - capabilities 由加载器统一固定为 generate-only（v1），不在数据里放开
schema_version: 1
channels:
  - id: qianxing
    display_name: 乾行AI
    featured: true
    portal: https://fast.qianxing.us.ci/
    key_page: https://fast.qianxing.us.ci/token
    credential_environment: QIANXING_API_KEY
    endpoint_origin: https://fast.qianxing.us.ci
    api_path: /v1
    default_model: gpt-image-1
    models:
      - gpt-image-1
      - gpt-image-1-mini
    notes: >-
      乾行AI画廊（new-api 系中转，OpenAI 兼容）。登录后在「令牌」页
      （/token）创建 API Key；可用图片模型以站内「模型价格」页为准，
      支持 gpt-image 系列及站内上架的聚合模型。配置时只需填 API Key
      与模型，端点回车用默认。
  - id: zhipu
    display_name: 智谱
    portal: https://open.bigmodel.cn/
    key_page: https://open.bigmodel.cn/usercenter/apikeys
    credential_environment: ZHIPU_API_KEY
    endpoint_origin: https://open.bigmodel.cn
    api_path: /api/paas/v4
    default_model: cogview-4
    models:
      - glm-image
      - cogview-4-250304
      - cogview-4
      - cogview-3-flash
    param_compat:
      rejects: [quality]
      size: {multiples_of: 16, min_edge: 512, max_edge: 2880, max_pixels: 2097152}
    notes: >-
      仅文生图；响应只含临时 URL（30 天有效，无 response_format 参数），由
      vendor url 回退补丁（patches/0008）下载转存。cogview 尺寸 512–2048 且为
      16 的倍数；glm-image 需 1024–2048 且为 32 的倍数、仅支持 hd。个人测试
      可用 cogview-3-flash 免费额度。
  - id: dashscope
    display_name: 阿里云百炼
    portal: https://bailian.console.aliyun.com/
    key_page: https://bailian.console.aliyun.com/?apiKey=1
    credential_environment: DASHSCOPE_API_KEY
    endpoint_origin: https://dashscope.aliyuncs.com
    api_path: /compatible-mode/v1
    default_model: qwen-image
    models:
      - qwen-image
      - qwen-image-edit
    notes: >-
      阿里云百炼 OpenAI 兼容层同步通道，覆盖 qwen-image 系列（擅长中文文字
      渲染）。wanx（通义万相）与可灵 kling 走百炼原生异步任务接口，不在本
      通道内；尺寸以官方推荐集合为准。
  - id: ark
    display_name: 火山方舟
    portal: https://www.volcengine.com/product/ark
    key_page: https://console.volcengine.com/ark/region:ark+cn-beijing/apiKey
    credential_environment: ARK_API_KEY
    endpoint_origin: https://ark.cn-beijing.volces.com
    api_path: /api/v3
    default_model: doubao-seedream-4-0-250828
    models:
      - doubao-seedream-4-0-250828
      - doubao-seededit-3-0-i2i
    param_compat:
      rejects: [output_format]
    notes: >-
      火山方舟同步通道（即梦 Seedream 底层）。response_format 支持 url（默认）
      与 b64_json；中文提示词理解与人像质感强。seededit 为图生图模型，走
      images 数组而非 images/edits，v1 仅声明 generate。
  - id: qianfan
    display_name: 百度千帆
    portal: https://cloud.baidu.com/product/qianfan
    key_page: https://console.bce.baidu.com/iam/#/iam/apikey/list
    credential_environment: QIANFAN_API_KEY
    endpoint_origin: https://qianfan.baidubce.com
    api_path: /v2
    default_model: ernie-vig-v2
    models:
      - ernie-vig-v2
    notes: >-
      百度千帆 v2 OpenAI 兼容通道（文心一格）。API Key 在百度智能云 IAM 创建；
      可用模型以千帆控制台模型列表为准。
  - id: hunyuan
    display_name: 腾讯混元
    portal: https://cloud.tencent.com/product/hunyuan
    key_page: https://console.cloud.tencent.com/tokenhub
    credential_environment: HUNYUAN_API_KEY
    endpoint_origin: https://tokenhub.tencentmaas.com
    api_path: /v1
    default_model: hy-image-v3.0
    models:
      - hy-image-v3.0
    notes: >-
      腾讯混元 TokenHub 同步兼容通道（API Key 鉴权，绕开 TC3 签名），当前仅
      混元生图 3.0。旧控制台 TC3 签名与异步任务接口不在本通道内；图生图可
      通过请求中的 images 数组实现，v1 仅声明 generate。
  - id: modelscope
    display_name: 魔搭 ModelScope
    portal: https://modelscope.cn/
    key_page: https://modelscope.cn/my/keys
    credential_environment: MODELSCOPE_API_TOKEN
    endpoint_origin: https://api-inference.modelscope.cn
    api_path: /v1
    default_model: Qwen/Qwen-Image
    models:
      - Qwen/Qwen-Image
    notes: >-
      魔搭 API-Inference 兼容通道，模型名用仓库全路径（如 Qwen/Qwen-Image），
      凭据为 ModelScope SDK Token。有每日免费额度，适合测试与科研。
