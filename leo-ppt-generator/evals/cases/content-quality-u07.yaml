id: content-quality-u07
title: 跨行业内容质量 U07 制造能源（只给目标（无随附材料））
description: |
  方案 005 跨行业内容质量测评单元：制造能源。真实 agent 运行 execute 模式 generate
  路线至内容与风格合同完成、样张前截断；A1–A5 判据由评测侧 L0 机检与 L1 双判官在冻结
  产物上离线评审；内联 judge 仅检查停止点执行边界，harness 通过≠内容达标。

input:
  prompt: |
    使用 $leo-ppt-generator，进入 execute 模式 generate 路线，完成以下委托任务。这是一次评测委托：内容与风格合同层是本次唯一交付物。
    
    【委托与边界】
    1. 委托执行：合同、大纲、母版、风格与版式决策均由你在授权范围内自主推进并记录为委托决策（decision_source: user-delegated，附依据），无需中途向用户确认；可逆决策自行完成内部审查并留痕。
    2. 停止点：完成「内容合同 → 大纲 → 逐页母版 → 风格选定（style list/load/render，同一 home，记录 selection_fingerprint 与归因一句）→ 版式调度（逐页 P 码）→ 容量预检」后即停止。不要生成样张或任何图片，不要派发任何 worker，不要调用图片 Provider；本次无需核对图片 Provider/worker 可用性。
    3. 落盘范围：一切产物只写入当前工作目录下的 ./project/ 子树（项目根目录用 ./project/；风格注册表 home 一律隔离在该子树内，如 ./project/leo-home/），不得写该子树之外的任何位置。
    4. 材料边界：只依据下面的任务简报与随附材料；不联网检索；不读取本任务输入之外的任何文件。材料/简报未给出的关键事实不足时，按合同纪律披露并收窄断言（unknown），不要编造。
    5. blocked 纪律：如遇无法可靠推断且必须用户补答的关键事实，记录 blocked 项与原因，继续完成其余部分；不得模拟用户答案或伪造人工确认。
    6. 完成后回复一页摘要：产物路径清单（合同/大纲/母版/风格选择记录/版式调度记录）、确切页数、风格选择与归因一句、容量预检结论（含软超如实报告）、blocked 清单（若有）。
    
    【任务简报】
    # 任务简报 U07 · 制造能源 —— 化工集团双碳改造路线图立题汇报
    
    - 行业：制造能源（梯度 G1-styles：有行业风格资产，无专属内容规则）
    - 任务型：汇报（立项前研究）
    - 主要受众：集团经营管理层（总经理办公会）
    - 材料形态：只给目标（无随附材料）
    - 难度型：不确定
    - 页数：**11 页**（含封面与收束页，从总数内分配）
    
    ## 委托方与背景
    
    你是某中型化工集团（三个生产基地，主营精细化工品）战略发展部的双碳专项经理。集团还没有做过完整碳盘查，明年起出口客户将陆续要求产品碳足迹披露，集团层面第一次要为「双碳改造」立项。总经理办公会先要一份立题汇报：不要求马上给改造方案，而是给出路线图框架与立项逻辑。你受委托准备 11 页汇报稿。
    
    ## 任务目标
    
    立题汇报要回答：不做完整盘查的前提下，路线图怎么分阶段才不虚；三个基地哪些改造方向大概率优先（基于工艺与能源结构的定性判断）；立题阶段的预算与周期申请多少合适。行动目标是办公会批准立项与第一期盘查预算。
    
    ## 受众与场合
    
    总经理办公会，成员为生产、财务、战略背景的高管，对「双碳」的态度分化：生产副总担心环保投入挤压技改，财务副总警惕无回报的合规性支出；场合为办公会专项议程 25 分钟。汇报须把「合规压力—改造回报—不确定性」三层都摆到桌面上，任何一边倒的倾向都会被另一方抓住。
    
    ## 决策背景
    
    这个题目的核心困难是**不确定**：集团从未做过碳盘查，自身排放基线未知；出口客户的要求细则尚未全部落地（披露口径、核查等级都还在沟通）；主流减碳技术路线（电气化改造、余热回收、绿电采购、原料替代）在精细化工行业的适用性与投资回报缺乏本集团数据。所有关键决策都建立在未来才能获得的盘查数据上——立题逻辑必须诚实处理这一点，而不是假装已有答案。
    
    ## 约束
    
    1. 本任务**无随附数据材料**：不得虚构集团排放量、能耗、投资额等数字；路线图中的量化内容（改造周期、预算、减排幅度）允许基于公开行业常识做「估算/示意」级表述并标注性质，未标注的数字不得出现。
    2. 摆放不确定性是硬要求：盘查前后的决策边界须显式（哪些决策必须等盘查数据、哪些可以先动），不得把「待盘查」写成「已掌握」。
    3. 改造方向的优先级判断须给出依据（工艺特征、能源结构等定性理由），并标注判断的不确定程度；不得使用绝对化的减排承诺。
    4. 预算申请须拆到可核粒度（盘查范围、核查等级、第三方费用结构），金额测算给不出就显式 unknown 加补齐时限。
    5. 术语规范：碳盘查/碳核查/碳足迹/范围一范围二范围三等概念按规范含义使用，不得混用。
    
    ## 材料指引
    
    本单元为「只给目标」形态：以上简报即全部输入。允许基于明确估算/示意组织内容（如按行业公开常识估算盘查周期），关键事实不足处披露并收窄断言；涉及集团自身状况的数字一律不得出现（未知即 unknown）。
    
    （本单元无随附材料——只给目标形态，约束见简报「材料指引」节。）

constraints:
  max_turns: 48
  timeout_seconds: 3600

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_content_execution_boundary.py
  timeout_seconds: 10

collect_artifacts:
  - "project/**"
