id: content-quality-u05
title: 跨行业内容质量 U05 教育学术（只给目标（无随附材料））
description: |
  方案 005 跨行业内容质量测评单元：教育学术。真实 agent 运行 execute 模式 generate
  路线至内容与风格合同完成、样张前截断；A1–A5 判据由评测侧 L0 机检与 L1 双判官在冻结
  产物上离线评审；内联 judge 仅检查停止点执行边界，harness 通过≠内容达标。

input:
  prompt: |
    使用 $leo-ppt-generator，进入 execute 模式 generate 路线，完成以下委托任务。这是一次评测委托：内容与风格合同层是本次唯一交付物。
    
    【委托与边界】
    1. 委托执行：合同、大纲、母版、风格与版式决策均由你在授权范围内自主推进并记录为委托决策（decision_source: user-delegated，附依据），无需中途向用户确认；可逆决策自行完成内部审查并留痕。
    2. 停止点：完成「内容合同 → 大纲 → 逐页母版 → 风格选定（style list/load/render，同一 home，记录 selection_fingerprint 与归因一句）→ 版式调度（逐页 P 码）→ 容量预检」后即停止。不要生成样张或任何图片，不要派发任何 worker，不要调用图片 Provider；本次无需核对图片 Provider/worker 可用性。
    3. 落盘范围：一切产物只写入当前工作目录下的 ./project/ 子树（项目根目录用 ./project/；风格注册表 home 一律隔离在该子树内，如 ./project/leo-home/），不得写该子树之外的任何位置。
    4. 材料边界：只依据下面的任务简报与随附材料；不联网检索；不读取本任务输入之外的任何文件。材料/简报未给出的关键事实不足时，按合同纪律披露并收窄断言（unknown），不要编造。
    5. blocked 纪律：如遇无法可靠推断且必须用户补答的关键事实，记录 blocked 项与原因，继续完成其余部分；不得模拟用户答案或伪造人工确认。
    6. 完成后回复一页摘要：产物路径清单（合同/大纲/母版/风格选择记录/版式调度记录）、确切页数、风格选择与归因一句、容量预检结论（含软超如实报告）、blocked 清单（若有）。
    
    【任务简报】
    # 任务简报 U05 · 教育学术 —— 博士组会的下一阶段实验设计提案
    
    - 行业：教育学术（梯度 G1-rules：有专属内容规则）
    - 任务型：汇报（组会提案）
    - 主要受众：学术同行（导师与课题组同学，计算语言学方向组会）
    - 材料形态：只给目标（无随附材料）
    - 难度型：信号弱
    - 页数：**10 页**（含封面与收束页，从总数内分配）
    
    ## 委托方与背景
    
    你是计算语言学方向的三年级博士生，研究低资源语言的形态分析。上一个模型实验的结果未达预期（在你自建的评测集上准确率提升不显著），课题组决定不投稿本轮会议，转向一个新思路：用「形态分段的无监督发现 + 少量标注引导」替代端到端标注训练。下一次组会轮到你做 10 页汇报，提出下一阶段的实验设计方案。
    
    ## 任务目标
    
    汇报要让课题组判断这个新思路值不值得投入一个学期：拟验证的科学假设是什么、与已有两条技术路线的差别在哪、实验怎么设计才能让结果无论正负都有结论价值、需要多少标注预算。行动目标是组会当场确认方案（或确认修改后通过），并锁定标注预算申请。
    
    ## 受众与场合
    
    导师加六名同学，都熟悉本领域术语与主流基线，讨厌营销话术；场合为 40 分钟组会（含讨论），演示文稿是讨论的靶子而不是展示品。学术场合要求：假设、判据、预算全部显式，任何「预期能大幅提升」的说法都会被追问依据。
    
    ## 决策背景
    
    新思路的直接风险是「信号弱」：目前没有任何先行实验数据支撑它比现路线更好，唯一的间接证据是相邻领域（语音分段）有一篇论文用类似思想成功过，但任务差异大。此外实验室的标注预算有限（按条计价），标注量的设计直接决定假设检验的统计功效——功效不足的实验等于白做。导师在上一轮已明确要求：本轮提案必须给出样本量依据，而不是「先标 500 条看看」。
    
    ## 约束
    
    1. 本任务**无随附数据材料**：不联网检索，不虚构实验数据或文献结论；实验设计参数（样本量、轮次、指标阈值）允许基于明确的估算假设给出，但每个估算必须标注假设与依据，不标注来源的数字不得出现。
    2. 相邻领域那篇论文的启示只能以「示意」性质引用（方向参考），不得写成「已证明在本任务有效」。
    3. 学术合同要素须齐备：假设的可证伪表述、评测指标与判据、基线选择理由、消融设计、失败判读（什么结果算证伪）。
    4. 涉及统计功效的表述须给出计算依据或显式 unknown，不得用「足够」搪塞。
    5. 语体为学术组会规范：术语准确（区分「准确率/召回率/F1」等），不使用商业渲染词。
    
    ## 材料指引
    
    本单元为「只给目标」形态：以上简报即全部输入。允许基于明确估算/示意组织内容（如按同类文献常见规模估算样本量并标注），关键事实不足处应披露并收窄断言（如功效计算所需方差未知时，显式写出「方差未知，按 X 假设估算，标注为估算级」）。
    
    （本单元无随附材料——只给目标形态，约束见简报「材料指引」节。）

constraints:
  max_turns: 48
  timeout_seconds: 3600

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_content_execution_boundary.py
  timeout_seconds: 10

collect_artifacts:
  - "project/**"
