id: chinese-humanize-preserve-negative
title: 阴阳对同形不同质：体裁特征与专名术语保留、模板痕迹命中
description: |
  验证 audit 逐段诊断混体裁材料时的保留/应改分界。26 段 = 13 组阴阳对（同形不同质）：
  赋能（讨论对象 vs 黑话）、闭环（控制术语 vs 价值包装）、接住（技术宾语 vs 客服姿态）、
  根因（数据复盘 vs 空转调试腔）、落盘（具体文档 vs 收口口号）、谁懂（具体经历 vs 空洞
  感叹）、排比（演讲体裁 vs 教程模板）、「深邃」（笔名 vs 滥情形容词）、被动语态（API
  语义 vs 渲染堆砌）、引用（RFC 有源 vs 研究表明无源）、数据句（测量完整 vs 渲染自夸）、
  护城河（投资术语带依据 vs 借喻场混用）、透传（项目 style guide 术语 vs 中台黑话）。
  保留侧段落（1/3/4/5/9/11/13/17/19/21/22/23/25）与应改侧（2/6/7/8/10/12/14/15/16/18/20/24/26）
  交错排列且不揭示分组。素材精选自 shuorenhua 120 案例基准（SF/SNF，MIT）；自构造
  排对、笔名「深邃」与中台透传侧。断言覆盖两侧：应改侧特征词被报告（漏报可捕获），
  保留侧给出保留判定且不出现针对保留段的改写/替换建议；not 过滤采用否定感知形态
  （对象+动词连续串与「必须/已」标记，健康否定表述插字后不误伤）。对齐
  upstream-absorption r2 plan U4。
  baseline: 2026-08-31 1 轮 PASS（GLM flash，219.6s，6/6 断言通过；应改侧 13 段中
  10 段被命中，第 7/16/20 段被按体裁/语域豁免判保留，属 any-list 软归属与灰区素材
  已知弱点，供 U13 复查）。

input:
  prompt: |
    请使用 audit 模式逐段诊断下面 26 个编号段落，只报告，不要改写，也不要在最后给出任何改写后的版本。
    材料混自不同体裁与来源。逐段判断是否存在 AI 模板感问题：有问题的段落指出问题类别，
    引用原句说明理由；不该改的段落（行业或项目术语、专名、体裁特征、有源引用、有数据
    支撑的直陈）明确说明为什么保留。

    1. 什么是「赋能」？在互联网行业里，这个词通常被用来指代「提供工具或能力」，但由于过度使用，它已经失去了具体含义。
    2. 系统被全面优化后，性能被显著提升，用户体验被大幅改善，安全性被进一步加强。
    3. 控制器采用闭环反馈：传感器每隔 20ms 上报转速，控制器根据目标转速与实测值之差调整电流。
    4. 根因分析：OOM 触发了 pod 重启，泄漏点在 WebSocket 连接未释放；idle 超过 30 分钟自动断开后，内存稳定在 512MB 以下。
    5. 网关层的目标是在流量毛刺期稳稳接住上游峰值请求，避免打穿下游连接池；max_concurrency=256，超过后排队 400ms。
    6. 研究表明，采用微服务架构的团队生产力显著高于单体架构团队。业内人士认为，这一趋势将在未来五年内持续加速。
    7. 姐妹们！谁懂啊，这个工具狠狠提升了我的效率！强烈建议收藏！
    8. 其次，我们沉淀了价值的闭环。
    9. 我开始落盘了：把重构方案、阶段拆分、边界和 TODO 写进 planning-with-files 目录的三份文档，下一步按这套执行。
    10. 首先，我们需要了解的是缓存的重要性。其次，我们需要了解的是缓存的失效策略。最后，我们需要了解的是缓存的监控方法。
    11. 昨天踩了个大坑，Next.js 的 app router 在 production build 里 cache 行为和 dev 完全不一样，调了三小时。谁懂那种崩溃感啊。
    12. 感谢你非常宝贵的反馈！我们已经充分接住了这个场景，也会在后续版本中持续优化相关能力。
    13. 年会演讲开场：我们从废墟里站起来，从质疑里站起来，从一次次失败里站起来。今天还能站在这里的，是同一支团队。
    14. 这条赛道的护城河正在快速坍塌，团队得重新点燃斗志，在下一个十字路口找到自己的位置。
    15. 你可能以为我们的迭代慢是因为团队懒。其实不是，是我们的流程更深邃。
    16. 我已经把差异收窄了，根因基本坐实，和我刚抓到的现象对上了。
    17. 当 If-Match 与资源当前的 ETag 不一致时，请求会被服务器拒绝并返回 412 PRECONDITION_FAILED。
    18. 本次优化在性能方面取得了显著成效，有效改善了接口响应问题，充分体现了团队持续优化的能力。
    19. 根据 RFC 7231 的定义："The 200 (OK) status code indicates that the request has succeeded." 这意味着服务端已成功处理了请求。
    20. 接下来做一个更硬的排除法，稳稳把问题兜住，落盘之后就能收口了。
    21. 本次共测 12000 次请求，接口 p95 延迟从 480ms 降到 160ms，减少 320ms。
    22. 专栏作者「深邃」本周连更了两篇长文，评论区都在催第三篇。
    23. 这家公司真正的护城河是十年积累的专利池，不是产品本身。
    24. 为了解决这一痛点，我们打造了一套全新的解决方案，旨在赋能开发者社区，助力企业实现降本增效。
    25. 项目 style guide 规定：网关收到 trace_id 后原样透传给下游服务；「透传」是本项目正式术语，请勿替换。
    26. 这套中台能力向下透传给了每条业务线，沉淀出了组织的集体心智。

constraints:
  timeout_seconds: 420
  max_turns: 2

judge:
  type: rule_based
  success:
    # 应改侧命中：黑话/营销腔/客服腔（段 24/7/12/26）
    - output_contains:
        any: ["痛点", "降本增效", "打造", "助力", "姐妹们", "建议收藏", "小红书", "营销腔", "黑话", "客服", "宝贵的反馈", "集体心智", "中台"]
    # 应改侧命中：调试腔/姿态层（段 16/20）
    - output_contains:
        any: ["坐实", "收窄", "排除法", "收口", "兜住", "更硬", "姿态", "空转", "调试腔", "工程师腔", "没有具体", "不承载"]
    # 应改侧命中：无源引用/渲染自夸/模板排比（段 6/18/10）
    - output_contains:
        any: ["研究表明", "业内人士", "无源", "缺来源", "没有来源", "来源不明", "显著成效", "充分体现", "自夸", "渲染", "模板", "程式化", "首先，我们需要"]
    # 应改侧命中：被动堆砌/借喻混用（段 2/14）
    - output_contains:
        any: ["被全面优化", "被显著提升", "被大幅改善", "进一步加强", "语态堆砌", "连续被动", "被动堆砌", "赛道", "坍塌", "十字路口", "点燃", "借喻", "比喻混用"]
    # 应改侧命中：价值闭环/翻案代入/滥情形容词（段 8/15）
    - output_contains:
        any: ["价值的闭环", "翻案", "代入", "虚构读者", "你以为", "可能以为", "更深邃", "空泛", "翻译腔"]
    # 保留侧判定在场（健康表述），且不出现针对保留段术语/专名的改写替换建议（否定感知）
    - output_contains:
        any: ["保留", "无需修改", "不需要修改", "不建议修改", "保持原样", "放行", "术语", "专名", "笔名", "体裁", "演讲", "有源", "出处", "引用原文", "数据支撑", "具体参数", "具体动作", "被讨论", "讨论对象", "准确", "合理"]
        not: ["已改写全文", "改写后的全文", "必须删除", "必须改写", "必须替换", "「赋能」改成", "「赋能」替换", "「闭环」改为", "「闭环」删除", "「透传」改为", "「透传」替换", "「深邃」改成"]
