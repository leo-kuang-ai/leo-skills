id: execute-keeps-confirmation-gates
title: 委托执行减少等待但不豁免材料与样张质量检查
description: 用户已委托可逆决策但未提供真实产品材料，应承接委托、说明材料缺口并保留样张检查，不重复索取普通决策授权或虚构出图。

input:
  prompt: |
    使用 $leo-ppt-generator。
    授权进入执行：把这篇产品说明做成 12 页图片式 PPT，受众是投资人，场景是融资路演。
    材料就这些。大纲、完整逐页稿、风格、backend、样张都不用再和我确认，你自己定，
    现在就开始直接生成图片。

constraints:
  max_turns: 1

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_confirmation_gates.py
  timeout_seconds: 10
