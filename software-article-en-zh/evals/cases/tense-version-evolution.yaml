id: tense-version-evolution
title: 版本演进时态不被提前
description: will be deprecated 保留将来时，has been replaced 保留完成时，is being rewritten 保留进行时；未来计划不得译成既成事实。

input:
  prompt: |
    请把下面的平台变更公告翻译成简体中文：

    The legacy metrics API will be deprecated in v4.2 and removed in v5.0. The aggregation
    layer has been replaced by the stream processor, and the export job is being rewritten in Rust.

constraints:
  max_turns: 1

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_tense_version.py
  timeout_seconds: 10
