id: publication-five-part-deliverable
title: 发布型五件套交付（最小合规）
description: publication 模式输出必须包含译文正文、翻译说明、技术术语表、歧义与原文问题清单、未解决事项五个组件；无已知项可写“无已知…”，不得省略节。

input:
  prompt: |
    请把下面这段工具说明翻译成简体中文，并润色为官方技术运营文风以供发布：

    The CLI ships with a config doctor command. It validates your config file, prints a summary of unknown keys, and exits with a nonzero code when required fields are missing. The doctor never modifies your config file.

constraints:
  max_turns: 1

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_publication_five_part.py
  timeout_seconds: 10
