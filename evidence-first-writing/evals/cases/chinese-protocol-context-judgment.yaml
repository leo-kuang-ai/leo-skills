id: chinese-protocol-context-judgment
title: 中文协议上下文判断与停止条件不制造 finding
description: |
  验证审查一篇整体自然的中文作者原稿时：不因单个高频词、单次反转、自然排比或
  长句判定 AI 模板感；准确使用的「闭环」被识别为术语而非命中词表；没有实质问题
  时明确停止而不是硬改。对齐 eval-plan Case 6 的确定性子集。

input:
  prompt: |
    只审查下面这段中文是否存在 AI 模板感问题，不要改写，给出你的判断。

    这套流程跑了三个月，算是闭环了：工单进来，值班认领，复盘归档，下一轮能查到上次的决定。我起初担心的不是流程慢，而是没人愿意在复盘里写实话。后来发现，写真话的人多了，流程自然就快了。愿意写的人放手写，不会写的人先照模板抄，写不动的人当面说。三个月，四十多张工单，没有一次复盘缺席。下一轮我想试试把复盘时间砍到半小时，看看会不会漏掉东西。

constraints:
  timeout_seconds: 300
  max_turns: 2

judge:
  type: rule_based
  success:
    - output_contains:
        any: ["无需修改", "不需要修改", "不需要处理", "不需要硬改", "无需硬改", "停止硬改", "保持原文", "整体自然", "整体不像", "人味充足", "模板感低", "人工痕迹", "整体干净", "没有明显问题", "未发现明显", "不建议修改", "无需处理", "可以保留", "停止"]
    - output_contains:
        any: ["闭环"]
    - output_contains:
        any: ["保留", "准确", "术语", "合理", "有意"]
        not: ["建议删除「闭环」", "建议删除闭环", "删除「闭环」", "整体重写", "需要大幅改写", "每句都需"]
