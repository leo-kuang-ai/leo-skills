id: content-quality-u15
title: 跨行业内容质量 U15 航空航天（直出（含随附材料））
description: |
  方案 005 跨行业内容质量测评单元：航空航天。真实 agent 运行 execute 模式 generate
  路线至内容与风格合同完成、样张前截断；A1–A5 判据由评测侧 L0 机检与 L1 双判官在冻结
  产物上离线评审；内联 judge 仅检查停止点执行边界，harness 通过≠内容达标。

input:
  prompt: |
    使用 $leo-ppt-generator，进入 execute 模式 generate 路线，完成以下委托任务。这是一次评测委托：内容与风格合同层是本次唯一交付物。
    
    【委托与边界】
    1. 委托执行：合同、大纲、母版、风格与版式决策均由你在授权范围内自主推进并记录为委托决策（decision_source: user-delegated，附依据），无需中途向用户确认；可逆决策自行完成内部审查并留痕。
    2. 停止点：完成「内容合同 → 大纲 → 逐页母版 → 风格选定（style list/load/render，同一 home，记录 selection_fingerprint 与归因一句）→ 版式调度（逐页 P 码）→ 容量预检」后即停止。不要生成样张或任何图片，不要派发任何 worker，不要调用图片 Provider；本次无需核对图片 Provider/worker 可用性。
    3. 落盘范围：一切产物只写入当前工作目录下的 ./project/ 子树（项目根目录用 ./project/；风格注册表 home 一律隔离在该子树内，如 ./project/leo-home/），不得写该子树之外的任何位置。
    4. 材料边界：只依据下面的任务简报与随附材料；不联网检索；不读取本任务输入之外的任何文件。材料/简报未给出的关键事实不足时，按合同纪律披露并收窄断言（unknown），不要编造。
    5. blocked 纪律：如遇无法可靠推断且必须用户补答的关键事实，记录 blocked 项与原因，继续完成其余部分；不得模拟用户答案或伪造人工确认。
    6. 完成后回复一页摘要：产物路径清单（合同/大纲/母版/风格选择记录/版式调度记录）、确切页数、风格选择与归因一句、容量预检结论（含软超如实报告）、blocked 清单（若有）。
    
    【任务简报】
    # 任务简报 U15 · 航空航天 —— 可复用火箭一子级第三次回收飞行结果评审
    
    - 行业：航空航天（梯度 G2：无专属内容规则；亦无专属风格资产）
    - 任务型：汇报（飞行结果技术评审）
    - 主要受众：技术同行（型号技术评审委员会：总师系统与外聘专家）
    - 材料形态：直出（遥测与试飞数据摘要，随附）
    - 难度型：事实堆积
    - 页数：**12 页**（含封面与收束页，从总数内分配）
    
    ## 委托方与背景
    
    你是商业航天公司「苍梧航天」的飞行数据分析工程师。公司的可复用运载火箭一子级刚完成第 3 次回收飞行（前两次：第 1 次回收成功但着陆支腿损伤、第 2 次因发动机二次点火延迟导致落点偏差超限、回收部分成功）。本次飞行回收成功。按型号研制程序，需要向型号技术评审委员会提交飞行结果评审汇报，你受委托准备 12 页评审稿。
    
    ## 任务目标
    
    评审要完成：本次飞行的关键事件时序还原（点火、最大动压、级间分离、再入点火、着陆）；三次飞行的关键参数对比与趋势判读（哪些指标收敛、哪些仍处边界）；下一次飞行的放宽或加严建议及其依据。行动目标是评审委员会签署「下次飞行状态变更单」。
    
    ## 受众与场合
    
    型号技术评审委员会：总设计师系统各专业副总师（结构、发动机、制导导航与控制、回收）加两名外聘专家，全是技术同行，会逐条核对遥测数据与判读逻辑；场合为评审会 40 分钟汇报+质询。这个受众对数据严谨性的要求是最高档：任何「明显改善」「状态良好」的定性结论都必须落到参数对比，口头形容词会被要求撤回。
    
    ## 决策背景
    
    本次飞行的数据里有几个需要谨慎判读的信号：着陆段垂直速度比设计包线中值偏低（好信号，但原因归因存在两个假设：制导律调参 or 气象风切变恰好有利）；再入段热防护表面温度测点中有一个测点数值临近阈值但未超（第 2 次飞行该测点曾超限，本次换过测点位置——数据可比性受影响）；发动机第三次点火时延仍在偏大区间（三次飞行均偏大，趋势未收敛）。这些信号的处理方式（哪些够支撑状态变更、哪些需要更多架次）正是评审要裁决的。
    
    ## 约束
    
    1. 全部飞行参数来自随附材料并保持其口径（坐标系、时基、测点编号），任何参数不得超出材料给出的数值范围；材料未给的参数不得杜撰。
    2. 三次飞行对比须注明可比性限制（测点位置变更、任务剖面差异），不得把不可直接对比的数值放进同一趋势结论。
    3. 每个技术判读（如垂直速度偏低的归因）须列出竞争性假设与当前证据强度，不得单假设定论；「好信号」也须给出置信度限制。
    4. 状态变更建议（放宽/加严/维持）逐项给出依据链（数据→判读→建议），未获数据支撑的建议项显式标注「需补充飞行验证」。
    5. 术语规范：按材料中的专业术语体系使用（如「落点偏差」「时延」「包线」），不得自造简化词；单位严格按材料（m/s、kN、s）。
    
    ## 材料指引
    
    随附材料为《第 3 次回收飞行数据评审包（摘要版）》，含关键事件时序表、三飞参数对比表（含可比性注释）、测点变更说明与两次历史飞行的结论摘要。**数据密度高、专业性强**：评审稿的事实底座必须完全锚定材料，取舍组织（哪些参数上主表、哪些进附录引用）本身就是受评能力。
    
    【随附材料】（材料引用级来源，允许输入的全部；数字与口径以此为准）
    # 第 3 次回收飞行数据评审包（摘要版）
    
    > 来源：遥测数据快变慢变处理结果（2026-10-14 飞，T0=当日 09:32:07 当地时）、外测数据、三飞对比基线（飞行数据组内部版）。坐标系统一为发射系，时基 T0。密级：项目内部。
    
    ## 一、关键事件时序（遥测判读）
    
    | 事件 | 时序 | 主要参数 |
    | --- | --- | --- |
    | 一子级 MECO（主发动机关机） | T+152 s | 关机速度 2,286 m/s，高度 47.5 km |
    | 最大动压区 qmax | T+68 s | 33.4 kPa（一飞 33.9、二飞 33.7，载荷预测包线内） |
    | 级间分离 | T+216 s | 分离相对速度 2.1 m/s（指标 ≤3.0） |
    | 再入点火（3 台） | T+381 s | 高度 41.2 km，速度 3,120 m/s |
    | 着陆 | T+522 s | 垂直速度 1.9 m/s，水平速度 0.6 m/s，落点偏差 87 m |
    
    ## 二、着陆段关键参数（与设计包线及前两飞对比）
    
    - 着陆垂直速度：**1.9 m/s**（设计包线 ≤4.0 m/s，包线中值 2.8；一飞 2.6、二飞 3.4）
    - 落点偏差：**87 m**（指标 ≤150 m；一飞 64 m 合格、二飞 212 m 超限〔本次任务部分成功的主因〕）
    - 支腿着地载荷：最大 78% 包线（一飞 91%——支腿损伤事件、二飞 84%）
    - 着陆剩余推进剂：6.2%（一飞 3.1%、二飞 1.8%）
    
    ## 三、需要谨慎判读的三个信号（飞行数据组初析）
    
    ### 信号 1：着陆垂直速度显著低于包线中值
    
    - 竞争性假设 A：制导律调参（三飞前将下降段减速目标高度上移 400 m）生效
    - 竞争性假设 B：着陆场当时存在弱下沉气流（气象雷达记录着陆时刻场区 800 m 以下有 1.2 m/s 下沉气流），与制导减速叠加
    - 当前证据：无法区分 A/B 贡献比例；**不建议据此次数据单独放宽垂直速度相关设计裕度**
    
    ### 信号 2：热防护测点 TP-07 温度临近阈值未超
    
    - 本次 TP-07 峰值 1,083 °C（阈值 1,120 °C）
    - 可比性限制：**本次飞行的 TP-07 测点位置较二飞上移 18 cm**（二飞该位置测点超限 1,156 °C 后的测点布局调整）；上移后测点不处于同一受热特征点，数值不可直接对比
    - 需结合 CFD 复核后方可给出热防护状态结论
    
    ### 信号 3：发动机三次点火时延未收敛
    
    - 三次点火时延：一飞 0.38 s、二飞 0.45 s、三飞 0.42 s（指标 ≤0.30 s，三飞均超）
    - 趋势判断：三飞样本均在 0.38-0.45 s 区间，**未收敛到指标内**；时延对再入点火窗口的裕度消耗见 GNC 组影响分析（本次未含——**unknown，owner：GNC 组，补齐时限：评审后 2 周**）
    
    ## 四、三飞总体对比表
    
    | 参数 | 一飞 | 二飞 | 三飞 | 指标/包线 |
    | --- | --- | --- | --- | --- |
    | 回收结果 | 成功（支腿损伤） | 部分成功（落点超限） | 成功 | — |
    | 落点偏差 (m) | 64 | 212 | 87 | ≤150 |
    | 着陆垂直速度 (m/s) | 2.6 | 3.4 | 1.9 | ≤4.0 |
    | 三次点火时延 (s) | 0.38 | 0.45 | 0.42 | ≤0.30 |
    | TP-07 峰值 (°C) | —（未布点） | 1,156（超限） | 1,083（测点移位） | ≤1,120 |
    | 支腿载荷 (%包线) | 91 | 84 | 78 | ≤100 |
    
    ## 五、历史飞行结论摘要（供引用）
    
    - 一飞结论：回收系统功能链贯通；支腿缓冲设计裕度不足（已改进缓冲器，二飞起生效）
    - 二飞结论：落点超限主因为再入点火延迟叠加风修正不足（GNC 组根因报告 V1.2）；热防护 TP-07 超限触发测点布局调整与材料复验
    
    ## 六、下次飞行状态变更候选（飞行数据组提出，待评审裁决）
    
    1. 放宽项候选：着陆剩余推进剂最低要求（当前 5%，三飞实况 6.2%，建议评估下调至 4.5%）——依据：三飞剖面数据
    2. 维持项候选：垂直速度设计包线（证据不足以区分假设 A/B，建议维持）
    3. 加严项候选：三次点火时延监控阈值（趋势未收敛，建议飞行前专项评审加严放行准则）——依据：三飞趋势
    4. 待补数据项：TP-07 热防护状态（等 CFD 复核）、时延裕度影响分析（等 GNSC 组）——**在数据到位前不得列为变更依据**
    
    ## 七、口径与红线注释
    
    1. 全部参数以本包数值为准，判读结论不得超出数据支持范围；「明显改善」类定性词必须落到参数对比。
    2. 三飞对比中 TP-07 与支腿损伤项的可比性限制必须随表呈现。
    3. 假设 A/B 竞争关系未裁决前，任何单一归因表述视为越界。
    4. 单位严格按本包（m/s、kPa、°C、s、%）；时基 T0。

constraints:
  max_turns: 48
  timeout_seconds: 3600

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_content_execution_boundary.py
  timeout_seconds: 10

collect_artifacts:
  - "project/**"
