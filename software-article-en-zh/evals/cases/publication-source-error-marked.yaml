id: publication-source-error-marked
title: 发布型原文错误：标记并说明，不修正
description: 原文含事实性错误（默认端口号写错）时，发布润色不得静默改正，须保留原值并标记/说明。

input:
  prompt: |
    请把下面这段部署文档翻译成简体中文，并润色为官方技术运营文风以供发布：

    The ingest worker connects to Redis on port 8080 by default. If you override the port, restart the worker and re-run the health check.

constraints:
  max_turns: 1

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_publication_source_error_marked.py
  timeout_seconds: 10
