id: content-quality-u04
title: 跨行业内容质量 U04 金融审计（直出（含随附材料））
description: |
  方案 005 跨行业内容质量测评单元：金融审计。真实 agent 运行 execute 模式 generate
  路线至内容与风格合同完成、样张前截断；A1–A5 判据由评测侧 L0 机检与 L1 双判官在冻结
  产物上离线评审；内联 judge 仅检查停止点执行边界，harness 通过≠内容达标。

input:
  prompt: |
    使用 $leo-ppt-generator，进入 execute 模式 generate 路线，完成以下委托任务。这是一次评测委托：内容与风格合同层是本次唯一交付物。
    
    【委托与边界】
    1. 委托执行：合同、大纲、母版、风格与版式决策均由你在授权范围内自主推进并记录为委托决策（decision_source: user-delegated，附依据），无需中途向用户确认；可逆决策自行完成内部审查并留痕。
    2. 停止点：完成「内容合同 → 大纲 → 逐页母版 → 风格选定（style list/load/render，同一 home，记录 selection_fingerprint 与归因一句）→ 版式调度（逐页 P 码）→ 容量预检」后即停止。不要生成样张或任何图片，不要派发任何 worker，不要调用图片 Provider；本次无需核对图片 Provider/worker 可用性。
    3. 落盘范围：一切产物只写入当前工作目录下的 ./project/ 子树（项目根目录用 ./project/；风格注册表 home 一律隔离在该子树内，如 ./project/leo-home/），不得写该子树之外的任何位置。
    4. 材料边界：只依据下面的任务简报与随附材料；不联网检索；不读取本任务输入之外的任何文件。材料/简报未给出的关键事实不足时，按合同纪律披露并收窄断言（unknown），不要编造。
    5. blocked 纪律：如遇无法可靠推断且必须用户补答的关键事实，记录 blocked 项与原因，继续完成其余部分；不得模拟用户答案或伪造人工确认。
    6. 完成后回复一页摘要：产物路径清单（合同/大纲/母版/风格选择记录/版式调度记录）、确切页数、风格选择与归因一句、容量预检结论（含软超如实报告）、blocked 清单（若有）。
    
    【任务简报】
    # 任务简报 U04 · 金融审计 —— 普惠小微贷款监管申报前数据核对汇报
    
    - 行业：金融审计（梯度 G1-rules：有专属内容规则）
    - 任务型：汇报（申报前核对）
    - 主要受众：总行风险管理委员会（监管口径）
    - 材料形态：直出（跨源数字冲突，随附）
    - 难度型：冲突
    - 页数：**10 页**（含封面与收束页，从总数内分配）
    
    ## 委托方与背景
    
    你是某城商行计划财务部数据管理岗的分析师。本季度普惠型小微企业贷款的监管报表（1104 报表相关科目）申报在即，但行内三套来源对同一组核心指标给出了不一致的数：业务系统（信贷系统台账）、监管报送系统（预填数）、以及上个月内部审计部为迎接监管检查做的抽样核对结果。风险管理委员会要求计划财务部在申报前把差异说清楚，你受委托准备 10 页核对汇报稿。
    
    ## 任务目标
    
    汇报要逐项回答：三个核心指标（普惠型小微企业贷款余额、户数、不良率）在三套来源中的差异分别有多大；差异的成因属于口径差异、时点差异还是数据质量问题；申报值建议采用哪套来源、依据是什么、剩余风险如何控制。行动目标是委员会当场审定申报口径。
    
    ## 受众与场合
    
    风险管理委员会由分管副行长、风险总监、审计部与计划财务部负责人组成，全部熟悉监管报表规则，对「口径」极其敏感——把不同口径的数混在一张表里会被立即指出。场合为委员会季度例会的一个专项议程，20 分钟。
    
    ## 决策背景
    
    三个信号让这次核对不能走过场：一是监管今年对该类科目加强了数据一致性核查，去年同业已因申报数与业务数差异被开罚单；二是内审抽样核对的差异方向与报送系统预填数不一致，说明可能存在真实的数据质量问题而不是单纯的口径差；三是业务部门主张按信贷系统报（余额更高、完成考核指标），审计部主张按抽样核对数报（更保守），两边都有动机。汇报必须站在申报合规立场给出裁决建议，不能各打五十大板了事，也不能盲从职级更高的一方的口径。
    
    ## 约束
    
    1. 三套来源的每个数字都必须按材料标注的来源、口径与时点呈现，任何一张表内不得混用不同来源的数。
    2. 差异裁决必须显式：给出建议申报值的同时说明取舍依据与未采信来源的处置（如列入数据质量整改），不得静默选边。
    3. 不良率涉及分类口径（材料注释有说明），须按监管分类规则表述，不得使用「坏账率」等口语化提法。
    4. 涉及同业罚单的监管环境描述须与材料一致，不得扩展为对监管立场的推断。
    5. 收束页须列出申报前的剩余动作（谁在什么时间前完成什么核验），责任到部门与时限。
    
    ## 材料指引
    
    随附材料为《普惠小微数据核对工作底稿（内部）》，含三套来源的指标对照、各来源口径与时点注释、内审抽样说明与差异初析。**材料中存在同一指标跨源数字冲突，这是本次汇报的核心事实**——你的任务不是消除差异，而是把差异的成因、影响与处置讲清楚。差异成因判断可基于材料注释与你的专业理解，无法确证的部分明确标注不确定性。
    
    【随附材料】（材料引用级来源，允许输入的全部；数字与口径以此为准）
    # 普惠小微数据核对工作底稿（内部）
    
    > 来源：信贷业务系统台账导出、监管报送系统（1104 相关科目预填）、内审部抽样核对底稿（2026-09）。统计时点与口径差异是本底稿的核心内容，见各表注释。密级：内部。
    
    ## 一、三源核心指标对照（普惠型小微企业贷款）
    
    | 指标 | 业务系统（信贷台账） | 报送系统（预填数） | 内审抽样核对 |
    | --- | --- | --- | --- |
    | 贷款余额 | 87.3 亿元 | 87.9 亿元 | 86.8 亿元 |
    | 贷款户数 | 6,214 户 | 6,247 户 | 6,102 户 |
    | 不良率 | 1.62% | 1.58% | 1.71% |
    
    ### 口径与时点注释（差异初析）
    
    1. **余额差（业务 vs 报送 0.6 亿）**：报送系统预填数含贴现票据项下小微口径（票据贴现余额 0.6 亿）；业务系统台账不含贴现。属口径差异，两数都「对」，但含义不同。
    2. **余额差（业务 vs 内审 0.5 亿）**：内审核对时点为 2026-08-31（抽样基期），业务系统为 2026-09-30；期间新增投放 1.9 亿、回收 1.4 亿。时点差异叠加抽样覆盖差，**不能直接相减归因**。
    3. **户数差**：报送系统按本外币合并统计（含外币户 33 户）；业务系统人民币口径。内审户数少 112 户为抽样未覆盖部分（抽样覆盖率 81.2% 的借据账户）。
    4. **不良率差**：三源分类口径不同——业务系统按行内五级分类（次级及以下）；报送预填按监管要求的重组与逾期天数修正规则调整过 2 户；内审按审计抽样重检，认定 3 户分类不准确（其中 2 户应下调为关注、1 户应上调为可疑，净效应推高不良 0.09 个百分点）。
    5. 内审抽样方法：借据账户分层抽样（余额前 60 全查 + 其余随机 25%），覆盖余额占比 81.2%，时点 2026-08-31。
    
    ## 二、内审发现的数据质量问题（内审部底稿摘要）
    
    - 3 户分类不准确（见上）；其中 1 户已进入整改流程
    - 17 笔借据的行业代码与工商登记不符（影响普惠口径认定但不改变余额）
    - 报送系统与业务系统的自动映射规则中，贴现科目的映射存在重复计数风险（技术部门待确认，**当前无法确证**）
    
    ## 三、监管环境背景（合规部提示，2026-10）
    
    - 去年以来银保监系统对中小银行开展数据真实性专项核查，已有 3 家同业因申报数与业务系统数差异超过阈值且无合理解释被处罚（案例为公开信息）
    - 本行《监管数据报送管理办法》要求：申报口径与业务口径差异须留存「差异说明单」随申报归档
    - 监管对普惠小微「两增」考核以报送系统口径为准
    
    ## 四、各方立场（计划财务部协调会记录摘要）
    
    - 业务条线（公司金融部）：倾向按信贷系统 87.3 亿申报（余额更高的口径利于「两增」考核完成）；认为贴现纳入依据不充分
    - 审计部：倾向按内审核对口径，至少须先完成 3 户分类整改再报；指出抽样覆盖率 81.2% 本身是局限，不能把抽样数直接当全量真值
    - 计划财务部（本岗）：申报值建议与差异说明单同步准备
    
    ## 五、关键时间线
    
    - 申报截止：2026-11-15（季度申报）
    - 3 户分类整改完成时限：2026-11-10（审计部已立案）
    - 贴现科目映射技术确认：无明确时限（科技部排队中——**unknown，须在汇报中列明**）
    
    ## 六、口径与红线注释
    
    1. 任何一张表不得混用三源数字；每处引用须带来源与时点。
    2. 不良率表述须用「不良贷款率」规范口径，区分五级分类与监管调整规则。
    3. 内审抽样覆盖率与局限必须随行呈现，不得把抽样结果表述为全量真值。
    4. 同业处罚案例只能作为背景事实，不得外推为对本行的监管判断。

constraints:
  max_turns: 48
  timeout_seconds: 3600

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_content_execution_boundary.py
  timeout_seconds: 10

collect_artifacts:
  - "project/**"
