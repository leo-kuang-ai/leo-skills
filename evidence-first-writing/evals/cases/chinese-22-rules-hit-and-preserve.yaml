id: chinese-22-rules-hit-and-preserve
title: 中文 22 条命中实际问题且不误伤准确表达
description: |
  验证对公众号稿执行中文协议时：虚构读者误解、重复让步、翻译腔、结尾金句等
  真实问题被命中并处理；改写不新增事实。与 chinese-protocol-context-judgment
  互为反例（本稿的「闭环」是空泛命中，该稿是准确术语保留）。对齐 eval-plan
  Case 12 的确定性子集。

input:
  prompt: |
    请按 humanize 处理下面这段公众号稿：先输出中文七类检测报告，再改写。不得增加或改变任何事实。

    你可能以为我们的迭代慢是因为团队懒。其实不是，是我们的流程更深邃。
    首先，我们建立了认知升级的机制。其次，我们沉淀了价值的闭环。最后，我们拥抱了长期的主义。
    对于本次迭代，我们进行了深入的复盘，基于此进行了相应的改进。
    当然，速度不是一切。当然，质量才是根本。当然，我们始终在路上。
    关键词：复盘 我们认真地复盘了每一个细节
    真正的成长，是把简单留给别人，把复杂留给自己。
    每一份坚持，都会在未来的某一天，变成照亮你的光。

constraints:
  timeout_seconds: 300
  max_turns: 2

judge:
  type: rule_based
  success:
    - output_contains:
        any: ["代入", "读者误解", "虚构", "并不存在", "替读者", "你以为", "预设反驳", "预设读者", "扣帽子", "可能以为", "强加"]
    - output_contains:
        any: ["让步", "重复", "当然"]
    - output_contains:
        any: ["翻译腔", "进行了", "空转", "对于本次"]
    - output_contains:
        any: ["金句", "收尾", "收束", "结尾"]
    - output_contains:
        any: ["闭环"]
    - output_contains:
        any: ["抽象", "空泛", "无具体", "套话", "删除", "具体化"]
        not: ["亲眼见证", "业内人士透露"]
