id: complete-humanizer-catalog
title: 完整模式审查加载逐项目录
description: 验证显式完整审查不只报告模式类别摘要。

input:
  prompt: |
    对下面英文内容执行完整 55 模式审查，只报告，不改写。必须读取 humanizer-pattern-catalog.md，并在三条对应 finding 中保留 canonical IDs：P34 模型引用标记泄漏、P52 Unicode 混淆、P54 不存在反方残留。

    In summary, experts say this represents a pivotal shift. citeturn0search0 While some might argue that nothing changes, the data​ tells us otherwise.

expect:
  must_contain:
    - "P34"
    - "P52"
    - "P54"
  must_not_contain:
    - "改写后："

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["P34", "P52", "P54"]
        not: ["改写后："]
