id: content-quality-u01
title: 跨行业内容质量 U01 互联网科技（直出（含随附材料））
description: |
  方案 005 跨行业内容质量测评单元：互联网科技。真实 agent 运行 execute 模式 generate
  路线至内容与风格合同完成、样张前截断；A1–A5 判据由评测侧 L0 机检与 L1 双判官在冻结
  产物上离线评审；内联 judge 仅检查停止点执行边界，harness 通过≠内容达标。

input:
  prompt: |
    使用 $leo-ppt-generator，进入 execute 模式 generate 路线，完成以下委托任务。这是一次评测委托：内容与风格合同层是本次唯一交付物。
    
    【委托与边界】
    1. 委托执行：合同、大纲、母版、风格与版式决策均由你在授权范围内自主推进并记录为委托决策（decision_source: user-delegated，附依据），无需中途向用户确认；可逆决策自行完成内部审查并留痕。
    2. 停止点：完成「内容合同 → 大纲 → 逐页母版 → 风格选定（style list/load/render，同一 home，记录 selection_fingerprint 与归因一句）→ 版式调度（逐页 P 码）→ 容量预检」后即停止。不要生成样张或任何图片，不要派发任何 worker，不要调用图片 Provider；本次无需核对图片 Provider/worker 可用性。
    3. 落盘范围：一切产物只写入当前工作目录下的 ./project/ 子树（项目根目录用 ./project/；风格注册表 home 一律隔离在该子树内，如 ./project/leo-home/），不得写该子树之外的任何位置。
    4. 材料边界：只依据下面的任务简报与随附材料；不联网检索；不读取本任务输入之外的任何文件。材料/简报未给出的关键事实不足时，按合同纪律披露并收窄断言（unknown），不要编造。
    5. blocked 纪律：如遇无法可靠推断且必须用户补答的关键事实，记录 blocked 项与原因，继续完成其余部分；不得模拟用户答案或伪造人工确认。
    6. 完成后回复一页摘要：产物路径清单（合同/大纲/母版/风格选择记录/版式调度记录）、确切页数、风格选择与归因一句、容量预检结论（含软超如实报告）、blocked 清单（若有）。
    
    【任务简报】
    # 任务简报 U01 · 互联网科技 —— 供应链协同 SaaS 的 C 轮融资路演
    
    - 行业：互联网科技（梯度 G1-styles：有行业风格资产，无专属内容规则）
    - 任务型：路演（融资）
    - 主要受众：成长期机构投资人（领投候选机构的投资委员会与会合伙人）
    - 材料形态：直出（SaaS 经营材料，随附）
    - 难度型：事实堆积
    - 页数：**12 页**（含封面与收束页，从总数内分配）
    
    ## 委托方与背景
    
    你是「云衡科技」的联合创始人兼 COO。云衡科技做制造业供应链协同 SaaS，产品覆盖订单协同、供应商对账与异常预警三个模块，服务对象为年营收 5 亿以上的中型制造企业。公司三年前 A 轮、两年前 B 轮，本轮拟启动 C 轮融资，委托你准备领投候选机构内部路演用的 12 页演示文稿。老股东已口头承诺跟投本轮融资的 30%，但明确要求路演材料先过他们一关——他们最关心的是增长质量而不是增长速度。
    
    ## 任务目标
    
    路演要回答投资委员会的三个问题：这门生意的净收入留存是否撑得起估值上移；2.4 亿融资用途与里程碑是否可核；现有获客体系是否可复制。行动目标：会后一周内拿到投资委员会进会通知（term sheet 谈判启动）。
    
    ## 受众与场合
    
    机构合伙人层级，每周看大量项目，注意力短；场合为 30 分钟路演（20 分钟讲、10 分钟问）。演示文稿要能脱离讲解独立阅读（会后会被单独转发给未到会的委员），但现场讲述节奏按 20 分钟设计。
    
    ## 决策背景
    
    上一轮尽调时投资人曾质疑两个点：一是大客户集中度，二是销售周期拉长。本轮材料必须正面处理这两个质疑，不能回避。公司内部对「增长归因」有两种声音：销售负责人认为增长主要来自新客开仓，客户成功负责人认为 NRR 扩容贡献更大——材料需要用数据说清楚两者各自的贡献，不做倾向性掩盖。
    
    ## 约束
    
    1. 所有经营数字必须来自随附材料并按其口径引用；材料未覆盖的数字不得杜撰，允许以「估算/示意」明确标注后使用。
    2. 客户一律使用材料中的脱敏代号，不得编造可识别的客户名。
    3. 融资金额 2.4 亿的用途拆分必须给出测算或显式 unknown，不接受裸数字。
    4. 竞争格局一页不得点名贬低具体友商。
    5. 受众是投资人：收束页的行动项要具体到可核验收（如「进会后 10 个工作日内开放数据室」），不接受「持续加强沟通」类表述。
    
    ## 材料指引
    
    随附材料为《云衡科技经营数据包（C 轮路演内部版）》，含财务口径、CRM 导出、产品后台三类来源，数字较多且粒度不一——**并非全部都要上页**，路演叙事只需选取支撑三个核心问题的数字，但上页的每个数字都要能回溯到材料行。材料中两处口径差异（ ARR 环比 vs 同比、销售周期两种统计口径）须按材料内注释正确使用，不得混用。
    
    【随附材料】（材料引用级来源，允许输入的全部；数字与口径以此为准）
    # 云衡科技经营数据包（C 轮路演内部版）
    
    > 来源：财务部月报（2026-08）、CRM 系统导出（截至 2026-08-31）、产品后台（2026-08 周均值）。口径与注释随各表标注。密级：内部。
    
    ## 一、财务口径（财务部月报，2026-08）
    
    - 年度经常性收入 ARR：1.86 亿元（2025-08 为 1.15 亿元，同比 +62%；环比 +4.1%）
    - 净收入留存 NRR：114%（口径：期初客户群本期 ARR / 其上期 ARR）
    - 订阅毛利率：78%（口径：订阅收入 - 直接云成本与客户成功人力，未含研发分摊）
    - 大客户集中度：ARR Top10 客户占比 38%（2025-08 为 45%，下降 7 个百分点）
    - 经营现金流转正月份：2026-03 起连续 6 个月
    - 现金及等价物：1.42 亿元；按当前净消耗月均约 1,290 万元测算，现金跑道约 11 个月
    - 本轮拟融：2.4 亿元（拟用途框架：产品与 AI 能力 40%、市场与销售体系 35%、客户成功与交付 15%、储备 10%——此为管理层初步框架，细分测算待本轮尽调准备）
    
    ## 二、增长归因拆解（财务部口径，2025-09 至 2026-08）
    
    - 期间 ARR 增量：+0.71 亿元，其中：新签客户贡献 +0.44 亿元、存量客户扩容贡献 +0.27 亿元（注：另有流失 -0.08 亿元已扣除；NRR 114% 对应存量净效应）
    - 增长贡献结论请勿混用：新客 vs 扩容两个口径不可相加与 NRR 直接对表
    
    ## 三、CRM 导出（截至 2026-08-31）
    
    - 付费客户数：412 家（2025-08 为 297 家，净增 115 家）
    - 客户 logo 留存率：96%（口径：期末仍付费的期初客户数 / 期初客户数）
    - 平均获客成本 CAC：8.7 万元（口径：市场+销售费用 / 新签客户数，含销售人力分摊）
    - LTV/CAC：4.2（LTV 口径：客户平均生命周期 5.2 年 × 期间平均客单毛利）
    - 销售周期——**两种统计口径**：
      - 中位数：47 天（成交样本 115 单）
      - 含超大客户（客单 >150 万）的均值：63 天（超大客户拉长；B 轮尽调引用的是 63 天口径，C 轮材料若对比须注明口径）
    - 本年新签按行业分布：汽车零部件 31%、食品加工 24%、电子 18%、其他 27%
    
    ## 四、产品后台（2026-08 周均值）
    
    - 模块周活使用率（活跃客户中使用该模块比例）：订单协同 82%、供应商对账 61%、异常预警 37%
    - 异常预警模块的付费增购率：使用满 90 天的客户中 29% 增购（n=136）
    - NPS：51（2026-05 调研，n=289，回收率 71%）
    
    ## 五、团队与其他
    
    - 员工总数：268 人（研发 41%、销售与市场 27%、客户成功与交付 22%、职能 10%）
    - 客户脱敏代号示例（路演可用）：JQ-汽配（年营收 28 亿）、FH-食品（年营收 15 亿）、DL-电子（年营收 9 亿）
    - 两项产品里程碑：对账模块 AI 差异归因功能 2026-06 上线（灰度）；预警模块行业模板库 2026-Q4 计划
    
    ## 六、口径与红线注释
    
    1. ARR 环比（+4.1%）与同比（+62%）并存，引用时必须注明期间。
    2. 销售周期两口径并存，对外口径默认中位数 47 天，与 B 轮对比时用 63 天口径并注明。
    3. 客户名一律使用脱敏代号，不得还原或另造客户名。
    4. NPS 调研样本 n=289、回收率 71%，引用须带样本量。

constraints:
  max_turns: 48
  timeout_seconds: 3600

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_content_execution_boundary.py
  timeout_seconds: 10

collect_artifacts:
  - "project/**"
