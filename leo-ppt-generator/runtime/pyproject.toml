[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-ppt-generator-runtime"
version = "0.1.1"
description = "Deterministic runtime for the leo-ppt-generator skill."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "filelock>=3.16.0",
  "jsonschema>=4.0",
  "markdown-it-py>=3.0",
  "numpy>=1.26.0",
  "openai>=2.0.0",
  "Pillow>=10.0.0",
  "PyMuPDF>=1.24.0",
  "python-pptx>=1.0.2",
  "PyYAML>=6.0.0",
  "requests>=2.31.0",
  # SVG→PNG 首选栅格化器（render-contract §5；缺失时 tests/render/test_raster.py
  # 在裸环境失败——D-ENV-2 基线证据）。
  "resvg-py>=0.5.0",
]

[project.scripts]
leo-ppt = "leo_ppt_generator.cli:main"

[project.optional-dependencies]
test = [
  "Hypothesis==6.165.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
leo_ppt_generator = ["schemas/*.json", "config/assets/*", "raster_text.swift"]
"leo_ppt_generator.config" = ["*.yaml"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "*.pyo"]
