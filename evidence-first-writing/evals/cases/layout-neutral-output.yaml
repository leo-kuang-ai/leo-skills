id: layout-neutral-output
title: 发布级正文须是渲染器中立 markdown——标准链接与结构在场，无裸 HTML 与私有容器泄漏
description: |
  验证带具体素材（数据/引用/案例/链接）的发布级 draft 请求：产出正文用标准
  markdown 语法表达结构与强调——标准链接 `[文字](url)`（或 markdown 链接引导语）
  在场，且表格管道/列表/引用块任一结构元素在场；同时无裸 HTML 容器标签
  （<div>/<span>/<section>/<table>）、无私有容器标记泄漏进未声明管线
  （::: admonition、<note>/<callout> 类、obsidian callout 标记）、无半角标点
  紧邻中文的成串误用（not 词形一律以 CJK 字起头，防误伤英文缩写——与
  check_layout 半角混用规则呼应的轻量形态）。对齐排版合同第 3 节渲染器中立
  兼容条款（来源：md-wechat 主题 CSS 合同与 renderer 行为断言的渲染器中立子集，
  MIT，快照 2026-08-31；规约出处 references/layout-contract.md）。
  baseline: 2026-09-01 扩词后 2 轮 PASS（claude_code 引擎 GLM 5.3，53.8s 与 78.4s，
  5/5 断言通过；首掷 69.9s 链接为「引导语+裸 URL」形态（品牌故事：/报告在这里：
  https://…），断言 1 词面未中 4/5 FAIL——实质在场（链接自然带出+引导语），按
  同义词惯例扩词（+详见/在这里：/报告在这里/品牌故事：等引导语形态）复跑两掷：
  一掷仍为引导语+裸 URL、一掷为标准 [文字](url) 语法，均 PASS；三掷断言 2-5 全过
  （表格/引用块/列表结构在场，裸 HTML/私有容器/半角标点零命中）。链接形态记档为
  词面高变例，后续再掷只记档不追词；「裸 URL 与标准语法交替」是合同 §3 第 1 条
  「链接一律标准语法」的观察线索，非门禁）。

input:
  prompt: |
    请把下面的素材写成一篇可发布的公众号正文，约 700 字，标题自拟。读者是关注消费行业的普通读者，语气克制直白，不堆感叹号。

    素材（编辑部已核过，写作时只用这些，不要外推新数据）：
    【数据】2026 年上半年全国现制咖啡门店 21.3 万家，同比净增 1.8 万家；人均年饮用量 26 杯；9.9 元及以下价格带订单占比 47%。
    【引用】分析师林岸的原话：「这一轮扩张不是开店竞赛，是把咖啡变成自来水——日常、低价、随手可得。」
    【案例】县域品牌「山雾咖啡」一年内从 3 家店开到 41 家，全部开在菜市场与公交站周边，不进商场。
    【链接】正文里请自然带出这两个来源：
    - 行业季度报告：https://example.com/coffee-report-2026h1
    - 山雾咖啡品牌故事：https://example.com/shanwu-story

    成稿要求：正文自然包含上面两个链接、一张对比表格（价格带或渠道对比任选）、一个要点列表、至少一处引用块。直接给成稿，不用先反问我，也不用解释你的排版选择。

constraints:
  timeout_seconds: 420
  max_turns: 2

judge:
  type: rule_based
  success:
    # 断言 1：标准链接语法在场（[文字](url) 或 markdown 链接引导语）
    - output_contains:
        any: ["](", "](http", "原文链接", "参考链接", "来源链接", "延伸阅读", "参考资料", "参考文献", "来源：", "详见", "全文见", "可参考", "可查看", "点击", "查看原文", "在这里：", "报告在这里", "品牌故事："]
    # 断言 2：结构元素在场（表格管道 / 列表 / 引用块任一）
    - output_contains:
        any: ["|", "- ", "> ", "1. ", "* "]
    # 断言 3：素材锚 + 否定感知——无裸 HTML 容器标签
    - output_contains:
        any: ["咖啡", "门店", "现制"]
        not: ["<div", "<span", "<section", "<table"]
    # 断言 4：素材锚 + 否定感知——无私有容器标记泄漏（::: admonition / <note> 类 / obsidian callout）
    - output_contains:
        any: ["咖啡", "门店", "现制"]
        not: [":::", "<note>", "<callout", "<card", "> [!"]
    # 断言 5：素材锚 + 否定感知——无半角标点紧邻中文成串误用（词形以 CJK 字起头，防误伤英文缩写）
    - output_contains:
        any: ["咖啡", "门店", "现制"]
        not: ["的,", "了,", "是,", "在,", "和,", "与,", "的.", "了.", "在.", "也.", "很,", "吗?", "呢?"]
