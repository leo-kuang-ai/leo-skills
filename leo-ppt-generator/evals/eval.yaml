    - evals/cases/alpha-m0-takeaway-first-bullet.yaml
    - evals/cases/alpha-m0-figure-evidence-row.yaml
    - evals/cases/alpha-m0-contract-academic-fields.yaml
    - evals/cases/beta-m7-sample-upgrade-structure-page-needs-nod.yaml
    - evals/cases/beta-m7-style-inversion-three-groups.yaml
    - evals/cases/beta-m6-academic-five-modes.yaml
    - evals/cases/gamma-m1-delivery-receipt-gate.yaml
    - evals/cases/gamma-m1-receipt-tamper-detects-stale.yaml
    - evals/cases/gamma-m1-impact-inference-page-vs-deck.yaml
    - evals/cases/gamma-m6-prompt-registry-required.yaml
  defaults:
    timeout_seconds: 300
    max_turns: 4
    expect:
      exit_code: 0
  parallelism: 1

benchmark:
