id: content-quality-u06
title: 跨行业内容质量 U06 咨询法律（直出（含随附材料））
description: |
  方案 005 跨行业内容质量测评单元：咨询法律。真实 agent 运行 execute 模式 generate
  路线至内容与风格合同完成、样张前截断；A1–A5 判据由评测侧 L0 机检与 L1 双判官在冻结
  产物上离线评审；内联 judge 仅检查停止点执行边界，harness 通过≠内容达标。

input:
  prompt: |
    使用 $leo-ppt-generator，进入 execute 模式 generate 路线，完成以下委托任务。这是一次评测委托：内容与风格合同层是本次唯一交付物。
    
    【委托与边界】
    1. 委托执行：合同、大纲、母版、风格与版式决策均由你在授权范围内自主推进并记录为委托决策（decision_source: user-delegated，附依据），无需中途向用户确认；可逆决策自行完成内部审查并留痕。
    2. 停止点：完成「内容合同 → 大纲 → 逐页母版 → 风格选定（style list/load/render，同一 home，记录 selection_fingerprint 与归因一句）→ 版式调度（逐页 P 码）→ 容量预检」后即停止。不要生成样张或任何图片，不要派发任何 worker，不要调用图片 Provider；本次无需核对图片 Provider/worker 可用性。
    3. 落盘范围：一切产物只写入当前工作目录下的 ./project/ 子树（项目根目录用 ./project/；风格注册表 home 一律隔离在该子树内，如 ./project/leo-home/），不得写该子树之外的任何位置。
    4. 材料边界：只依据下面的任务简报与随附材料；不联网检索；不读取本任务输入之外的任何文件。材料/简报未给出的关键事实不足时，按合同纪律披露并收窄断言（unknown），不要编造。
    5. blocked 纪律：如遇无法可靠推断且必须用户补答的关键事实，记录 blocked 项与原因，继续完成其余部分；不得模拟用户答案或伪造人工确认。
    6. 完成后回复一页摘要：产物路径清单（合同/大纲/母版/风格选择记录/版式调度记录）、确切页数、风格选择与归因一句、容量预检结论（含软超如实报告）、blocked 清单（若有）。
    
    【任务简报】
    # 任务简报 U06 · 咨询法律 —— 数字化供应链诊断项目提案路演
    
    - 行业：咨询法律（梯度 G1-rules：有专属内容规则）
    - 任务型：路演（项目提案）
    - 主要受众：客户决策层（区域制造集团总裁办与供应链总监）
    - 材料形态：直出（尽调材料摘要，随附）
    - 难度型：事实堆积
    - 页数：**12 页**（含封面与收束页，从总数内分配）
    
    ## 委托方与背景
    
    你是某管理咨询公司的项目经理。一家年营收约 40 亿的区域制造集团（脱敏代号「H 集团」）为其供应链数字化立项，向三家咨询公司发出邀请，你们入围最后一轮。客户已开放了两周的前期尽调：你们团队访谈了客户方 9 位中层（访谈纪要要点见材料），并拿到一份系统清单与部分运营数据的脱敏摘要。你受委托准备 12 页提案路演稿，下周向客户总裁办与供应链总监汇报。
    
    ## 任务目标
    
    提案要证明三件事：你们对 H 集团供应链问题的诊断比另外两家更贴近实际；项目的阶段划分与交付物设计可核、可验收；报价结构（三期分别计价）与价值假设之间的逻辑成立。行动目标：一周内拿到独家谈判通知。
    
    ## 受众与场合
    
    总裁办关注投入产出与风险，供应链总监关注方案会不会动他的流程权威（对「推倒重来」类方案有戒心，上一家咨询公司因此出局）；场合为 45 分钟提案会（30 讲 15 问）。演示文稿须能在客户内部流转（会被转发给未到会的高管），因此每页的论断都要有尽调依据支撑，经得起客户方核对。
    
    ## 决策背景
    
    尽调材料多且杂：访谈中各部门对「库存高」的归因互相矛盾（销售怪预测、生产怪采购、采购怪供应商），系统清单显示三套并行 ERP/进销存（两套已停维保），库存与周转数据只有三个月且口径不一。这些事实堆积既是诊断素材也是陷阱——把材料原样搬运成「问题清单」是上一家出局的原因之一；客户要的是从杂乱事实中拎出因果链与优先级。
    
    ## 约束
    
    1. 诊断论断必须锚定尽调材料（注明访谈对象角色或数据来源），材料未覆盖的判断须标注为假设并给出验证方式，不得冒充尽调发现。
    2. 访谈中的矛盾归因不得回避：方案要显式处理「预测—采购—供应商」责任链，不得只采信单方说法。
    3. 涉及客户数据（库存、周转、停工损失等）一律按材料口径与期间引用；材料中三套系统并行导致的口径差异须说明，不得混算成单一事实。
    4. 报价金额本期不出现（客户要求路演阶段不谈价），价值假设可用「估算」级量化并标注假设。
    5. 交付物定义与验收标准逐项可核（审计式验收），不接受「持续赋能」「深度陪伴」类无交付物表述。
    
    ## 材料指引
    
    随附材料为《H 集团供应链数字化尽调摘要（脱敏）》，含访谈纪要要点（9 人次）、系统清单、库存与周转数据摘要（三个月，注明口径差异）。材料事实密度高、彼此不完全一致——这正是一期诊断要处理的现实：提案不需要复述全部材料，但引用的每条事实必须忠实于材料原文的口径与限定。
    
    【随附材料】（材料引用级来源，允许输入的全部；数字与口径以此为准）
    # H 集团供应链数字化尽调摘要（脱敏）
    
    > 来源：咨询项目组前期尽调（2026-09 两周窗口），含 9 人次访谈纪要要点、IT 部门系统清单、三个月运营数据脱敏摘要。密级：项目组内部。
    
    ## 一、访谈纪要要点（9 人次，按角色脱敏）
    
    1. 销售副总：交付周期承诺「理论上 15 天，实际经常 25 天以上」； blames 预测——「销售预测给生产的数基本靠拍，月底改三次」。
    2. 生产计划部长： blames 采购——「关键原料到料不齐套，排产天天调整；缺料停线每月都有」。月度缺料停线 2-4 次。
    3. 采购部长： blames 供应商与计划——「计划变太多，紧急订单供应商要加价 8%-15%」；同时承认「三套系统对不上账，供应商对账每月要人工核对一周」。
    4. 仓储主任：成品库「爆仓与缺货并存」；呆滞品「估计有两成货架」（口头估计，无台账支撑）。
    5. 财务部长：对账差异率 2.1%（月度口径）；「库存资金占用是董事长例会常驻话题」。
    6. IT 部门：三套系统并行（见二）；「A 系统厂商已停止维保三年」。
    7. 门店/渠道运营（1 人次）：区域仓补货「平均 5 天，竞品 2 天」。
    8. 物流主管：自有车 11 辆 + 外协，「装车等待时间长，具体没统计」。
    9. 质保部长：客户投诉中交付延误类占比 31%（2026 年上半年客服工单口径）。
    
    **访谈矛盾登记**：库存高的归因，销售怪预测、生产怪采购、采购怪供应商与计划——三方均有单侧表述，未见量化归因分析（尽调限制：未获计划变更与到料齐套率的系统数据）。
    
    ## 二、系统清单（IT 部门提供）
    
    | 系统 | 范围 | 状态 |
    | --- | --- | --- |
    | ERP-A | 总账+供应链（总部） | 2016 年上线，厂商已停止维保 3 年 |
    | 进销存-B | 三个分厂 | 在用，与 A 无接口，月度 Excel 对账 |
    | ERP-C | 供应链模块试点（一厂） | 部分上线（采购+库存模块），推广停滞 14 个月 |
    
    ## 三、运营数据摘要（2026-06 至 2026-08，脱敏）
    
    - 原材料库存周转天数：42 天（口径：月末库存成本 / 当月出库成本×30，A 系统口径，未剔停产品物料）
    - 成品库存周转天数：67 天（同上口径；含为长协客户备货的在库成品）
    - 呆滞库存（超 180 天未动）：占库存金额 18%（口径：B 系统库龄报表，仅覆盖三个分厂，与 A 系统口径不可合并）
    - 缺货率（销售订单行缺货行占比）：7.3%（订单系统口径）
    - 月均缺料停线：3 次（生产计划部手工台账）
    - 对账差异率：2.1%（财务口径，供应商对账）
    - 客户投诉中交付延误类占比：31%（2026H1 客服工单）
    - 补货周期：区域仓平均 5 天（渠道运营口头口径，无系统数据）
    
    ## 四、口径与红线注释
    
    1. 三套系统数据口径互不兼容，任何汇总页须注明来源系统；A+B 合并库存数不存在，不得编造。
    2. 访谈归因矛盾须并列呈现，尽调未做量化归因是事实，不得替客户下结论。
    3. 呆滞库存 18% 仅覆盖分厂口径（B 系统），与总部口径不可比。
    4. 所有人物观点标注角色，不出现姓名。

constraints:
  max_turns: 48
  timeout_seconds: 3600

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_content_execution_boundary.py
  timeout_seconds: 10

collect_artifacts:
  - "project/**"
