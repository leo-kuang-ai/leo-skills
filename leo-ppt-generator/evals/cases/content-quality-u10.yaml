id: content-quality-u10
title: 跨行业内容质量 U10 文旅餐饮（直出（含随附材料））
description: |
  方案 005 跨行业内容质量测评单元：文旅餐饮。真实 agent 运行 execute 模式 generate
  路线至内容与风格合同完成、样张前截断；A1–A5 判据由评测侧 L0 机检与 L1 双判官在冻结
  产物上离线评审；内联 judge 仅检查停止点执行边界，harness 通过≠内容达标。

input:
  prompt: |
    使用 $leo-ppt-generator，进入 execute 模式 generate 路线，完成以下委托任务。这是一次评测委托：内容与风格合同层是本次唯一交付物。
    
    【委托与边界】
    1. 委托执行：合同、大纲、母版、风格与版式决策均由你在授权范围内自主推进并记录为委托决策（decision_source: user-delegated，附依据），无需中途向用户确认；可逆决策自行完成内部审查并留痕。
    2. 停止点：完成「内容合同 → 大纲 → 逐页母版 → 风格选定（style list/load/render，同一 home，记录 selection_fingerprint 与归因一句）→ 版式调度（逐页 P 码）→ 容量预检」后即停止。不要生成样张或任何图片，不要派发任何 worker，不要调用图片 Provider；本次无需核对图片 Provider/worker 可用性。
    3. 落盘范围：一切产物只写入当前工作目录下的 ./project/ 子树（项目根目录用 ./project/；风格注册表 home 一律隔离在该子树内，如 ./project/leo-home/），不得写该子树之外的任何位置。
    4. 材料边界：只依据下面的任务简报与随附材料；不联网检索；不读取本任务输入之外的任何文件。材料/简报未给出的关键事实不足时，按合同纪律披露并收窄断言（unknown），不要编造。
    5. blocked 纪律：如遇无法可靠推断且必须用户补答的关键事实，记录 blocked 项与原因，继续完成其余部分；不得模拟用户答案或伪造人工确认。
    6. 完成后回复一页摘要：产物路径清单（合同/大纲/母版/风格选择记录/版式调度记录）、确切页数、风格选择与归因一句、容量预检结论（含软超如实报告）、blocked 清单（若有）。
    
    【任务简报】
    # 任务简报 U10 · 文旅餐饮 —— 区域连锁咖啡品牌的 A 轮路演
    
    - 行业：文旅餐饮（梯度 G1-styles：有行业风格资产，无专属内容规则）
    - 任务型：路演（融资）
    - 主要受众：投资人（A 轮早期消费投资机构）
    - 材料形态：直出（门店数据 × 行业报告，存在口径冲突，随附）
    - 难度型：冲突
    - 页数：**11 页**（含封面与收束页，从总数内分配）
    
    ## 委托方与背景
    
    你是「山雀咖啡」的创始人。山雀是某新一线城市的本土连锁咖啡品牌，直营 14 家门店，走「社区店+精品平价」路线，运营 26 个月。公司启动 A 轮融资，你受委托准备 11 页路演稿。手头有两类材料：自家 POS 与会员系统的门店经营数据，以及两份第三方行业报告（一份头部咨询机构的咖啡市场年度报告、一份本地生活平台的品类趋势报告）。
    
    ## 任务目标
    
    路演要证明：山雀的单店模型在真实口径下健康（回本周期、成熟店爬坡、同店增长）；「社区精品平价」定位在所在城市仍有开店空间（空间测算逻辑可核）；本轮 6,000 万的用途（开店+供应链小仓）与里程碑成立。行动目标是拿到 2–3 家机构的条款单谈判邀请。
    
    ## 受众与场合
    
    早期消费投资人，近年对咖啡赛道既热情又受过伤（上一批精品连锁倒闭潮让他们对「行业高增速」话术免疫）；场合为 30 分钟路演。投资人手里往往也有那两份行业报告——对报告数字的引用口径如果不严谨，会被当场对照。
    
    ## 决策背景
    
    材料里埋着一个必须正面处理的冲突：行业报告口径下「现制咖啡品类年增速 18%+、市场处于高速扩容期」，而你自家门店的同店数据是另一番景象（材料中有具体数字，含部分门店同比下滑）。两者都是事实，但直接拼接会互相打架：品类增长主要发生在外卖与低价补贴渠道，而山雀的社区店模型吃的是到店复购。路演若回避这个冲突（只报行业增速或只报自家数据），都会在尽调时被拆穿；正确做法是把冲突摊开：两种口径各自说明什么、为什么山雀的模型不依赖行业口径的乐观情景、压力情景下模型是否仍成立。
    
    ## 约束
    
    1. 门店数据按材料口径（POS 口径、会员口径、含/不含新店爬坡）严谨引用，同店与全店数字不得混用。
    2. 行业报告数字引用须注明报告与口径，**不得与门店自有口径混算或直接对表**；两口径的冲突须显式呈现并给出解释框架，不得静默择一。
    3. 开店空间测算的每一步假设显式列出（可核或标注估算），不接受「市场足够大」类无算式结论。
    4. 融资用途金额给测算或显式 unknown；里程碑可核（门店数/单店指标阈值+时点）。
    5. 上一批连锁倒闭潮的行业教训须按材料提及的方式纳入风险页，不得回避。
    
    ## 材料指引
    
    随附材料为《山雀咖啡 A 轮数据包（内部）》，含门店经营表（分店口径注释）、会员复购数据、两份第三方行业报告的摘录页（注明各自口径与统计期）。**材料中门店数据与行业报告存在同指标口径冲突，这是本单元的核心评测事实**：路演对冲突的处理方式本身就是受评内容。
    
    【随附材料】（材料引用级来源，允许输入的全部；数字与口径以此为准）
    # 山雀咖啡 A 轮数据包（内部）
    
    > 来源：POS 系统分店报表（统计期 2025-09 至 2026-08）、会员系统、两份第三方行业报告公开摘录。密级：内部。
    
    ## 一、门店经营（POS 口径）
    
    - 直营门店：14 家（首家运营 26 个月；开业满 18 个月以上的成熟店 8 家）
    - 全店单店月均营收（14 店等权平均）：28.4 万元
    - **同店口径**（8 家成熟店，同比 2025-09 至 2026-02 vs 2026-03 至 2026-08 半年度同比）：营收 **-3.2%**；其中 5 家同比正增长（+2.1% 至 +9.8% 区间）、3 家同比下滑（-4.5% 至 -12.7% 区间，均为商圈店）
    - 单店月均杯量：全店 11,200 杯；客单价 25.3 元（POS 口径含轻食）
    - 外卖占比：全店营收的 31%（商圈店 47%、社区店 22%）
    - 单店初始投资：65 万元（不含转让费）
    - 首店回本周期：19 个月（POS 现金流口径）；第二、三家尚在爬坡（分别 10、4 个月），**未到可计算回本周期时点**
    
    ## 二、会员数据（会员系统）
    
    - 会员总数：8.9 万（90 天活跃会员 3.1 万）
    - 30 天复购率：34%（口径：当月消费会员次月再消费比例的 30 天滚动均值）
    - 90 天复购率：51%
    - 会员贡献营收占比：68%
    
    ## 三、第三方行业报告摘录（公开渠道，口径各自注明）
    
    ### 报告 A《中国现制咖啡市场年度报告 2026》（头部咨询机构，2026-04 发布）
    
    - 2025 年现制饮品市场规模 2,007 亿元，同比 **+18.3%**
    - 口径注释：**「现制饮品」含现制咖啡与现制茶饮连锁**；增速口径含外卖渠道与新兴低价连锁扩张贡献
    - 现制咖啡子类（连锁品牌口径）估算 612 亿元，同比 +15.1%
    - 报告判断：下沉市场与平价线是主要增量来源
    
    ### 报告 B《本地生活到店消费趋势 2026H1》（本地生活平台，2026-07 发布）
    
    - 所在城市到店咖啡**订单量**同比 +9.7%（口径：平台内咖啡品类到店订单，**为订单量非营收口径**；未覆盖平台外消费）
    - 人均年咖啡消费（该市）：11.3 杯
    - 报告判断：到店场景增长集中在「空间+性价比」双优门店
    
    ### 口径对照提示（内部整理）
    
    - 报告 A 的 18.3% 为「现制饮品（含茶饮）全渠道营收」增速；报告 B 的 9.7% 为「本市到店咖啡订单量」增速；山雀自家 -3.2% 为「成熟店同店营收」增速——**三者口径互不相同，任何两者直接对表都是口径错误**。
    - 山雀模型吃的是社区到店复购（外卖占比 22%），与报告 A 增量的主要来源（低价连锁+外卖）重叠有限。
    
    ## 四、行业风险背景（公开信息整理）
    
    - 上一轮精品连锁倒闭潮（2023-2024）：全国性品牌「X 咖」「Y 豆」等倒闭或大幅收缩，主因预付款扩张+单店模型未验证即复制（公开报道口径）
    - 本市咖啡馆数量：登记在营 1,140 家（市场监管公开数据，2026-06），两年净增约 300 家
    
    ## 五、本轮融资框架（管理层草案）
    
    - 拟融：6,000 万元；用途框架：新开门店（12-15 家社区店）70% + 供应链小仓（烘焙+配送）30%——**细分测算待尽调准备，框架值为管理层草案口径**
    - 里程碑草案：18 个月内新开店 12 家且成熟店同店增速回正、小仓投产服务 30 家门店（含加盟试点论证）
    
    ## 六、口径与红线注释
    
    1. 同店/全店、杯量/营收、订单量/营收三组口径不得混用。
    2. 两份报告数字引用必须带报告名与口径注释，与门店数据同页呈现时必须先做口径对照说明。
    3. 首店回本 19 个月为单店样本，不得表述为模型回本周期。
    4. 融资用途为草案口径，标注性质后使用。

constraints:
  max_turns: 48
  timeout_seconds: 3600

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_content_execution_boundary.py
  timeout_seconds: 10

collect_artifacts:
  - "project/**"
