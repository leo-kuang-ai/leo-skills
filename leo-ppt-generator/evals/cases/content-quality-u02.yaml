id: content-quality-u02
title: 跨行业内容质量 U02 政务公共（直出（含随附材料））
description: |
  方案 005 跨行业内容质量测评单元：政务公共。真实 agent 运行 execute 模式 generate
  路线至内容与风格合同完成、样张前截断；A1–A5 判据由评测侧 L0 机检与 L1 双判官在冻结
  产物上离线评审；内联 judge 仅检查停止点执行边界，harness 通过≠内容达标。

input:
  prompt: |
    使用 $leo-ppt-generator，进入 execute 模式 generate 路线，完成以下委托任务。这是一次评测委托：内容与风格合同层是本次唯一交付物。
    
    【委托与边界】
    1. 委托执行：合同、大纲、母版、风格与版式决策均由你在授权范围内自主推进并记录为委托决策（decision_source: user-delegated，附依据），无需中途向用户确认；可逆决策自行完成内部审查并留痕。
    2. 停止点：完成「内容合同 → 大纲 → 逐页母版 → 风格选定（style list/load/render，同一 home，记录 selection_fingerprint 与归因一句）→ 版式调度（逐页 P 码）→ 容量预检」后即停止。不要生成样张或任何图片，不要派发任何 worker，不要调用图片 Provider；本次无需核对图片 Provider/worker 可用性。
    3. 落盘范围：一切产物只写入当前工作目录下的 ./project/ 子树（项目根目录用 ./project/；风格注册表 home 一律隔离在该子树内，如 ./project/leo-home/），不得写该子树之外的任何位置。
    4. 材料边界：只依据下面的任务简报与随附材料；不联网检索；不读取本任务输入之外的任何文件。材料/简报未给出的关键事实不足时，按合同纪律披露并收窄断言（unknown），不要编造。
    5. blocked 纪律：如遇无法可靠推断且必须用户补答的关键事实，记录 blocked 项与原因，继续完成其余部分；不得模拟用户答案或伪造人工确认。
    6. 完成后回复一页摘要：产物路径清单（合同/大纲/母版/风格选择记录/版式调度记录）、确切页数、风格选择与归因一句、容量预检结论（含软超如实报告）、blocked 清单（若有）。
    
    【任务简报】
    # 任务简报 U02 · 政务公共 —— 营商环境优化行动年度评估汇报
    
    - 行业：政务公共（梯度 G1-rules：有专属内容规则）
    - 任务型：汇报（年度评估）
    - 主要受众：市优化营商环境工作专班（合规/公共部门，含牵头副市长办公室联络员）
    - 材料形态：直出（政策效果数据，随附）
    - 难度型：决策
    - 页数：**11 页**（含封面与收束页，从总数内分配）
    
    ## 委托方与背景
    
    你是市政务服务与数据管理局政策评估处的工作人员。全市「营商环境优化三年行动」进入第二年收尾，专班需要在 12 月中旬向市政府常务会提交年度评估报告，此前先在专班内部汇报会过一遍。处里委托你把评估数据和下年度资源建议做成 11 页汇报稿，供专班负责人参考使用。
    
    ## 任务目标
    
    汇报要完成两件事：一是客观呈现第二年行动的政策效果（哪些指标达成、哪些未达、原因何在）；二是就下年度三个候选投放方向给出资源排序建议——政务服务大厅扩容改造、跨部门数据共享深化、惠企政策兑现「免申即享」扩面。专班将在汇报基础上形成向常务会提出的预算建议。
    
    ## 受众与场合
    
    专班成员来自七个部门（发改、市场监管、税务、住建、法院、政务服务、工商联），各自关心与本部门相关的指标；场合为专班内部汇报会，30 分钟。语体须庄重、规范，符合政务汇报文体；对未达成指标不得回避，也不得使用市场化渲染话术。
    
    ## 决策背景
    
    三个候选方向都有人主张：大厅扩容是上一届遗留项目，数据共享是省里新考核项，「免申即享」是今年的亮点工作。但明年预算盘子确定收窄，最多全力度支持两个方向。评估数据里有一个对「免申即享」不利的信号：政策兑现金额虽大，企业满意度调查中与兑现体验相关的题项得分反而低于大厅服务题项。汇报需要如实呈现这个张力并给出处置建议，不能为了保亮点而藏数据。
    
    ## 约束
    
    1. 全部效果数据来自随附材料并注明口径与统计时点；材料中满意度调查须披露样本量与调查方式，不得只报分数。
    2. 惠企政策金额须区分「兑现口径」与「拨付口径」，按材料注释使用，不得混写。
    3. 对未达成指标须给出原因分析层次（政策设计/执行力度/外部环境），不使用笼统归因。
    4. 资源排序建议须给出可核依据（材料中的数据或明确标注的判断），三个方向都要有去留论证，不得只论证被推荐的方向。
    5. 收束页行动项须有责任层级与完成时限（政务口径的「验收」形态），符合政务文风。
    
    ## 材料指引
    
    随附材料为《营商环境优化行动第二年评估数据汇编（专班内部稿）》，含政务服务指标、满意度调查、投诉处理、数据共享、政策兑现五个板块，各板块口径与统计时点在注释中说明。材料中「跨部门共享事项数」存在省考口径与市自评口径两个数，须按用途选取并注明，不得混用。
    
    【随附材料】（材料引用级来源，允许输入的全部；数字与口径以此为准）
    # 营商环境优化行动第二年评估数据汇编（专班内部稿）
    
    > 来源：市政数局政务服务处统计（2026-11）、第三方满意度调查机构报告（2026-10）、12345 热线运行月报、市大数据局共享交换平台台账、市财政局惠企兑现台账。密级：内部。
    
    ## 一、政务服务指标（市政数局，统计期 2026-01 至 2026-10）
    
    - 行政许可事项承诺时限较法定时限压缩比例：68%（要素级统计，市本级 1,043 项）
    - 一网通办事项覆盖率：91.4%（口径：市本级依申请政务服务事项中可全程网办比例）
    - 即办件比例：42.7%（材料齐全当场办结）
    - 未达标项：工程建设项目审批全流程时限——承诺 60 个工作日，实际平均 74 个工作日（牵头部门：住建局；原因待析层次见第五节）
    
    ## 二、企业满意度调查（第三方机构，2026-10）
    
    - 综合满意度：93.2 分（样本 2,860 家企业，分层抽样：大中小微按注册量比例，CATI 电话访问 + 网络问卷补充，回收有效率 87%）
    - 分题项得分（5 分制折百分）：
      - 政务大厅服务体验：94.6
      - 网办系统易用性：91.8
      - **惠企政策兑现体验：88.3（五类题项中最低）**
      - 投诉处理满意度：92.1
      - 跨部门办事协同（一件事一次办）：90.5
    - 开放题高频意见前三位：政策兑现材料重复提交（占有效开放题 23%）、兑现到账周期长（19%）、窗口与网办口径不一致（11%）
    
    ## 三、投诉处理（12345 热线月报汇总）
    
    - 营商环境类诉求平均处理时长：4.3 天（上年 6.2 天，同比缩短 1.9 天）
    - 按期办结率：98.1%；重复投诉率：3.4%（口径：同一主体同一事项 30 日内再次来电）
    
    ## 四、跨部门数据共享（市大数据局台账，**两口径并存**）
    
    - 共享事项数——省对市考核口径：156 项（口径：已接入省共享交换平台并有调用记录的事项）
    - 共享事项数——市自评口径：203 项（口径：市级平台完成挂接的事项，含挂接后零调用 47 项）
    - 注：对省汇报用 156 项口径；市内评估两口径都要呈现，零调用事项是数据共享深化方向的核心论据
    
    ## 五、未达标指标原因线索（专班调度会纪要摘录）
    
    - 工改时限未达标的三层原因线索：① 政策设计层——并联审批改革未覆盖施工图审查环节；② 执行层——市政公用企业接入作业排队（供水供电供气）；③ 外部层——图审机构全市仅 2 家、产能饱和。三层权重未有量化分析。
    
    ## 六、惠企政策兑现（市财政局台账，统计期 2026-01 至 2026-10）
    
    - 「免申即享」扩面后兑现金额：23.7 亿元（**兑现口径**：已认定应兑付企业的金额，含已认定未拨付部分）
    - 实际拨付金额：19.4 亿元（**拨付口径**：国库集中支付已出账金额）
    - 两口径差额 4.3 亿元主要为在途认定与跨期拨付；引用时严禁混用
    - 覆盖政策条目：87 条（免申即享 41 条）
    - 兑现平均到账周期：自认定之日起 28 天（企业侧感知周期含认定等待约 51 天——满意度分题项低的直接线索）
    
    ## 七、第三方营商环境评价（国家发改委营商环境评价试点反馈，2026-09）
    
    - 综合排名：全国参评城市第 17 位（上年第 26 位，升 9 位）
    - 优势指标：开办企业（前 10）、获得电力（前 10）；短板指标：办理建筑许可（后 20%）、纳税（中游）
    
    ## 八、三个候选方向的既有支撑数据
    
    - 大厅扩容：现有 3 个分区日均办件 6,800 件，高峰时段（周一上午）平均等候 42 分钟；扩容改造测算另附（本次未含）
    - 数据共享深化：零调用事项 47 项的治理清单已由大数据局提出
    - 「免申即享」扩面：41 条已上线条目平均减少企业申报材料 3.2 份/次；满意度分题项 88.3 分为五类最低——扩面与体验修复需并列论证

constraints:
  max_turns: 48
  timeout_seconds: 3600

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_content_execution_boundary.py
  timeout_seconds: 10

