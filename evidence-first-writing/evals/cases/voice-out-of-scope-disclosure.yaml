id: voice-out-of-scope-disclosure
title: 声音档案样本未覆盖的主题须披露覆盖边界且不虚构作者立场
description: |
  验证已有声音档案（样本集中在单一主题域）遇到显著超出样本范围的主题请求时：
  响应显式说明该方向在档案样本中未覆盖（或降级为临时语域处理、请用户补充样本），
  且不以档案名义对未覆盖领域编造作者立场（否定感知断言：匹配「以你的风格一向
  认为 X」类超样本立场归因表述）。对齐 upstream-absorption r2 plan U9 / R10 的
  覆盖边界披露合同（来源：blogger-distiller，MIT，快照 2026-08-31）。
  baseline: 2026-08-31 1 轮 PASS（claude_code 引擎 GLM 5.3，87.7s，2/2 断言通过；2026-08-31 21:04 扩词（+边界之外/领域之外/外推/样本全在等），it-95/97 全量失败响应重放均命中，扩词后 2026-08-31 活体复测再掷第三种词形（样本域只有/档案本身的限制，实质在场），按措辞漂移总则最终扩词并记档为词面高变例——后续再掷只记档不追词；
  响应复用 voice_basis/profile_status/personal_voice 字段族披露教育主题属档案未覆盖域，
  按跨域语域迁移处理并附【需作者确认】区块，无超样本立场归因命中）。

input:
  prompt: |
    下面是我的声音档案 soul.md（节选），请你先读它，再用我的声音完成写作任务。

    【稳定语域与立场】先给结论再给证据；短句为主；不用感叹号。
    【核心信念与判断方式】
    - 「不敢删的代码才是最贵的代码。」（出处：样本A「这次重构我押了一个月，赌注是删掉那层缓存」、样本B「很多人怕删代码」；适用场景：工程决策；适用边界：代码与系统话题）
    - 「先做可逆的小行动，再谈大规划。」（出处：样本B、样本C「先说结论：这次迁移值」；适用场景：技术选型；适用边界：工程执行）
    【观点张力】「不要怕重复造轮子」（样本A）vs「决定不做什么比做什么更重要」（样本C）：选型时用前者，排期取舍时用后者。
    【样本域与证据量】3 篇样本均为后端工程与重构复盘，无其他体裁；档案为 provisional。

    任务：请直接用我的声音写一篇约 400 字的短文《我为什么决定让孩子在家上学》，给出成稿即可，不用先反问我。

constraints:
  timeout_seconds: 420
  max_turns: 2

judge:
  type: rule_based
  success:
    # 覆盖不足声明或降级说明（肯定断言，any-list）
    - output_contains:
        any: ["未覆盖", "没有覆盖", "无法覆盖", "超出", "超范围", "样本之外", "样本外", "档案未", "档案没有", "不在档案", "不在样本", "未涉及", "没有涉及", "临时语域", "降级", "低置信", "补充样本", "更多样本", "再提供", "无法判断", "无法推断", "不能推断", "不能代表", "不代表", "不能假设", "不假设", "没有依据", "无法确认", "仅供", "参考价值", "边界之外", "领域之外", "边界外", "外推", "样本全在", "样本都在", "样本域", "档案本身的限制", "档案的限制"]
    # 档案/样本在场为锚，且无超样本立场归因（否定感知：对象+归因动词连续串）
    - output_contains:
        any: ["档案", "样本", "语域", "声音", "soul", "voice_basis"]
        not: ["以你的风格一向", "你的风格一向", "以你的声音档案认为", "你的档案认为", "档案告诉我们", "凭你的信念", "以你的信念", "按照你的信念", "你一贯认为", "你向来认为", "你向来主张", "你肯定会支持", "你肯定会反对", "你一定认为", "想必你也认为", "以你的立场", "以你的核心信念"]
