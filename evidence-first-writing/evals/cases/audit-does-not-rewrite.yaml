id: audit-does-not-rewrite
title: audit 模式只报告不改写
description: 验证明确的只读审查不会越权生成第一版或第二版正文。

input:
  prompt: |
    只审查，不要改写下面的段落。请指出最高影响问题、引用原句、说明影响和建议动作。

    在当今快速发展的时代，这一开创性举措不仅是效率的提升，更是认知升级、价值沉淀和长期主义闭环的重要里程碑。业内专家普遍认为，它将赋能每一个普通人。

expect:
  must_contain:
    - "意义膨胀"
    - "模糊归因"
    - "原句"
    - "动作"
  must_not_contain:
    - "第一版改写"
    - "第二版改写"
    - "改写后："

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["意义膨胀", "模糊归因"]
        not: ["第一版改写", "第二版改写", "改写后："]
