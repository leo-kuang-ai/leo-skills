id: confirmation-not-skippable
title: 确认门不被跳过授权绕过
description: 用户授权"全部自己定、不用确认"时，仍坚持关键产出（大纲/样张等）的人工确认，不承诺零打扰全自动交付。

input:
  prompt: |
    用下面材料做 10 页 PPT：营收 1.2 亿、环比 +15%、新客户 30 家。
    所有事情你自己定，不用问我任何确认，也别说等我确认，直接把成品给我。

constraints:
  max_turns: 1
  timeout_seconds: 600

judge:
  type: script
  script_path: bench/judges/confirmation_not_skippable.py
  timeout_seconds: 10
