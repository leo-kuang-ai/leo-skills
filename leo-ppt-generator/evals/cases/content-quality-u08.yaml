id: content-quality-u08
title: 跨行业内容质量 U08 汽车交通（直出（含随附材料））
description: |
  方案 005 跨行业内容质量测评单元：汽车交通。真实 agent 运行 execute 模式 generate
  路线至内容与风格合同完成、样张前截断；A1–A5 判据由评测侧 L0 机检与 L1 双判官在冻结
  产物上离线评审；内联 judge 仅检查停止点执行边界，harness 通过≠内容达标。

input:
  prompt: |
    使用 $leo-ppt-generator，进入 execute 模式 generate 路线，完成以下委托任务。这是一次评测委托：内容与风格合同层是本次唯一交付物。
    
    【委托与边界】
    1. 委托执行：合同、大纲、母版、风格与版式决策均由你在授权范围内自主推进并记录为委托决策（decision_source: user-delegated，附依据），无需中途向用户确认；可逆决策自行完成内部审查并留痕。
    2. 停止点：完成「内容合同 → 大纲 → 逐页母版 → 风格选定（style list/load/render，同一 home，记录 selection_fingerprint 与归因一句）→ 版式调度（逐页 P 码）→ 容量预检」后即停止。不要生成样张或任何图片，不要派发任何 worker，不要调用图片 Provider；本次无需核对图片 Provider/worker 可用性。
    3. 落盘范围：一切产物只写入当前工作目录下的 ./project/ 子树（项目根目录用 ./project/；风格注册表 home 一律隔离在该子树内，如 ./project/leo-home/），不得写该子树之外的任何位置。
    4. 材料边界：只依据下面的任务简报与随附材料；不联网检索；不读取本任务输入之外的任何文件。材料/简报未给出的关键事实不足时，按合同纪律披露并收窄断言（unknown），不要编造。
    5. blocked 纪律：如遇无法可靠推断且必须用户补答的关键事实，记录 blocked 项与原因，继续完成其余部分；不得模拟用户答案或伪造人工确认。
    6. 完成后回复一页摘要：产物路径清单（合同/大纲/母版/风格选择记录/版式调度记录）、确切页数、风格选择与归因一句、容量预检结论（含软超如实报告）、blocked 清单（若有）。
    
    【任务简报】
    # 任务简报 U08 · 汽车交通 —— 出行平台区域公司的 B 轮路演
    
    - 行业：汽车交通（梯度 G1-styles：有行业风格资产，无专属内容规则）
    - 任务型：路演（融资）
    - 主要受众：投资人（B 轮领投候选机构）
    - 材料形态：直出（出行服务运营数据，随附）
    - 难度型：决策
    - 页数：**11 页**（含封面与收束页，从总数内分配）
    
    ## 委托方与背景
    
    你是「星翼出行」的 CFO。星翼是一家区域网约车与同城配送双业务平台，覆盖两省七市，A 轮后 26 个月。公司启动 B 轮融资，管理层在路演叙事上有一个关键取舍要向投资人交底：是继续深耕现有城市的出行主业，还是把新增资金的大头投向「网约车+同城配送」的运力协同网络。你受委托准备 11 页路演稿，这个战略分叉本身就是路演的核心页。
    
    ## 任务目标
    
    路演要让投资人形成判断：现有主业的单位经济模型是否健康（逐单经济而非补贴堆量）；运力协同的战略假设是什么、验证到什么程度、还需要多少钱和多久；本轮 1.8 亿的资金配置建议与对应里程碑。行动目标是进入领投机构的立项会。
    
    ## 受众与场合
    
    B 轮机构投资人与行业研究员，出行赛道看过多个项目，对「补贴换规模」高度警惕，会逐个核对单位经济的口径（毛收入/净收入、抽佣、补贴计法）；场合为 30 分钟路演。演示文稿要经得起研究员会后按材料口径复算——单位经济任何一处口径混用都会被视为诚信问题。
    
    ## 决策背景
    
    运营数据里有两个对战略分叉各自有利的信号：出行主业的成熟城市单车经济已转正（材料中有逐单口径），但增速放缓；配送业务单量增速快，可单均仍亏损、且依赖向出行司机交叉派单（协同假设未经单独验证）。管理层的真实分歧在于：配送亏损是「网络未成型」还是「模式本身不成立」，目前的数据不足以裁决。路演须把这个未裁决状态如实呈现，并说明本轮资金如何买到「能裁决的实验」。
    
    ## 约束
    
    1. 所有运营数字来自随附材料并保持其口径（GTV/净收入、单均口径、补贴口径不得混用）；材料给了两套补贴口径（含/不含平台券），须按用途选用并注明。
    2. 「协同效应」目前是假设不是已验证事实：两业务的交叉派单数据按材料口径呈现，不得把调度重叠写成已实现的成本节省。
    3. 资金配置金额须给出测算或显式 unknown；里程碑须可核（具体指标阈值+时点）。
    4. 竞争与合规风险（材料提到的区域监管动向）不得回避，按材料表述不得扩大推断。
    5. 收束页行动项可核可验收（如「立项会后两周内开放三城市逐单数据底表」）。
    
    ## 材料指引
    
    随附材料为《星翼出行 B 轮经营数据包（内部版）》，含出行与配送两条业务的分城市运营数据、单位经济拆解、补贴口径注释与运力交叉数据。数字密度高且两业务口径体系不同——上页数字必须与材料口径一致，跨业务比较页须先统一口径说明再比较。
    
    【随附材料】（材料引用级来源，允许输入的全部；数字与口径以此为准）
    # 星翼出行 B 轮经营数据包（内部版）
    
    > 来源：平台 BI 系统（统计期 2025-09 至 2026-08）、财务部口径表。两业务口径体系不同，注释随表。密级：内部。
    
    ## 一、规模指标（BI 系统）
    
    - 出行业务年完单量：1,840 万单（上年 1,643 万，+12%）
    - 配送业务年完单量：960 万单（上年 586 万，+64%）
    - 出行 GTV：21.6 亿元（口径：乘客支付总额，含过路费代收）
    - 配送 GTV：4.8 亿元（口径：货值运费合计，含商家补贴前）
    - 出行净收入：3.24 亿元（口径：GTV - 司机分成 - 乘客优惠；抽佣率 15.0%）
    - 配送净收入：0.58 亿元（口径：商家支付的技术服务费+配送费分成；综合费率 12.1%）
    - 覆盖城市：7 个（两省）；注册司机 2.7 万（月活 1.1 万）
    
    ## 二、单位经济（BI 系统，按成熟口径拆分）
    
    ### 出行业务（3 个成熟城市：进入满 18 个月）
    
    - 单均净收入：18.6 元
    - 单均变动成本：14.2 元（司机补贴 3.2 元〔**含平台券口径**〕、保险 1.1 元、支付通道 0.4 元、调度与客服分摊 9.5 元）
    - 单均贡献：+4.4 元
    - 补贴口径注释：单均司机补贴**不含平台券口径为 2.1 元**（平台券由市场费用列支，两种口径用途不同——对投资人报单位经济用含券口径 3.2 元，报获客效率用不含券口径，混用视为口径错误）
    - 新城市（4 个，进入 6-12 个月）：单均贡献 -2.8 元（爬坡期）
    
    ### 配送业务（全口径）
    
    - 单均净收入：6.0 元
    - 单均变动成本：7.8 元（骑手成本 5.9 元〔含交叉派单补贴 0.7 元〕、保险 0.6 元、其他 1.3 元）
    - 单均贡献：-1.8 元（亏损）
    - 交叉派单：配送运力 38% 来自出行司机闲时接单（口径：配送完单中由「出行+配送」双标签司机完成的占比）
    
    ## 三、协同假设的当前证据状态
    
    - 已验证：交叉派单在运力高峰时段将配送准时率提升 4.2 个百分点（BI 对照：启用交叉派单城市 vs 未启用城市，非随机实验——**证据强度有限**）
    - 未验证：交叉派单对出行主业接单时长的净影响（司机接配送单后的出行接单间隙变化，BI 无此口径）
    - 未验证：配送单均亏损随密度的收敛曲线（当前密度样本不足以拟合）
    
    ## 四、财务与其他
    
    - 公司现金：2.1 亿元；月净消耗 1,800 万元（口径：经营性，不含资本支出）
    - 本轮拟融：1.8 亿元；管理层资金配置两案（主业深耕 70% vs 协同网络 55%——**内部未定，路演需给推荐**）
    - 区域监管动向：一省已发布网约车运价调整征求意见稿（调价机制透明化要求）；配送业务所在市对众包骑手社保试点有个案推进（非强制）。**均为进行中的政策变量，不得写成确定成本**。
    
    ## 五、口径与红线注释
    
    1. GTV/净收入/抽佣三层不得混用；两业务口径体系不同，跨业务对比前须先统一口径说明。
    2. 补贴两口径的用途边界见二节注释。
    3. 协同效应的「已验证/未验证」清单随页呈现，不得把对照分析写成因果结论。
    4. 监管变量按「进行中政策变量」表述。

constraints:
  max_turns: 48
  timeout_seconds: 3600

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_content_execution_boundary.py
  timeout_seconds: 10

collect_artifacts:
  - "project/**"
