id: page-count-no-closing
title: 去尾页要求立即执行且收束职能并入末页
description: 验证用户要求「15 页内容、不要尾页」时，Skill 立即按成品 16 页（封面 1 + 内容 15）规划且不二次确认删除，并声明末页承担收束职能（回扣 one_thing）。

input:
  prompt: |
    使用 $leo-ppt-generator，已授权进入执行，继续上次任务。
    内容合同正在冻结，材料数据如下（均已定级为「引用」，无需再问）：
    - 主题：门店数字化改造季度汇报；受众：区域经理；演讲时长 10 分钟；
    - Q3 新签门店 37 家，其中制造业 21 家（引用，出处：Q3 经营台账）；
    - 试点门店人效提升 18%（引用，出处：试点复盘报告）；
    - 覆盖门店 120 家，续约率 91%（引用，出处：CRM 导出）。
    页数要求：15 页内容，封面要，不要尾页。直接定下来。

constraints:
  max_turns: 1

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_page_count_no_closing.py
  timeout_seconds: 10
