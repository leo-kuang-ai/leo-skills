id: control-plane-blocked-summary
title: 阻断状态必须使用统一控制面摘要
description: 验证多页 worker 不可用时，五字段块必须出现在回复前 3 个非空行之内且整行逐字（block-early，先于块只允许 ≤40 字符的元数据行），且只有一个恢复动作。

input:
  prompt: |
    使用 $leo-ppt-generator。
    12 页 PPT 的内容、风格、backend 和样张都已确认，但当前宿主没有可调用的 worker。
    请只汇报当前状态和唯一下一步，不要执行任何操作，也不要自行串行生成。

constraints:
  max_turns: 1

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_control_plane_fields.py
  timeout_seconds: 10

# 语义分层标记：model_gating = 该用例测被评模型的指令遵循纪律（当前代理模型
# 恒定 FAIL，属 known-issues 定性的模型能力区分器）；未标记的用例测技能合同
# 本身，其 FAIL 才构成技能回归信号。
tags:
  - model_gating
