    - evals/cases/recommend-with-default.yaml
    - evals/cases/user-picks-style.yaml
    - evals/cases/style-from-reference-image.yaml
    - evals/cases/mismatch-warning-once.yaml
    - evals/cases/dual-sample-proposal.yaml
