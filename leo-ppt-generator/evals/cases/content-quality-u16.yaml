id: content-quality-u16
title: 跨行业内容质量 U16 建筑工程（直出（含随附材料））
description: |
  方案 005 跨行业内容质量测评单元：建筑工程。真实 agent 运行 execute 模式 generate
  路线至内容与风格合同完成、样张前截断；A1–A5 判据由评测侧 L0 机检与 L1 双判官在冻结
  产物上离线评审；内联 judge 仅检查停止点执行边界，harness 通过≠内容达标。

input:
  prompt: |
    使用 $leo-ppt-generator，进入 execute 模式 generate 路线，完成以下委托任务。这是一次评测委托：内容与风格合同层是本次唯一交付物。
    
    【委托与边界】
    1. 委托执行：合同、大纲、母版、风格与版式决策均由你在授权范围内自主推进并记录为委托决策（decision_source: user-delegated，附依据），无需中途向用户确认；可逆决策自行完成内部审查并留痕。
    2. 停止点：完成「内容合同 → 大纲 → 逐页母版 → 风格选定（style list/load/render，同一 home，记录 selection_fingerprint 与归因一句）→ 版式调度（逐页 P 码）→ 容量预检」后即停止。不要生成样张或任何图片，不要派发任何 worker，不要调用图片 Provider；本次无需核对图片 Provider/worker 可用性。
    3. 落盘范围：一切产物只写入当前工作目录下的 ./project/ 子树（项目根目录用 ./project/；风格注册表 home 一律隔离在该子树内，如 ./project/leo-home/），不得写该子树之外的任何位置。
    4. 材料边界：只依据下面的任务简报与随附材料；不联网检索；不读取本任务输入之外的任何文件。材料/简报未给出的关键事实不足时，按合同纪律披露并收窄断言（unknown），不要编造。
    5. blocked 纪律：如遇无法可靠推断且必须用户补答的关键事实，记录 blocked 项与原因，继续完成其余部分；不得模拟用户答案或伪造人工确认。
    6. 完成后回复一页摘要：产物路径清单（合同/大纲/母版/风格选择记录/版式调度记录）、确切页数、风格选择与归因一句、容量预检结论（含软超如实报告）、blocked 清单（若有）。
    
    【任务简报】
    # 任务简报 U16 · 建筑工程 —— 产业园区项目主体结构封顶节点汇报
    
    - 行业：建筑工程（梯度 G2：无专属内容规则；存在同域风格资产「建筑工程风」）
    - 任务型：汇报（工程节点汇报）
    - 主要受众：业主与合规方（园区开发公司董事会代表 + 政府质量监督站备案口径）
    - 材料形态：直出（工期成本口径冲突，随附）
    - 难度型：冲突
    - 页数：**11 页**（含封面与收束页，从总数内分配）
    
    ## 委托方与背景
    
    你是 EPC 总包单位「恒基工程」该项目的技术负责人。项目为某市高新区的产业园区一期（4 栋厂房+1 栋综合楼，总建筑面积 11.6 万平米），刚实现主体结构全面封顶。按合同约定，总包需要向业主（园区开发公司）做节点汇报，同时该汇报将作为档案提交政府质量监督站备案。你受委托准备 11 页节点汇报稿。
    
    ## 任务目标
    
    汇报要完成：封顶节点的进度、质量、安全三线状态汇报；对下一阶段（二次结构与机电安装）的计划交底；对业主最关心的「投资完成情况与合同工期的关系」给出经得起追问的解释框架。行动目标是节点款支付申请获业主确认，且备案材料一次通过。
    
    ## 受众与场合
    
    业主侧为园区开发公司的工程管理与投资控制人员，合规侧为质监站的备案审查口径；场合为节点汇报会 30 分钟。这个场合的特殊性在于**双口径受众**：工程口看形象进度（产值口径），投资口看支付与投资完成（支付口径），两边对「完成多少」的数天然不同——汇报若只给一套数，另一边必然追问。
    
    ## 决策背景
    
    材料中存在本项目最敏感的口径冲突：形象进度（产值口径）已达 68%，而业主投资台账的投资完成率（支付口径）为 55%，监理月报按实物量统计的形象进度又是 66%——三个「进度」各自成立但差异显著（成因：产值确认时点、应付未付、质保金扣留规则、实物量统计规则）。业主投资口已私下表达疑虑「是不是虚报进度」，工程口则认为支付滞后拖累分包结算。汇报必须正面处理：三口径各自定义、差异成因逐项说明、对合同节点款支付申请采用哪一口径、依据是什么。回避冲突或静默选边，都会在备案环节被质监站或业主审计打回。
    
    ## 约束
    
    1. 三套口径的进度数字必须分别标注口径名称与统计规则，任何一页不得混用不同口径的进度数；对表呈现时须先给口径定义。
    2. 差异成因解释须逐项对应材料注释（产值确认规则、支付规则、质保金、实物量规则），不得笼统说「统计方式不同」。
    3. 节点款支付申请金额按合同与材料口径计算，计算过程可核；材料未含的合同金额细节显式 unknown 并注明获取路径。
    4. 质量与安全数据按材料如实呈现（含未闭合项清单），不得只报合格项；备案合规格式的表述（分部分项验收口径）按材料术语。
    5. 建筑工程术语规范（形象进度/产值/支付口径/分部分项工程等按行业含义使用），不得混用口语化提法（如「干到一半」）。
    
    ## 材料指引
    
    随附材料为《产业园一期主体封顶节点汇报资料包（总包内部）》，含三套进度口径数据与统计规则注释、质量验收数据（含未闭合项）、安全统计、合同支付条款摘要。**材料中同一项目存在三口径进度冲突，这是本单元的核心评测事实**：汇报对冲突的显式处理方式本身就是受评内容。
    
    【随附材料】（材料引用级来源，允许输入的全部；数字与口径以此为准）
    # 产业园一期主体封顶节点汇报资料包（总包内部）
    
    > 来源：总包项目部进度台账（截至 2026-10-31）、监理月报（2026-10 期）、业主投资台账抄录、质量验收记录（分部分项）、安全月报。密级：项目内部。
    
    ## 一、项目基本盘
    
    - 项目：高新区产业园区一期（4 栋标准厂房 + 1 栋综合楼），总建筑面积 11.6 万 m²
    - 总承包合同价：9.6 亿元（一期施工总承包 + 专业工程总承包，EPC 模式）
    - 合同工期：640 日历天；开累已用 428 天（较总控网络计划**提前 12 天**——总控口径）
    - 质保金：合同价 3%（按 9.6 亿 × 3% = 2,880 万元上限，随进度按比例留存）
    
    ## 二、三套进度口径（本项目最敏感数据区）
    
    | 口径 | 数值 | 统计规则（注释） |
    | --- | --- | --- |
    | 形象进度（产值口径，总包台账） | **68.4%** | 当月经监理签认计价的累计产值 / 合同价（产值确认时点滞后实物量 2-4 周） |
    | 形象进度（实物量口径，监理月报） | **66.1%** | 分部分项工程实物完成量加权（按清单工程量权重），不含未计量变更 |
    | 投资完成率（支付口径，业主投资台账） | **55.2%** | 实际支付金额 /（合同价 − 质保金）——支付滞后于计价，且含业主侧付款审批周期 |
    
    ### 差异成因逐项（总包商务组核对，2026-11-02）
    
    1. 产值 68.4% vs 实物量 66.1%（差 2.3pp）：产值含已签认的 11 项变更估价（约 2,180 万元，折 2.3pp）；实物量口径未计变更——**两数各自成立**。
    2. 产值 68.4% vs 支付 55.2%（差 13.2pp）：① 应付未付：已计价未支付 **1.87 亿元**（折约 19.5pp 减去质保金基数效应后的净差主体）；② 质保金按进度比例留存（已留存约 1,530 万元）；③ 业主付款审批周期平均 45 天。
    3. 监理实物量 66.1% vs 支付 55.2%：同上支付滞后因素，无独立成因。
    
    ## 三、节点款支付申请（合同条款摘要 + 本次申请）
    
    - 合同约定：主体结构封顶节点，业主累计支付至合同价（扣质保金基数）的 **60%**
    - 当前累计支付：5.30 亿元（业主台账口径）
    - 本次节点款申请：支付至 60% 应付 5.67 亿元（9.6 亿 × 60% ÷ 1.03 基数调整——**计算式按合同补充协议第 4.2 条**），申请额 0.37 亿元
    - 注：合同补充协议 4.2 条基数调整的计算细则原件在业主合约部，本项目部仅存摘要——**如需逐项核对请引用「按补充协议 4.2 条」，不得凭摘要复算对外承诺**（unknown 项）
    
    ## 四、质量状态（验收记录）
    
    - 主体分部工程验收：已完成 4/5 个子分部验收（合格）；综合楼屋面子分部待验收（计划 2026-11-20）
    - 实测实量合格率：主体结构 96.8%（评估机构第三方差值抽查口径）
    - **未闭合项清单（4 项）**：
      1. 2# 厂房三层剪力墙裂缝处理（检测报告已出：非结构裂缝；处理方案已报监理待批）
      2. 综合楼地下室底板局部渗漏返修（返修完成 80%）
      3. 钢结构焊缝探伤资料补录（第三方探伤报告 3 份待补）
      4. 见证取样台账与实体试块编号差 2 组（资料闭合项）
    - 混凝土标养强度：28d 合格率 100%（n=214 组）
    
    ## 五、安全状态（安全月报）
    
    - 连续安全生产 380 天（无重大及以上事故）
    - 隐患整改闭环率 98.6%（月度累计口径，未闭环 2 项：临边防护周转材料缺口、动火作业票个别过期补办）
    - 政府质量监督站中期监督检查：2026-08 抽查提出 5 条意见，已闭合 4 条（余 1 条与见证取样台账项同源）
    
    ## 六、下一阶段计划（二次结构与机电安装）
    
    - 二次结构：2026-11-15 插入，2027-03 完成（综合楼先行）
    - 机电安装：2026-12-01 插入，与二次结构流水搭接
    - 冬季施工措施费：已按北方冬施标准编列（金额测算见商务组台账，本次未含）
    
    ## 七、口径与红线注释
    
    1. 三套进度口径每处引用必须带口径名与规则；任何一页不得混用。
    2. 差异成因引用须逐项对应本包注释，不得笼统归为「统计方式不同」。
    3. 未闭合项如实呈报，不得只报合格率。
    4. 备案口径表述使用「分部分项工程」「子分部」等规范术语。

constraints:
  max_turns: 48
  timeout_seconds: 3600

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_content_execution_boundary.py
  timeout_seconds: 10

collect_artifacts:
  - "project/**"
