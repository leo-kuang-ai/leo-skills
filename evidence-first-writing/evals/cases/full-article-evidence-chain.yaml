id: full-article-evidence-chain
title: 完整证据型短文保留冲突与披露编辑说明
description: |
  验证从带冲突的来源包写研究解释文时：核心数字可映射到来源、冲突被保留而不是
  静默取平均或采信一方、终稿附带编辑说明披露未核验主张。对齐 eval-plan Case 1
  的确定性子集（盲审编辑 Judge 未自动化，见 claim ceiling）。
  2026-08-31 扩展（研究环执行纪律，对齐 source-analysis.md 新增三节）：断言 6
  要求研究输出含终止声明或缺口记录（带否定过滤，防「无缺口」类反话误判）；
  断言 7 要求数字归属到具体来源且不得虚构匿名信源；断言 8 要求关键摘录逐字保留。
  首跑基线（GLM flash）：iteration-1 FAIL 87.5%——缺口记录实质在场但措辞重掷
  （无从判断/材料不足/缺依据/未说明/没有给出），按同义词惯例扩 any-list 后
  iteration-2 复验 PASS 100%。

input:
  prompt: |
    请根据下面这份来源包写一篇 600-800 字中文研究解释文（evidence-explainer），说明星野云 2026 年第二季度的 P1 故障情况。不得编造材料之外的数字或事实。

    【原始报告 E101】2026 年第二季度，星野云生产环境共发生 4 次 P1 级故障，平均恢复时长 47 分钟，其中 3 次由变更发布引起。
    【冲突的二手报道】某科技媒体写道：「星野云 Q2 仅出现 2 次 P1 故障，恢复均在 20 分钟以内。」
    【授权声音样本一】先把恢复时长压下来，再谈别的。数字难看没关系，装作没看见才难看。
    【授权声音样本二】我的习惯是先给结论，再给证据；反过来写，我自己都不信。

constraints:
  timeout_seconds: 300
  max_turns: 2

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["47 分钟"]
    - output_contains:
        any: ["4 次", "四次"]
    - output_contains:
        any: ["2 次", "两次"]
    - output_contains:
        any: ["冲突", "矛盾", "不一致", "分歧", "无法同时成立"]
    - output_contains:
        any: ["编辑说明", "披露", "未解决", "待核", "假设"]
        not: ["平均恢复时长 20 分钟", "5 次 P1", "6 次 P1"]
    - output_contains:
        any: ["缺口", "无法核验", "未能核验", "无法确认", "无法确定", "无法判定", "未能确定", "难以判定", "无从判断", "材料不足", "缺依据", "未说明", "没有给出", "未给出", "来源包", "现有材料", "所给材料", "材料内", "材料之外"]
        not: ["无缺口", "没有缺口", "全部核验通过", "均已核验"]
    - output_contains:
        any: ["E101", "原始报告", "科技媒体", "媒体报道", "一手", "官方"]
        not: ["业内人士", "不愿具名", "据传", "据说"]
    - output_contains:
        any: ["平均恢复时长", "恢复时长"]
