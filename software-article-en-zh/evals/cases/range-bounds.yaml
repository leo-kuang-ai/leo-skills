id: range-bounds
title: at most / at least / no more than 上下界不互换
description: 验证 at most 10 译为"最多/不超过"邻接 10、at least 2 译为"至少"邻接 2、no more than 30 保留上界，且不出现无否定限定的"超过 30 秒"。

input:
  prompt: |
    请把下面这段连接池文档准确翻译成简体中文：

    The connection pool holds at most 10 connections and keeps at least 2 idle ones; under peak load the acquire timeout is no more than 30 seconds.

constraints:
  max_turns: 1

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_range_bounds.py
  timeout_seconds: 10
