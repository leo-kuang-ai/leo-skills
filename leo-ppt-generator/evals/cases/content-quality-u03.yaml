id: content-quality-u03
title: 跨行业内容质量 U03 医疗健康（直出（含随附材料））
description: |
  方案 005 跨行业内容质量测评单元：医疗健康。真实 agent 运行 execute 模式 generate
  路线至内容与风格合同完成、样张前截断；A1–A5 判据由评测侧 L0 机检与 L1 双判官在冻结
  产物上离线评审；内联 judge 仅检查停止点执行边界，harness 通过≠内容达标。

input:
  prompt: |
    使用 $leo-ppt-generator，进入 execute 模式 generate 路线，完成以下委托任务。这是一次评测委托：内容与风格合同层是本次唯一交付物。
    
    【委托与边界】
    1. 委托执行：合同、大纲、母版、风格与版式决策均由你在授权范围内自主推进并记录为委托决策（decision_source: user-delegated，附依据），无需中途向用户确认；可逆决策自行完成内部审查并留痕。
    2. 停止点：完成「内容合同 → 大纲 → 逐页母版 → 风格选定（style list/load/render，同一 home，记录 selection_fingerprint 与归因一句）→ 版式调度（逐页 P 码）→ 容量预检」后即停止。不要生成样张或任何图片，不要派发任何 worker，不要调用图片 Provider；本次无需核对图片 Provider/worker 可用性。
    3. 落盘范围：一切产物只写入当前工作目录下的 ./project/ 子树（项目根目录用 ./project/；风格注册表 home 一律隔离在该子树内，如 ./project/leo-home/），不得写该子树之外的任何位置。
    4. 材料边界：只依据下面的任务简报与随附材料；不联网检索；不读取本任务输入之外的任何文件。材料/简报未给出的关键事实不足时，按合同纪律披露并收窄断言（unknown），不要编造。
    5. blocked 纪律：如遇无法可靠推断且必须用户补答的关键事实，记录 blocked 项与原因，继续完成其余部分；不得模拟用户答案或伪造人工确认。
    6. 完成后回复一页摘要：产物路径清单（合同/大纲/母版/风格选择记录/版式调度记录）、确切页数、风格选择与归因一句、容量预检结论（含软超如实报告）、blocked 清单（若有）。
    
    【任务简报】
    # 任务简报 U03 · 医疗健康 —— 日间手术中心运行一年评估汇报
    
    - 行业：医疗健康（梯度 G1-rules：有专属内容规则）
    - 任务型：汇报（运行评估）
    - 主要受众：医院管理层（院长办公会，含分管医疗副院长、财务总监）
    - 材料形态：直出（临床+运营混合数据，随附）
    - 难度型：不确定
    - 页数：**12 页**（含封面与收束页，从总数内分配）
    
    ## 委托方与背景
    
    你是某三甲医院医务处的运营分析员。医院日间手术中心运行满一年，院里要在明年预算编制前决定：是否扩大中心床位规模、是否新增两个日间术种。院长办公会委托医务处先做一年运行评估。你负责把临床与运营数据整理成 12 页汇报稿，供医务处处长带会上会。
    
    ## 任务目标
    
    评估要回答：日间模式一年来对医院「效率—安全—费用」三个维度分别产生了什么影响；扩大规模与新增术种的两个决策各自的前提条件是否成熟。行动目标是让办公会形成「扩规模/暂缓/有条件扩」三选一的明确决议。
    
    ## 受众与场合
    
    院长办公会，成员是临床出身的管理者与财务管理者，临床语言与财务语言都要能落地；场合为办公会汇报议程 25 分钟。受众重视数据严谨性：小样本结论被过度包装会当场被分管副院长质疑。
    
    ## 决策背景
    
    中心运行一年 data 上有两个互相拉扯的信号：运营侧床位周转与结余贡献亮眼，是扩规模的直接论据；临床侧部分新增术种例数还少、48 小时非计划再入院虽低但置信区间宽，且日间手术适应症的行业指南正在修订、有望放宽（但尚未发布）。财务侧还有一个外部变量：医保支付方式改革明年试点按病组付费，日间模式的费用优势是否持续存在不确定性。
    
    ## 约束
    
    1. 临床数据（再入院率、并发症率等）必须按材料中的例数与区间呈现，不得把小样本点值写成确定性结论；例数不足的术种单独列出并明示局限。
    2. 疗效与安全性表述不得绝对化：不得出现「零风险」「彻底解决」类说法；材料中随访完成率带来的偏倚须披露。
    3. 指南修订、医保改革属于外部不确定因素，须作为决策前提显式呈现（情景或条件式表述），不得假设其结果。
    4. 扩规模的建议若涉及金额或床位数，须有材料内测算或显式 unknown。
    5. 语体符合院内汇报规范：术语使用临床规范表述，商务渲染话术不得出现。
    
    ## 材料指引
    
    随附材料为《日间手术中心 2025 运行年度报告（数据附表）》，临床板块（术种结构、安全指标、随访）与运营板块（床位、时长、费用结余）口径不同，临床指标注明了例数与区间、运营指标注明了统计时点。材料末尾附有随访完成率与问卷回收的偏倚说明，须纳入汇报的局限性讨论。
    
    【随附材料】（材料引用级来源，允许输入的全部；数字与口径以此为准）
    # 日间手术中心 2025 运行年度报告（数据附表）
    
    > 来源：医务处手术麻醉系统导出（统计期 2025-01-01 至 2025-12-31）、病案首页质控库、财务处项目核算（口径见各表）、护理部排班系统。密级：院内。
    
    ## 一、总量与结构（手术麻醉系统）
    
    - 全年日间手术：3,147 台（2024 年：2,213 台）
    - 占全院择期手术比例：31%（口径：日间台次 / 全院择期手术台次）
    - 术种结构 Top5：
      - 白内障超声乳化 812 台
      - 腹股沟疝修补 534 台
      - 腹腔镜胆囊切除 388 台
      - 宫腔镜检查/治疗 296 台
      - 膝关节镜 187 台
    - 拟新增候选术种：甲状腺腺叶切除（意向术者团队年侧流量估计约 60-80 台，**无本院实测数据**）、肛瘘手术（预估 40-60 台/年，**估算**）
    
    ## 二、安全指标（病案首页质控库）
    
    - 48 小时非计划再入院：28 例，发生率 0.89%（95%CI 0.59%–1.28%，按 Poisson 近似；2024 年 0.72%，例数 16）
    - Clavien-Dindo ≥III 级并发症：13 例，发生率 0.41%（95%CI 0.22%–0.71%）
    - 72 小时内非计划再手术：4 例（0.13%）
    - 术后随访完成率：82%（口径：术后 72h 电话随访接通并完成评估的比例；漏访集中于工作日白天手术的通勤患者——存在选择性偏倚，解读安全率时须注明）
    - 分术种安全事件数过少（多数术种 0-2 例），**不支撑术种级率值比较**，仅列绝对数
    
    ## 三、运营指标（财务处项目核算 + 护理部）
    
    - 床位周转：1.8 次/床·日（2024 年：1.2）
    - 平均住院时长：9.2 小时（入院至离院，口径含术前等候）
    - 项目直接结余贡献：843 万元（口径：日间中心收入 - 直接成本〔耗材、药品、人力、床位占用分摊〕；不含手术室公共成本分摊，口径与全院科室结余表不可直接对表）
    - 日间床位：32 张；护士配置比 1:3.5（护士:床位时段比，排班系统口径）
    - 患者次均费用：较同术种住院模式低 31%（病种测算口径：直接费用部分）
    
    ## 四、外部环境与指南状态（医务处情报摘要）
    
    - 中华医学会相关学组《日间手术适应症目录》正在修订（2026 版征求意见稿已放出，拟扩大日间适应症范围；**尚未发布，不得作为现行依据引用**）
    - 本市 DRG 付费改革：2027 年起本院纳入首批试点（试点细则未定；日间模式的费用优势是否延续取决于病组支付标准设定——外部不确定）
    - 周边两家同级医院已开设日间中心（其中一家 2025 年下半年开台）
    
    ## 五、规模扩容的两个前置问题（院长办公会预沟通纪要）
    
    - 床位从 32 张扩至 56 张的可行性：术前评估区与麻醉恢复室（PACU）容量是否同步——基建处尚未出测算（**unknown，补齐时限：2027-01，owner：基建处**）
    - 新增术种的医护授权路径：甲状腺日间需新增 2 名主刀授权 + 麻醉团队专项培训（培训周期约 3 个月，医务处口径）
    
    ## 六、口径与红线注释
    
    1. 安全指标必须带例数/区间呈现，不得只给点值；小样本术种不得做率值排序。
    2. 随访完成率 82% 的偏倚须在结论中披露。
    3. 结余贡献口径与全院报表口径不同，引用时注明「项目直接结余」。
    4. 指南修订与 DRG 改革均属未落地外部变量，只能作为情景/前提呈现。

constraints:
  max_turns: 48
  timeout_seconds: 3600

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_content_execution_boundary.py
  timeout_seconds: 10

collect_artifacts:
  - "project/**"
