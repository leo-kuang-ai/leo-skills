id: publication-risk-hedge-strength
title: 发布型润色保留风险弱化语气
description: might/cannot guarantee/at most 等风险弱化表述在发布润色后不得被强化为确定性结论。

input:
  prompt: |
    请把下面这段变更公告翻译成简体中文，并按官方技术运营文风润色至可发布水平：

    Heads-up before you upgrade: the migration might temporarily increase write latency by up to 30 ms. The read-through cache cannot guarantee consistency across regions during failover. At most two replicas may lag behind at any time, and stale reads are possible while the backlog drains.

constraints:
  max_turns: 1

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_publication_risk_hedge.py
  timeout_seconds: 10
