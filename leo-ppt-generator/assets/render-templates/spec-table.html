<!doctype html>
<!-- leo render lane 模板：spec-table（R-28 / P25 规格参数表）
  槽位语义对齐 12_版式库 P25_Spec_Table sidecar：表头行（角色区分底色）+
  斑马纹数据行 + 数值列右对齐；3 列时列宽 30%/45%/25%，其余均分。
  数据合同见同目录 README.md 与 references/render-contract.md。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>spec-table</title>
<style>
  @font-face {
    font-family: "Noto Sans SC";
    src: url(/leo-fonts/NotoSansSC-Regular.otf) format("opentype");
    font-weight: 400;
  }
  @font-face {
    font-family: "Noto Sans SC";
    src: url(/leo-fonts/NotoSansSC-Bold.otf) format("opentype");
    font-weight: 700;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    font-family: "Noto Sans SC", sans-serif;
    background: #f7f5f0; color: #1f2430; position: relative;
  }
  .leo-slide { width: 1280px; height: 720px; padding: 68px 90px 64px; display: flex; flex-direction: column; }
  .title {
    font-size: 46px; font-weight: 700; color: #14213d; line-height: 1.25;
    padding-bottom: 20px; border-bottom: 3px solid #d8cfbd; margin-bottom: 30px;
  }
  table.spec { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.spec col.w-name { width: 30%; }
  table.spec col.w-value { width: 45%; }
  table.spec col.w-note { width: 25%; }
  table.spec th {
    background: #14213d; color: #f7f5f0; font-size: 26px; font-weight: 700;
    text-align: left; padding: 16px 18px; letter-spacing: 0.04em;
  }
  table.spec td {
    font-size: 25px; line-height: 1.5; color: #2c3242;
    padding: 15px 18px; border-bottom: 1px solid #d8cfbd;
    overflow-wrap: break-word;
  }
  table.spec tr:nth-child(even) td { background: #efeae0; }
  table.spec th.num, table.spec td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .page-no { position: absolute; right: 44px; bottom: 30px; font-size: 22px; color: #8d8578; }
  html[data-leo-render] *, html[data-leo-render] *::before, html[data-leo-render] *::after {
    animation: none !important; transition: none !important;
  }
</style>
</head>
<body>
  <main class="leo-slide" id="leo-slide">
    <h1 class="title" data-leo-block="title"></h1>
    <table class="spec" data-leo-block="spec-table">
      <thead data-leo-block="spec-head"></thead>
      <tbody data-leo-block="spec-body"></tbody>
    </table>
  </main>
  <div class="page-no" data-leo-block="page-no"></div>
<script>
  if (new URLSearchParams(window.location.search).get("leo_render") === "1") {
    document.documentElement.dataset.leoRender = "1";
  }
  function applyData(data) {
    data = data || {};
    document.querySelector('[data-leo-block="title"]').textContent = data.title || "";
    var columns = Array.isArray(data.columns) ? data.columns : [];
    var aligns = Array.isArray(data.column_align) ? data.column_align : [];
    var rows = Array.isArray(data.rows) ? data.rows : [];
    var head = document.querySelector('[data-leo-block="spec-head"]');
    var body = document.querySelector('[data-leo-block="spec-body"]');
    if (!columns.length || !rows.length) { return; }
    var table = document.querySelector('[data-leo-block="spec-table"]');
    // 3 列时按 P25 语义分配列宽（参数名 30% / 值 45% / 备注 25%），其余均分。
    if (columns.length === 3) {
      ["w-name", "w-value", "w-note"].forEach(function (cls) {
        var col = document.createElement("col");
        col.setAttribute("class", cls);
        table.insertBefore(col, head);
      });
    } else {
      columns.forEach(function () {
        var col = document.createElement("col");
        table.insertBefore(col, head);
      });
    }
    var headRow = document.createElement("tr");
    columns.forEach(function (name, i) {
      var th = document.createElement("th");
      th.setAttribute("data-leo-block-item", "column");
      th.textContent = String(name);
      if (aligns[i] === "right") { th.setAttribute("class", "num"); }
      headRow.appendChild(th);
    });
    head.appendChild(headRow);
    rows.forEach(function (row) {
      var tr = document.createElement("tr");
      (Array.isArray(row) ? row : []).forEach(function (cell, i) {
        var td = document.createElement("td");
        td.setAttribute("data-leo-block-item", "cell");
        td.textContent = cell == null ? "" : String(cell);
        if (aligns[i] === "right") { td.setAttribute("class", "num"); }
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
    document.querySelector('[data-leo-block="page-no"]').textContent =
      data.page_no != null ? String(data.page_no) : "";
  }
  applyData(window.__LEO_SLIDE_DATA__);
  document.fonts.ready.then(function () {
    document.documentElement.dataset.leoReady = "1";
  });
</script>
</body>
</html>
